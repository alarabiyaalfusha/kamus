ُرَ مَقَالِي الْأَوَّلَ.","Saya sangat ragu sebelum menerbitkan artikel pertama saya."],["B2","2581","يُسَاعِدُنِي الرَّسْمُ عَلَى التَّعْبِيرِ حِينَ تَعْجِزُ الْكَلِمَاتُ.","Menggambar membantu saya mengungkapkan diri ketika kata-kata tidak cukup."],["B2","2582","أَطْلُبُ مِنْ صَدِيقٍ أَنْ يَقْرَأَ نَصِّي وَيُعْطِيَنِي رَأْيَهُ بِصَرَاحَةٍ.","Saya meminta seorang teman membaca tulisan saya dan memberi pendapat jujur."],["B2","2583","الْخُلَاصَةُ تُلَخِّصُ الْفِكْرَةَ الرَّئِيسِيَّةَ وَلَا تَأْتِي بِجَدِيدٍ.","Kesimpulan meringkas gagasan utama dan tidak membawa hal baru."],["B2","2584","كَتَبْتُ رِسَالَةً لِصَدِيقٍ قَدِيمٍ وَشَعَرْتُ بِرَاحَةٍ كَبِيرَةٍ.","Saya menulis surat kepada sahabat lama dan merasa sangat lega."],["B2","2585","الْأَدَبُ يُعَلِّمُنَا أَنْ نَرَى الْعَالَمَ بِعُيُونِ غَيْرِنَا.","Sastra mengajari kita melihat dunia dengan mata orang lain."],["B2","2586","أَحْتَاجُ إِلَى وَقْتٍ لِلتَّفْكِيرِ قَبْلَ أَنْ أَكْتُبَ.","Saya butuh waktu berpikir sebelum menulis."],["B2","2587","الْقِرَاءَةُ الْوَاسِعَةُ تُغْنِي أُسْلُوبَ الْكَاتِبِ وَتُوَسِّعُ خَيَالَهُ.","Membaca luas memperkaya gaya penulis dan memperluas imajinasinya."],["B2","2588","الْعُنْوَانُ الْجَيِّدُ يَجْذِبُ الْقَارِئَ وَيَخْتَصِرُ الْفِكْرَةَ.","Judul yang baik menarik pembaca dan meringkas gagasan."],["B2","2589","بَعْدَ أَنْ أَنْهَيْتُ الْمُسَوَّدَةَ تَرَكْتُهَا يَوْمًا ثُمَّ عُدْتُ إِلَيْهَا بِعَيْنٍ جَدِيدَةٍ.","Setelah selesai draf, saya meninggalkannya sehari lalu kembali dengan mata segar."],["B2","2590","يَصِفُ الْكَاتِبُ الْمَشْهَدَ بِتَفَاصِيلَ تَجْعَلُكَ تَرَاهُ بِعَيْنَيْكَ.","Penulis menggambarkan adegan dengan detail yang membuatmu seolah melihatnya."],["B2","2591","أَحْتَفِظُ بِدَفْتَرٍ صَغِيرٍ لِأُدَوِّنَ الْأَفْكَارَ الَّتِي تَخْطُرُ عَلَى بَالِي.","Saya menyimpan buku kecil untuk mencatat ide yang terlintas di benak."],["B2","2592","يَعْتَمِدُ الْعِلْمُ عَلَى الْمُلَاحَظَةِ وَالتَّجْرِبَةِ لَا عَلَى التَّخْمِينِ.","Sains bergantung pada pengamatan dan percobaan, bukan dugaan."],["B2","2593","اكْتَشَفَ الْعُلَمَاءُ نَوْعًا جَدِيدًا مِنَ الْكَائِنَاتِ فِي أَعْمَاقِ الْمُحِيطِ.","Para ilmuwan menemukan jenis makhluk baru di kedalaman samudra."],["B2","2594","يَحْتَاجُ الْبَاحِثُ إِلَى صَبْرٍ كَبِيرٍ لِأَنَّ النَّتَائِجَ لَا تَأْتِي سَرِيعًا.","Peneliti membutuhkan kesabaran besar karena hasil tidak datang cepat."],["B2","2595","لَقَدْ غَيَّرَ اكْتِشَافُ الْكَهْرَبَاءِ حَيَاةَ الْبَشَرِ تَمَامًا.","Penemuan listrik telah mengubah hidup manusia sepenuhnya."],["B2","2596","نَشَرَ الْفَرِيقُ نَتَائِجَ بَحْثِهِ فِي مَجَلَّةٍ عِلْمِيَّةٍ مُحَكَّمَةٍ.","Tim itu menerbitkan hasil penelitiannya di jurnal ilmiah yang ditelaah sejawat."],["B2","2597","لِكُلِّ ظَاهِرَةٍ سَبَبٌ، وَمَهَمَّةُ الْعِلْمِ أَنْ يَكْشِفَهُ.","Setiap gejala ada sebabnya, dan tugas sains adalah mengungkapnya."],["B2","2598","يَدْرُسُ الْفَلَكِيُّونَ حَرَكَةَ الْكَوَاكِبِ مُنْذُ آلَافِ السِّنِينَ.","Para astronom mempelajari gerak planet sejak ribuan tahun."],["B2","2599","لَا بُدَّ مِنَ التَّأَكُّدِ مِنَ الْفَرَضِيَّةِ قَبْلَ تَعْمِيمِ النَّتِيجَةِ.","Hipotesis harus diuji sebelum hasilnya digeneralisasi."],["B2","2600","سَاعَدَ الْمِجْهَرُ عَلَى رُؤْيَةِ عَالَمٍ كَانَ مَخْفِيًّا عَنَّا.","Mikroskop membantu melihat dunia yang tadinya tersembunyi dari kita."],["B2","2601","يُفَرِّقُ الْعِلْمُ بَيْنَ الْوَاقِعِ وَالْأُسْطُورَةِ بِالدَّلِيلِ.","Sains membedakan antara kenyataan dan mitos dengan bukti."],["B2","2602","تُسَاهِمُ الْأَبْحَاثُ فِي إِيجَادِ عِلَاجَاتٍ لِأَمْرَاضٍ كَانَتْ مُسْتَعْصِيَةً.","Penelitian berkontribusi menemukan pengobatan bagi penyakit yang dulu sulit disembuhkan."],["B2","2603","أَمْضَيْتُ سَنَتَيْنِ فِي الْمُخْتَبَرِ قَبْلَ أَنْ أَحْصُلَ عَلَى نَتِيجَةٍ وَاحِدَةٍ.","Saya menghabiskan dua tahun di laboratorium sebelum mendapat satu hasil."],["B2","2604","هُنَاكَ فَرْقٌ بَيْنَ الِارْتِبَاطِ وَالسَّبَبِيَّةِ فِي الْإِحْصَاءِ.","Ada perbedaan antara korelasi dan sebab-akibat dalam statistik."],["B2","2605","يَسْتَطِيعُ الْقَمَرُ الصِّنَاعِيُّ أَنْ يُصَوِّرَ الْأَرْضَ مِنَ الْفَضَاءِ.","Satelit dapat memotret bumi dari antariksa."],["B2","2606","كُلُّ اكْتِشَافٍ جَدِيدٍ يَفْتَحُ أَسْئِلَةً أَكْثَرَ مِمَّا يُجِيبُ.","Setiap penemuan baru membuka lebih banyak pertanyaan daripada jawaban."],["B2","2607","يُمْكِنُنَا أَنْ نَتَعَلَّمَ كَثِيرًا مِنْ مُلَاحَظَةِ الطَّبِيعَةِ.","Kita bisa belajar banyak dari mengamati alam."],["B2","2608","يُنْقِذُ التَّطْعِيمُ حَيَاةَ الْمَلَايِينِ كُلَّ عَامٍ.","Vaksinasi menyelamatkan nyawa jutaan orang setiap tahun."],["B2","2609","تُفِيدُنَا نَظَرِيَّاتُ الْعُلَمَاءِ فِي فَهْمِ الْكَوْنِ حَتَّى إِنْ لَمْ نُدْرِكْ فَائِدَتَهَا فَوْرًا.","Teori para ilmuwan bermanfaat bagi kita dalam memahami alam semesta meskipun manfaatnya tidak segera tampak."],["B2","2610","يَعْتَمِدُ اقْتِصَادُ الْمِنْطَقَةِ عَلَى الزِّرَاعَةِ وَتَرْبِيَةِ الْمَوَاشِي.","Ekonomi kawasan itu bergantung pada pertanian dan peternakan."],["B2","2611","يَسْتَخْدِمُ الْمُزَارِعُونَ تَقْنِيَاتٍ حَدِيثَةً لِتَوْفِيرِ الْمَاءِ فِي الرَّيِّ.","Para petani menggunakan teknologi modern untuk menghemat air irigasi."],["B2","2612","بَدَأَ الْمَصْنَعُ الْجَدِيدُ إِنْتَاجَهُ الْأُسْبُوعَ الْمَاضِيَ.","Pabrik baru mulai berproduksi minggu lalu."],["B2","2613","تَجِبُ مُرَاقَبَةُ الْجَوْدَةِ فِي كُلِّ مَرْحَلَةٍ مِنَ التَّصْنِيعِ.","Mutu harus diawasi di setiap tahap manufaktur."],["B2","2614","حَصَدَ الْفَلَّاحُونَ الْقَمْحَ فِي نِهَايَةِ الصَّيْفِ.","Para petani memanen gandum di akhir musim panas."],["B2","2615","تَسْعَى الدَّوْلَةُ إِلَى تَحْقِيقِ الِاكْتِفَاءِ الذَّاتِيِّ مِنَ الْغِذَاءِ.","Negara berupaya mencapai swasembada pangan."],["B2","2616","الزِّرَاعَةُ الْعُضْوِيَّةُ تَسْتَخْدِمُ مَوَادَّ طَبِيعِيَّةً بَدَلًا مِنَ الْكِيمَاوِيَّاتِ.","Pertanian organik memakai bahan alami sebagai ganti bahan kimia."],["B2","2617","تُصَدِّرُ الْبِلَادُ مُنْتَجَاتِهَا إِلَى أَكْثَرَ مِنْ ثَلَاثِينَ دَوْلَةً.","Negara itu mengekspor produknya ke lebih dari tiga puluh negara."],["B2","2618","يَعْمَلُ الْعُمَّالُ فِي الْمَصْنَعِ عَلَى ثَلَاثِ نَوْبَاتٍ.","Para pekerja di pabrik bekerja dalam tiga sif."],["B2","2619","تُوَفِّرُ الْمَشَارِيعُ الزِّرَاعِيَّةُ الصَّغِيرَةُ فُرَصَ عَمَلٍ لِلشَّبَابِ فِي الْأَرْيَافِ.","Proyek pertanian kecil menyediakan lapangan kerja bagi pemuda di pedesaan."],["B2","2620","اضْطُرَّ الْمَصْنَعُ إِلَى الْإِغْلَاقِ بِسَبَبِ نَقْصِ الْمَوَادِّ الْخَامِّ.","Pabrik terpaksa tutup karena kekurangan bahan baku."],["B2","2621","يَقُومُ الْمُهَنْدِسُ الزِّرَاعِيُّ بِفَحْصِ التُّرْبَةِ قَبْلَ الزِّرَاعَةِ.","Insinyur pertanian memeriksa tanah sebelum bercocok tanam."],["B2","2622","تَرْتَفِعُ تَكَالِيفُ الْإِنْتَاجِ حِينَ تَرْتَفِعُ أَسْعَارُ الطَّاقَةِ.","Biaya produksi naik ketika harga energi naik."],["B2","2623","الصِّنَاعَاتُ الْيَدَوِيَّةُ تُحَافِظُ عَلَى الْهُوِيَّةِ وَتَدُرُّ دَخْلًا.","Kerajinan tangan menjaga identitas dan mendatangkan penghasilan."],["B2","2624","يَسْقِي الْمُزَارِعُ أَرْضَهُ فَجْرًا لِيَتَجَنَّبَ حَرَارَةَ النَّهَارِ.","Petani menyirami tanahnya di waktu fajar untuk menghindari panas siang."],["B2","2625","يَتَطَلَّبُ تَحْدِيثُ الْمَصَانِعِ تَدْرِيبَ الْعُمَّالِ عَلَى الْآلَاتِ الْجَدِيدَةِ.","Modernisasi pabrik membutuhkan pelatihan pekerja pada mesin-mesin baru."],["B2","2626","تُسَاعِدُ التَّعَاوُنِيَّاتُ الزِّرَاعِيَّةُ الْمُزَارِعِينَ عَلَى بَيْعِ مَحَاصِيلِهِمْ بِسِعْرٍ عَادِلٍ.","Koperasi pertanian membantu petani menjual hasil panen dengan harga adil."],["B2","2627","اسْتَوْرَدَتِ الدَّوْلَةُ كَمِّيَّاتٍ كَبِيرَةً مِنَ الْأَرُزِّ هَذَا الْعَامَ.","Negara mengimpor beras dalam jumlah besar tahun ini."],["B2","2628","يُرَاعِي الْمَصْنَعُ مَعَايِيرَ السَّلَامَةِ لِحِمَايَةِ الْعَامِلِينَ.","Pabrik memperhatikan standar keselamatan untuk melindungi pekerja."],["B2","2629","بَدَأْتُ مَشْرُوعِي الصَّغِيرَ بِمَبْلَغٍ بَسِيطٍ وَفِكْرَةٍ وَاضِحَةٍ.","Saya memulai usaha kecil dengan modal sederhana dan ide yang jelas."],["B2","2630","الْفِكْرَةُ الْجَيِّدَةُ لَا تَكْفِي دُونَ تَنْفِيذٍ صَحِيحٍ.","Ide bagus saja tidak cukup tanpa pelaksanaan yang tepat."],["B2","2631","عَلَيْكَ أَنْ تَدْرُسَ السُّوقَ جَيِّدًا قَبْلَ أَنْ تُطْلِقَ مُنْتَجَكَ.","Kamu harus mempelajari pasar dengan baik sebelum meluncurkan produkmu."],["B2","2632","لَا تَخَفْ مِنَ الْفَشَلِ، فَهُوَ مُعَلِّمٌ جَيِّدٌ لِرَائِدِ الْأَعْمَالِ.","Jangan takut gagal, sebab ia guru yang baik bagi pengusaha."],["B2","2633","الْمُسْتَثْمِرُ يَبْحَثُ عَنْ فَرِيقٍ قَوِيٍّ أَكْثَرَ مِمَّا يَبْحَثُ عَنْ فِكْرَةٍ.","Investor mencari tim yang kuat lebih daripada mencari ide."],["B2","2634","رَاجَعْنَا خُطَّةَ الْعَمَلِ وَعَدَّلْنَا الْمِيزَانِيَّةَ.","Kami meninjau rencana bisnis dan menyesuaikan anggaran."],["B2","2635","الْعَمِيلُ الرَّاضِي هُوَ أَفْضَلُ إِعْلَانٍ لِأَيِّ مَشْرُوعٍ.","Pelanggan yang puas adalah iklan terbaik bagi usaha apa pun."],["B2","2636","لَمْ أَتَوَقَّعْ أَنْ يَنْمُوَ مَشْرُوعِي بِهَذِهِ السُّرْعَةِ.","Saya tidak menyangka usaha saya berkembang secepat ini."],["B2","2637","نَحْتَاجُ إِلَى شَرِيكٍ يُكَمِّلُ نَقَاطَ ضَعْفِنَا.","Kami membutuhkan mitra yang melengkapi kelemahan kami."],["B2","2638","أَصْعَبُ مَا فِي الْبِدَايَةِ هُوَ جَذْبُ الْعُمَلَاءِ الْأَوَائِلِ.","Yang tersulit di awal adalah menarik pelanggan-pelanggan pertama."],["B2","2639","نَحْنُ نُوَازِنُ بَيْنَ النُّمُوِّ السَّرِيعِ وَالِاسْتِدَامَةِ.","Kami menyeimbangkan antara pertumbuhan cepat dan keberlanjutan."],["B2","2640","تَوَقَّفْتُ عَنِ الْعَمَلِ لِدَى الْآخَرِينَ لِأُدِيرَ مَشْرُوعِي الْخَاصَّ.","Saya berhenti bekerja pada orang lain untuk mengelola usaha saya sendiri."],["B2","2641","مِنَ الْمُهِمِّ أَنْ نَسْتَمِعَ إِلَى شَكَاوَى الْعُمَلَاءِ وَنَتَعَلَّمَ مِنْهَا.","Penting bagi kita mendengarkan keluhan pelanggan dan belajar darinya."],["B2","2642","نَحْتَاجُ إِلَى مَوْقِعٍ إِلِكْتُرُونِيٍّ احْتِرَافِيٍّ يَعْرِضُ مُنْتَجَاتِنَا.","Kami butuh situs web profesional yang menampilkan produk kami."],["B2","2643","تَعَلَّمْتُ أَنَّ الْمُرُونَةَ أَهَمُّ مِنَ الْخُطَّةِ الْمِثَالِيَّةِ.","Saya belajar bahwa fleksibilitas lebih penting daripada rencana sempurna."],["B2","2644","بِفَضْلِ دَعْمِ عَائِلَتِي اسْتَطَعْتُ أَنْ أُوَاصِلَ.","Berkat dukungan keluarga saya, saya mampu terus melanjutkan."],["B2","2645","تَعَلَّمْنَا أَنْ نَبْدَأَ صَغِيرًا ثُمَّ نَتَوَسَّعَ بِحَسَبِ الطَّلَبِ.","Kami belajar memulai dari kecil lalu berkembang sesuai permintaan."],["B2","2646","يَجِبُ أَنْ يَكُونَ لِلْمَشْرُوعِ هَدَفٌ وَاضِحٌ وَرِسَالَةٌ يَفْهَمُهَا الْجَمِيعُ.","Usaha harus punya tujuan yang jelas dan pesan yang dipahami semua orang."],["B2","2647","الصِّدْقُ أَسَاسُ كُلِّ عَلَاقَةٍ نَاجِحَةٍ.","Kejujuran adalah dasar setiap hubungan yang berhasil."],["B2","2648","مِنَ الْمُرُوءَةِ أَنْ نُسَاعِدَ مَنْ لَا يَسْتَطِيعُ أَنْ يَرُدَّ لَنَا الْجَمِيلَ.","Termasuk keluhuran budi menolong orang yang tidak mampu membalas kebaikan kita."],["B2","2649","الْأَمَانَةُ لَيْسَتْ فِي الْمَالِ فَقَطْ، بَلْ فِي الْكَلِمَةِ وَالْوَقْتِ أَيْضًا.","Amanah bukan hanya dalam harta, tetapi juga dalam perkataan dan waktu."],["B2","2650","لَا يَجُوزُ أَنْ نَسْخَرَ مِنْ ضَعْفِ أَحَدٍ أَوْ فَقْرِهِ.","Tidak boleh kita mengejek kelemahan atau kemiskinan siapa pun."],["B2","2651","الِاحْتِرَامُ لَا يَعْنِي الْمُوَافَقَةَ عَلَى كُلِّ شَيْءٍ.","Menghormati tidak berarti menyetujui segalanya."],["B2","2652","الْعَدْلُ يَعْنِي أَنْ نُعْطِيَ كُلَّ ذِي حَقٍّ حَقَّهُ.","Keadilan berarti memberikan hak kepada setiap yang berhak."],["B2","2653","مَنْ يَعْتَرِفُ بِخَطَئِهِ أَقْوَى مِمَّنْ يُصِرُّ عَلَيْهِ.","Siapa mengakui kesalahannya lebih kuat daripada yang bersikeras padanya."],["B2","2654","الْكَرَمُ لَيْسَ فِي كَثْرَةِ الْمَالِ بَلْ فِي سَخَاءِ الْقَلْبِ.","Kedermawanan bukan pada banyaknya harta tetapi pada kemurahan hati."],["B2","2655","عَلَيْنَا أَنْ نَكُونَ مُتَوَاضِعِينَ فِي النَّجَاحِ وَصَابِرِينَ فِي الشِّدَّةِ.","Kita harus rendah hati dalam keberhasilan dan sabar dalam kesulitan."],["B2","2656","لَا تَظْلِمْ أَحَدًا فَإِنَّ الظُّلْمَ ظُلُمَاتٌ.","Jangan menzalimi siapa pun, sebab kezaliman adalah kegelapan."],["B2","2657","الْوَفَاءُ بِالْوَعْدِ مِنْ أَهَمِّ الْقِيَمِ فِي الْعَمَلِ وَالْحَيَاةِ.","Menepati janji adalah salah satu nilai terpenting dalam kerja dan hidup."],["B2","2658","الْغِيبَةُ تُفْسِدُ الْعَلَاقَاتِ وَتُضْعِفُ الثِّقَةَ بَيْنَ النَّاسِ.","Bergunjing merusak hubungan dan melemahkan kepercayaan antar manusia."],["B2","2659","نَحْتَرِمُ الْوَقْتَ لِأَنَّهُ أَغْلَى مَا نَمْلِكُ.","Kita menghormati waktu karena itu hal paling berharga yang kita miliki."],["B2","2660","تَصْرِفُ الْقِيَمُ سُلُوكَنَا حِينَ لَا يَرَانَا أَحَدٌ.","Nilai-nilai mengarahkan perilaku kita ketika tidak ada yang melihat."],["B2","2661","الْعَفْوُ عِنْدَ الْمَقْدِرَةِ مِنْ أَجْمَلِ صِفَاتِ الْكِرَامِ.","Memaafkan ketika mampu membalas adalah salah satu sifat terindah orang mulia."],["B2","2663","لَا تَحْكُمْ عَلَى الْإِنْسَانِ قَبْلَ أَنْ تَعْرِفَ ظُرُوفَهُ.","Jangan menghakimi seseorang sebelum mengetahui keadaannya."],["B2","2664","يُثْرِي التَّعَرُّفُ عَلَى ثَقَافَاتٍ مُخْتَلِفَةٍ نَظْرَتَنَا إِلَى الْعَالَمِ.","Mengenal budaya yang berbeda memperkaya cara pandang kita terhadap dunia."],["B2","2665","قَدْ تَبْدُو عَادَاتُ النَّاسِ غَرِيبَةً حَتَّى نَفْهَمَ أَسْبَابَهَا.","Kebiasaan orang mungkin tampak aneh sampai kita memahami sebabnya."],["B2","2666","فِي بَعْضِ الثَّقَافَاتِ يُعَدُّ الْحَدِيثُ الْمُبَاشِرُ وَقَاحَةً.","Dalam sebagian budaya, berbicara langsung dianggap tidak sopan."],["B2","2667","نَتَبَادَلُ الْمَعْرِفَةَ وَلَا يُلْغِي أَحَدُنَا الْآخَرَ.","Kita bertukar pengetahuan dan tidak ada yang meniadakan yang lain."],["B2","2668","تَعَلَّمْتُ مِنْ أَصْدِقَائِي الْأَجَانِبِ أَشْيَاءَ لَمْ أَجِدْهَا فِي الْكُتُبِ.","Saya belajar dari teman-teman asing hal-hal yang tidak saya temukan di buku."],["B2","2669","نَعِيشُ فِي عَالَمٍ مُتَرَابِطٍ وَلَا بُدَّ مِنَ التَّفَاهُمِ.","Kita hidup di dunia yang saling terhubung dan saling pengertian itu perlu."],["B2","2670","يُفِيدُنَا الْمَطْبَخُ فِي التَّعَرُّفِ عَلَى ثَقَافَةِ الشُّعُوبِ.","Dapur membantu kita mengenal budaya suatu bangsa."],["B2","2671","لَا يَعْنِي الِاخْتِلَافُ فِي الدِّينِ أَوِ اللُّغَةِ أَنْ نَتَصَارَعَ.","Perbedaan agama atau bahasa tidak berarti kita harus bertikai."],["B2","2672","مِنَ اللَّبَاقَةِ أَنْ نَتَعَلَّمَ بِضْعَ كَلِمَاتٍ مِنْ لُغَةِ الْمُضِيفِ.","Termasuk kesantunan mempelajari beberapa kata dari bahasa tuan rumah."],["B2","2673","رَغْمَ اخْتِلَافِ الْعَادَاتِ، تَجْمَعُنَا قِيَمٌ إِنْسَانِيَّةٌ وَاحِدَةٌ.","Meskipun kebiasaan berbeda, kita dipersatukan oleh nilai-nilai kemanusiaan yang sama."],["B2","2674","كُلُّ ثَقَافَةٍ لَهَا جَمَالُهَا وَلَا يَنْبَغِي أَنْ نَسْتَصْغِرَ أَيَّةَ وَاحِدَةٍ.","Setiap budaya memiliki keindahannya dan tidak boleh kita meremehkan satu pun."],["B2","2675","يُعَلِّمُنَا السَّفَرُ أَنَّ طُرُقَ الْعَيْشِ كَثِيرَةٌ.","Bepergian mengajari kita bahwa cara hidup itu banyak."],["B2","2676","يَجِبُ أَنْ نَسْمَعَ قِصَصَ الْآخَرِينَ قَبْلَ أَنْ نَرْوِيَ قِصَصَنَا.","Kita harus mendengar kisah orang lain sebelum menceritakan kisah kita."],["B2","2677","تَنَاوَلْنَا الْعَشَاءَ مَعَ عَائِلَةٍ مِنْ بَلَدٍ آخَرَ وَتَحَدَّثْنَا حَتَّى مُنْتَصَفِ اللَّيْلِ.","Kami makan malam bersama keluarga dari negara lain dan berbincang sampai tengah malam."],["B2","2678","احْتِرَامُ آدَابِ الضِّيَافَةِ فِي كُلِّ بَلَدٍ يُسَهِّلُ التَّعَارُفَ.","Menghormati adab menjamu tamu di setiap negara memudahkan perkenalan."],["B2","2679","الْمُشْتَرَكَاتُ بَيْنَ الشُّعُوبِ أَكْثَرُ مِمَّا نَظُنُّ.","Persamaan antar bangsa lebih banyak daripada yang kita kira."],["B2","2680","سَاعَدَتْنِي الْمُوسِيقَى عَلَى التَّوَاصُلِ مَعَ أَشْخَاصٍ لَا أَتَكَلَّمُ لُغَتَهُمْ.","Musik membantu saya berkomunikasi dengan orang yang bahasanya tidak saya kuasai."],["B2","2681","مِنَ الْحِكْمَةِ أَنْ نَتَجَنَّبَ التَّعْمِيمَ عَنِ الشُّعُوبِ.","Bijaksana jika kita menghindari generalisasi tentang suatu bangsa."],["B2","2682","الِانْضِبَاطُ فِي التَّدْرِيبِ هُوَ مَا يَصْنَعُ الْفَرْقَ بَيْنَ الْهَاوِي وَالْمُحْتَرِفِ.","Disiplin dalam latihan adalah yang membedakan amatir dari profesional."],["B2","2683","أَسْتَيْقِظُ فَجْرًا كُلَّ يَوْمٍ لِأَجْرِيَ قَبْلَ الذَّهَابِ إِلَى الْعَمَلِ.","Saya bangun fajar setiap hari untuk berlari sebelum berangkat kerja."],["B2","2684","خَسِرَ الْفَرِيقُ الْمُبَارَاةَ لَكِنَّهُ لَعِبَ بِرُوحٍ رِيَاضِيَّةٍ عَالِيَةٍ.","Tim itu kalah dalam pertandingan tetapi bermain dengan semangat sportivitas tinggi."],["B2","2685","الرِّيَاضَةُ تُعَلِّمُنَا الصَّبْرَ وَقَبُولَ الْهَزِيمَةِ وَالْعَمَلَ مَعَ الْفَرِيقِ.","Olahraga mengajari kita kesabaran, menerima kekalahan, dan bekerja dengan tim."],["B2","2686","أُعَانِي مِنْ إِصَابَةٍ فِي رُكْبَتِي وَيَجِبُ أَنْ أَرْتَاحَ شَهْرًا.","Saya mengalami cedera di lutut dan harus istirahat sebulan."],["B2","2687","لَا يَكْفِي أَنْ نَتَدَرَّبَ بَلْ يَجِبُ أَنْ نَنَامَ وَنَأْكُلَ جَيِّدًا.","Tidak cukup berlatih, kita juga harus tidur dan makan dengan baik."],["B2","2688","فَازَ اللَّاعِبُ بِالْبُطُولَةِ بَعْدَ سَنَوَاتٍ مِنَ التَّدْرِيبِ الشَّاقِّ.","Pemain itu memenangkan kejuaraan setelah bertahun-tahun latihan berat."],["B2","2689","أُمَارِسُ السِّبَاحَةَ مَرَّتَيْنِ فِي الْأُسْبُوعِ لِأُقَوِّيَ ظَهْرِي.","Saya berenang dua kali seminggu untuk menguatkan punggung."],["B2","2690","الْجُلُوسُ سَاعَاتٍ طَوِيلَةً أَمَامَ الشَّاشَةِ يَضُرُّ بِالصِّحَّةِ.","Duduk berjam-jam di depan layar merusak kesehatan."],["B2","2691","يَنْضَمُّ كَثِيرُونَ إِلَى النَّادِي فِي يَنَايِرَ ثُمَّ يَتَوَقَّفُونَ بَعْدَ شَهْرٍ.","Banyak orang bergabung dengan klub kebugaran di Januari lalu berhenti setelah sebulan."],["B2","2692","الْحَكَمُ هُوَ الَّذِي يُطَبِّقُ الْقَوَاعِدَ عَلَى الْجَمِيعِ بِالتَّسَاوِي.","Wasit adalah yang menerapkan aturan kepada semua dengan setara."],["B2","2693","أَحْتَاجُ إِلَى مُدَرِّبٍ يُوَجِّهُنِي وَلَا يَكْتَفِي بِالصُّرَاخِ.","Saya butuh pelatih yang membimbing saya, bukan hanya berteriak."],["B2","2694","يُسَاعِدُنِي الْمَشْيُ فِي الصَّبَاحِ عَلَى تَصْفِيَةِ ذِهْنِي.","Berjalan di pagi hari membantu saya menjernihkan pikiran."],["B2","2695","لَا تُقَارِنْ نَفْسَكَ بِالْآخَرِينَ فِي الرِّيَاضَةِ، بَلْ قَارِنْهَا بِنَفْسِكَ الْأَمْسِ.","Jangan membandingkan dirimu dengan orang lain dalam olahraga, bandingkan dengan dirimu kemarin."],["B2","2696","تَابَعْنَا النِّهَائِيَّ مَعَ الْأَصْدِقَاءِ وَكَانَتِ الْأَجْوَاءُ مُشْتَعِلَةً.","Kami menonton final bersama teman-teman dan suasananya sangat panas."],["B2","2697","يُنْصَحُ بِالتَّسْخِينِ قَبْلَ أَيِّ تَمْرِينٍ لِتَجَنُّبِ الْإِصَابَاتِ.","Dianjurkan melakukan pemanasan sebelum latihan apa pun untuk menghindari cedera."],["B2","2698","شَعَرْتُ بِالْإِرْهَاقِ لَكِنِّي لَمْ أَسْتَسْلِمْ حَتَّى أَكْمَلْتُ السِّبَاقَ.","Saya merasa kelelahan tetapi tidak menyerah sampai menyelesaikan perlombaan."],["B2","2699","الْعَقْلُ السَّلِيمُ فِي الْجِسْمِ السَّلِيمِ، كَمَا يُقَالُ.","Akal yang sehat ada pada tubuh yang sehat, seperti kata orang."],["B2","2700","سَأَشْتَرِكُ فِي سِبَاقِ الْمَارَاثُونِ هَذَا الْخَرِيفَ.","Saya akan ikut lomba maraton musim gugur ini."],["B2","2701","تَحْتَاجُ الْمُدُنُ الْكَبِيرَةُ إِلَى تَخْطِيطٍ عُمْرَانِيٍّ يَأْخُذُ الْمُسْتَقْبَلَ فِي الِاعْتِبَارِ.","Kota-kota besar membutuhkan perencanaan tata kota yang memperhitungkan masa depan."],["B2","2702","تُعَانِي الْمَدِينَةُ مِنْ ازْدِحَامٍ مُرُورِيٍّ لِأَنَّ الشَّوَارِعَ لَمْ تُصَمَّمْ لِهَذَا الْعَدَدِ.","Kota ini menderita kemacetan karena jalan-jalannya tidak dirancang untuk jumlah sebanyak ini."],["B2","2703","أُنْشِئَتْ مَدِينَةٌ جَدِيدَةٌ لِتَخْفِيفِ الضَّغْطِ عَلَى الْعَاصِمَةِ.","Dibangun kota baru untuk mengurangi tekanan pada ibu kota."],["B2","2704","تَضَعُ الْبَلَدِيَّةُ مَشْرُوعًا لِتَحْسِينِ الْأَرْصِفَةِ وَمَمَرَّاتِ الدَّرَّاجَاتِ.","Pemerintah kota menyusun proyek untuk memperbaiki trotoar dan jalur sepeda."],["B2","2705","الْمَدِينَةُ الذَّكِيَّةُ تَسْتَخْدِمُ الْبَيَانَاتِ لِتُحَسِّنَ الْخِدْمَاتِ.","Kota cerdas menggunakan data untuk memperbaiki layanan."],["B2","2706","تُعَدُّ الْحَدَائِقُ الْعَامَّةُ رِئَةَ الْمَدِينَةِ.","Taman umum dianggap sebagai paru-paru kota."],["B2","2707","ارْتَفَعَتْ أَسْعَارُ الْعَقَارَاتِ فِي وَسَطِ الْمَدِينَةِ حَتَّى لَمْ يَعُدْ بِوُسْعِ الشَّبَابِ الشِّرَاءُ.","Harga properti di pusat kota naik hingga pemuda tidak lagi mampu membeli."],["B2","2708","يَتَطَلَّبُ بِنَاءُ الْجُسُورِ وَالْأَنْفَاقِ مِيزَانِيَّاتٍ ضَخْمَةً.","Pembangunan jembatan dan terowongan membutuhkan anggaran besar."],["B2","2709","الْعَيْشُ فِي مَدِينَةٍ مُزْدَحِمَةٍ يُرْهِقُنِي فَأَبْحَثُ عَنْ مَكَانٍ أَهْدَأَ.","Hidup di kota yang padat melelahkan saya sehingga saya mencari tempat yang lebih tenang."],["B2","2710","تَحْتَاجُ الْأَحْيَاءُ إِلَى مَدَارِسَ وَمُسْتَشْفَيَاتٍ قَرِيبَةٍ مِنْ سُكَّانِهَا.","Lingkungan membutuhkan sekolah dan rumah sakit yang dekat dengan penduduknya."],["B2","2711","تَتَوَسَّعُ الْمُدُنُ عَلَى حِسَابِ الْأَرَاضِي الزِّرَاعِيَّةِ.","Kota-kota meluas dengan mengorbankan lahan pertanian."],["B2","2712","أُحِبُّ الْمُدُنَ الَّتِي تَحْتَفِظُ بِطَابَعِهَا الْقَدِيمِ مَعَ التَّطْوِيرِ.","Saya suka kota yang mempertahankan ciri lamanya seiring pembangunan."],["B2","2713","اشْتَرَكَ السُّكَّانُ فِي اسْتِفْتَاءٍ حَوْلَ مَشْرُوعِ الْمَتْرُو الْجَدِيدِ.","Warga ikut dalam jajak pendapat tentang proyek metro baru."],["B2","2714","تَقِلُّ الْمَسَاحَاتُ الْمَفْتُوحَةُ كُلَّمَا ازْدَادَ الْبِنَاءُ.","Ruang terbuka berkurang seiring bertambahnya bangunan."],["B2","2715","أَقْتَرِحُ أَنْ نُخَصِّصَ يَوْمًا فِي الشَّهْرِ تُغْلَقُ فِيهِ الشَّوَارِعُ أَمَامَ السَّيَّارَاتِ.","Saya mengusulkan menyediakan satu hari dalam sebulan ketika jalan ditutup untuk mobil."],["B2","2716","لِكُلِّ مَدِينَةٍ شَخْصِيَّتُهَا الَّتِي تُشَكِّلُهَا النَّاسُ وَالتَّارِيخُ.","Setiap kota punya kepribadiannya yang dibentuk oleh orang dan sejarah."],["B2","2717","الْمَدِينَةُ الْجَيِّدَةُ هِيَ الَّتِي تَجْعَلُ الْإِنْسَانَ يَشْعُرُ بِالْأَمَانِ وَالِانْتِمَاءِ.","Kota yang baik adalah yang membuat manusia merasa aman dan memiliki."],["B2","2718","حِينَ أَنْظُرُ إِلَى الْوَرَاءِ أُدْرِكُ كَمْ تَغَيَّرْتُ خِلَالَ عَشْرِ سَنَوَاتٍ.","Ketika menoleh ke belakang, saya sadar betapa saya telah berubah dalam sepuluh tahun."],["B2","2719","أَتَذَكَّرُ أَوَّلَ يَوْمٍ دَخَلْتُ فِيهِ الْمَدْرَسَةَ كَأَنَّهُ الْأَمْسُ.","Saya ingat hari pertama masuk sekolah seakan-akan baru kemarin."],["B2","2720","لَوْ عَادَ بِيَ الزَّمَنُ لَاخْتَرْتُ الطَّرِيقَ نَفْسَهُ مَعَ بَعْضِ التَّعْدِيلَاتِ.","Seandainya waktu bisa diulang, saya akan memilih jalan yang sama dengan beberapa perubahan."],["B2","2721","بَقِيَتْ تِلْكَ اللَّحْظَةُ فِي ذَاكِرَتِي رَغْمَ مُرُورِ الْأَعْوَامِ.","Momen itu tetap ada dalam ingatan saya meskipun bertahun-tahun berlalu."],["B2","2722","فَقَدْنَا بَيْتَ الطُّفُولَةِ لَكِنَّنَا احْتَفَظْنَا بِذِكْرَيَاتِهِ.","Kami kehilangan rumah masa kecil, tetapi menyimpan kenangannya."],["B2","2723","حِينَ كُنْتُ صَغِيرًا كُنْتُ أَحْلُمُ بِأَنْ أَصِيرَ طَيَّارًا.","Ketika kecil saya bermimpi menjadi pilot."],["B2","2724","لَمْ أَكُنْ أَعْرِفُ مَعْنَى الْغُرْبَةِ حَتَّى سَافَرْتُ وَحْدِي.","Saya tidak tahu arti perantauan sampai saya bepergian sendiri."],["B2","2725","نَظَرْتُ إِلَى الصُّوَرِ الْقَدِيمَةِ فَابْتَسَمْتُ وَبَكَيْتُ مَعًا.","Saya melihat foto-foto lama lalu tersenyum sekaligus menangis."],["B2","2727","كَانَتِ الْحَيَاةُ أَبْطَأَ حِينَ لَمْ تَكُنِ الْهَوَاتِفُ مَوْجُودَةً.","Hidup lebih lambat ketika ponsel belum ada."],["B2","2728","رَاجَعْتُ مُذَكِّرَاتِي الْقَدِيمَةَ فَاكْتَشَفْتُ أَنِّي كُنْتُ أَقْلَقُ عَلَى أَشْيَاءَ تَافِهَةٍ.","Saya membaca ulang catatan lama dan menemukan bahwa dulu saya mengkhawatirkan hal-hal sepele."],["B2","2729","لَقَدْ مَرَّتِ السَّنَوَاتُ بِسُرْعَةٍ لَمْ أُدْرِكْهَا.","Tahun-tahun berlalu dengan kecepatan yang tidak saya sadari."],["B2","2730","أَشْعُرُ بِالْحَنِينِ كُلَّمَا مَرَرْتُ بِمَدْرَسَتِي الْقَدِيمَةِ.","Saya merasa rindu setiap kali melewati sekolah lama saya."],["B2","2731","لَمْ أَفْهَمْ نَصِيحَةَ أَبِي حِينَهَا، وَالْآنَ أَفْهَمُهَا تَمَامًا.","Dulu saya tidak mengerti nasihat ayah, sekarang saya mengerti sepenuhnya."],["B2","2732","كُلُّ مَرْحَلَةٍ فِي الْحَيَاةِ لَهَا جَمَالُهَا وَتَحَدِّيَاتُهَا.","Setiap tahap kehidupan punya keindahan dan tantangannya."],["B2","2733","لَا يَزَالُ صَدَى كَلِمَاتِ جَدَّتِي يَرِنُّ فِي أُذُنِي.","Gema kata-kata nenek saya masih terngiang di telinga saya."],["B2","2734","أَطْمَحُ إِلَى أَنْ أَكُونَ مُدِيرًا بَعْدَ خَمْسِ سَنَوَاتٍ.","Saya bercita-cita menjadi manajer lima tahun lagi."],["B2","2735","أَضَعُ أَهْدَافًا قَصِيرَةَ الْمَدَى وَأُرَاجِعُهَا كُلَّ شَهْرٍ.","Saya menetapkan target jangka pendek dan meninjaunya setiap bulan."],["B2","2736","لَيْسَ الطُّمُوحُ أَنْ نَصِلَ بِسُرْعَةٍ بَلْ أَنْ نَسِيرَ فِي الِاتِّجَاهِ الصَّحِيحِ.","Ambisi bukan sampai dengan cepat tetapi berjalan ke arah yang benar."],["B2","2737","أَفَكِّرُ فِي تَغْيِيرِ مَجَالِ عَمَلِي لِأَنِّي لَمْ أَعُدْ أَشْعُرُ بِالشَّغَفِ.","Saya berpikir mengganti bidang pekerjaan karena tidak lagi merasa bergairah."],["B2","2738","اِسْتَشَرْتُ مُرْشِدًا مِهْنِيًّا قَبْلَ اخْتِيَارِ التَّخَصُّصِ.","Saya berkonsultasi dengan konselor karier sebelum memilih jurusan."],["B2","2739","الْفُرَصُ لَا تَأْتِي دَائِمًا فَيَجِبُ أَنْ نَسْتَعِدَّ لَهَا.","Peluang tidak selalu datang, jadi kita harus siap untuknya."],["B2","2740","حَصَلْتُ عَلَى تَرْقِيَةٍ لَكِنَّهَا تَعْنِي مَسْؤُولِيَّاتٍ أَكْبَرَ.","Saya mendapat kenaikan jabatan tetapi itu berarti tanggung jawab yang lebih besar."],["B2","2741","عَلَيْنَا أَنْ نَتَعَلَّمَ شَيْئًا جَدِيدًا كُلَّ سَنَةٍ لِنَظَلَّ مُنَافِسِينَ.","Kita harus mempelajari sesuatu yang baru setiap tahun agar tetap kompetitif."],["B2","2742","الْمَسَارُ الْمِهْنِيُّ لَيْسَ خَطًّا مُسْتَقِيمًا، بَلْ فِيهِ مُنْعَطَفَاتٌ.","Jalur karier bukan garis lurus, tetapi ada belokan-belokan."],["B2","2743","أُرِيدُ أَنْ أَعْمَلَ فِي شَيْءٍ يُفِيدُ النَّاسَ لَا فِي الرِّبْحِ فَقَطْ.","Saya ingin bekerja dalam sesuatu yang bermanfaat bagi orang, bukan hanya mencari untung."],["B2","2745","لَا يَنْجَحُ فِي مِهْنَةٍ مَنْ لَا يُحِبُّهَا.","Tidak akan berhasil dalam suatu profesi orang yang tidak mencintainya."],["B2","2746","أَسْتَثْمِرُ فِي شَبَكَةِ عَلَاقَاتِي لِأَنَّ الْفُرَصَ تَأْتِي مِنَ النَّاسِ.","Saya berinvestasi pada jaringan relasi karena peluang datang dari orang."],["B2","2747","لَمْ أَحْصُلْ عَلَى الْوَظِيفَةِ لَكِنَّنِي تَعَلَّمْتُ مِنَ الْمُقَابَلَةِ كَثِيرًا.","Saya tidak mendapat pekerjaan itu tetapi banyak belajar dari wawancaranya."],["B2","2748","أَسْعَى لِأَنْ أَتَوَازَنَ بَيْنَ النَّجَاحِ فِي الْعَمَلِ وَالسَّعَادَةِ فِي الْبَيْتِ.","Saya berupaya menyeimbangkan keberhasilan di kantor dan kebahagiaan di rumah."],["B2","2749","سَأَتَقَاعَدُ يَوْمًا لَكِنِّي سَأَظَلُّ أَتَعَلَّمُ.","Suatu hari saya akan pensiun tetapi saya akan terus belajar."],["B2","2750","الْمَالُ مُهِمٌّ لَكِنَّهُ لَيْسَ كُلَّ شَيْءٍ فِي اخْتِيَارِ الْوَظِيفَةِ.","Uang itu penting tetapi bukan segalanya dalam memilih pekerjaan."],["B2","2751","الْمُشَارَكَةُ فِي الِانْتِخَابَاتِ حَقٌّ وَوَاجِبٌ فِي الْوَقْتِ نَفْسِهِ.","Ikut serta dalam pemilu adalah hak sekaligus kewajiban."],["B2","2752","عَلَى الْمُوَاطِنِ أَنْ يَعْرِفَ بَرْنَامَجَ الْمُرَشَّحِ قَبْلَ أَنْ يُعْطِيَهُ صَوْتَهُ.","Warga harus mengetahui program calon sebelum memberinya suara."],["B2","2753","تُشَكِّلُ الْأَحْزَابُ السِّيَاسِيَّةُ مَنَابِرَ لِلتَّعْبِيرِ عَنْ مَصَالِحِ فِئَاتٍ مُخْتَلِفَةٍ.","Partai politik menjadi wadah untuk menyuarakan kepentingan kelompok-kelompok yang berbeda."],["B2","2754","الشَّفَافِيَّةُ فِي الْإِنْفَاقِ الْحُكُومِيِّ تَحْمِي الْمَالَ الْعَامَّ مِنَ الْهَدْرِ.","Transparansi dalam belanja pemerintah melindungi uang publik dari pemborosan."],["B2","2755","مَهْمَا اخْتَلَفَتْ آرَاؤُنَا السِّيَاسِيَّةُ يَجِبُ أَنْ نَحْتَرِمَ بَعْضَنَا.","Seberapa pun berbedanya pandangan politik kita, kita harus saling menghormati."],["B2","2756","أَعْلَنَ الْمَسْؤُولُ اسْتِقَالَتَهُ بَعْدَ أَنْ تَبَيَّنَ تَقْصِيرُهُ.","Pejabat itu mengumumkan pengunduran dirinya setelah kelalaiannya terbukti."],["B2","2757","يُسْهِمُ الشَّبَابُ فِي الْحَيَاةِ الْعَامَّةِ بِالتَّطَوُّعِ وَالْمُبَادَرَاتِ الْمَحَلِّيَّةِ.","Pemuda berkontribusi dalam kehidupan publik lewat kerja sukarela dan inisiatif lokal."],["B2","2758","مَنْ لَا يَدْفَعُ الضَّرَائِبَ لَا يَحِقُّ لَهُ أَنْ يَطْلُبَ خِدْمَاتٍ جَيِّدَةً.","Siapa yang tidak membayar pajak tidak berhak menuntut layanan yang baik."],["B2","2759","تَسْعَى الدَّوْلَةُ إِلَى تَحْقِيقِ الْعَدَالَةِ بَيْنَ الْمُدُنِ وَالْأَرْيَافِ.","Negara berupaya mewujudkan keadilan antara kota dan desa."],["B2","2760","أَرَى أَنَّ الْمَشَارِكَةَ الشَّعْبِيَّةَ فِي الْقَرَارَاتِ تُقَوِّي الْإِحْسَاسَ بِالِانْتِمَاءِ.","Menurut saya partisipasi rakyat dalam keputusan menguatkan rasa memiliki."],["B2","2761","يَجِبُ أَنْ تَكُونَ الصَّحَافَةُ حُرَّةً لِتَسْتَطِيعَ مُرَاقَبَةَ السُّلْطَةِ.","Pers harus bebas agar dapat mengawasi kekuasaan."],["B2","2762","لَا يُمْكِنُ لِأَيِّ بَلَدٍ أَنْ يَتَقَدَّمَ دُونَ مُؤَسَّسَاتٍ قَوِيَّةٍ وَقَانُونٍ يَسْرِي عَلَى الْجَمِيعِ.","Tidak mungkin negara mana pun maju tanpa lembaga yang kuat dan hukum yang berlaku bagi semua."],["B2","2763","شَارَكْتُ فِي حَمْلَةٍ لِتَسْجِيلِ النَّاخِبِينَ الْجُدُدِ.","Saya ikut dalam kampanye pendaftaran pemilih baru."],["B2","2764","أُفَضِّلُ الْحِوَارَ الْهَادِئَ عَلَى الْجَدَلِ الصَّاخِبِ فِي الْقَضَايَا السِّيَاسِيَّةِ.","Saya lebih suka dialog yang tenang daripada debat gaduh dalam isu politik."],["B2","2765","تُقَدِّمُ الْمَجَالِسُ الْمَحَلِّيَّةُ خِدْمَاتٍ مُبَاشِرَةً لِلسُّكَّانِ فِي الْأَحْيَاءِ.","Dewan lokal memberikan layanan langsung kepada warga di lingkungan."],["B2","2766","لَيْسَ الْوَطَنُ مَكَانًا نَعِيشُ فِيهِ فَقَطْ، بَلْ مَسْؤُولِيَّةٌ نَحْمِلُهَا.","Tanah air bukan hanya tempat kita hidup, melainkan tanggung jawab yang kita pikul."],["B2","2767","حِينَ يَتَعَاوَنُ الْمُوَاطِنُونَ مَعَ الدَّوْلَةِ تَنْجَحُ الْمَشَارِيعُ الْوَطَنِيَّةِ.","Ketika warga bekerja sama dengan negara, proyek nasional berhasil."],["B2","2768","لَا تَعْنِي الْمُعَارَضَةُ الْعَدَاوَةَ، بَلْ هِيَ جُزْءٌ مِنَ الْحَيَاةِ الدِّيمُقْرَاطِيَّةِ.","Oposisi tidak berarti permusuhan, melainkan bagian dari kehidupan demokrasi."],["B2","2769","يَهْدِفُ الْإِعْلَانُ النَّاجِحُ إِلَى بِنَاءِ عَلَاقَةٍ مَعَ الْعَمِيلِ لَا إِلَى الْبَيْعِ السَّرِيعِ فَقَطْ.","Iklan yang berhasil bertujuan membangun hubungan dengan pelanggan, bukan sekadar penjualan cepat."],["B2","2770","يَجِبُ أَنْ نَعْرِفَ جُمْهُورَنَا الْمُسْتَهْدَفَ قَبْلَ أَنْ نُصَمِّمَ الْحَمْلَةَ.","Kita harus mengenal target audiens sebelum merancang kampanye."],["B2","2771","لَا تَنْجَحُ الْحَمْلَةُ إِذَا كَانَتِ الرِّسَالَةُ غَامِضَةً أَوْ مُبَالَغًا فِيهَا.","Kampanye tidak berhasil jika pesannya kabur atau berlebihan."],["B2","2772","أَصْبَحَتْ مَوَاقِعُ التَّوَاصُلِ أَهَمَّ قَنَاةٍ لِلتَّسْوِيقِ الْيَوْمَ.","Media sosial kini menjadi saluran pemasaran terpenting."],["B2","2773","يُؤَثِّرُ الْمُؤَثِّرُونَ فِي قَرَارَاتِ الشِّرَاءِ لَدَى جُمْهُورِهِمْ.","Para influencer memengaruhi keputusan pembelian audiens mereka."],["B2","2774","اسْتَخْدَمَتِ الشَّرِكَةُ شِعَارًا قَصِيرًا يَسْهُلُ حِفْظُهُ.","Perusahaan itu memakai slogan pendek yang mudah dihafal."],["B2","2775","نَحْتَاجُ إِلَى هَوِيَّةٍ بَصَرِيَّةٍ وَاضِحَةٍ تُمَيِّزُنَا عَنِ الْمُنَافِسِينَ.","Kami butuh identitas visual yang jelas yang membedakan kami dari pesaing."],["B2","2776","تَرَاجَعَتْ مَبِيعَاتُنَا بَعْدَ أَنْ غَيَّرْنَا التَّغْلِيفَ.","Penjualan kami menurun setelah kami mengganti kemasan."],["B2","2777","رَاقَبْنَا رُدُودَ الْفِعْلِ عَلَى الْحَمْلَةِ وَعَدَّلْنَا الرِّسَالَةَ بِنَاءً عَلَيْهَا.","Kami memantau tanggapan terhadap kampanye dan menyesuaikan pesan berdasarkan itu."],["B2","2778","التَّخْفِيضَاتُ الْمَوْسِمِيَّةُ تَجْذِبُ الزَّبَائِنَ لَكِنَّهَا لَا تَصْنَعُ وَلَاءً.","Diskon musiman menarik pelanggan tetapi tidak menciptakan loyalitas."],["B2","2780","هَلْ يَجُوزُ أَنْ يَسْتَهْدِفَ الْإِعْلَانُ الْأَطْفَالَ مُبَاشَرَةً؟","Bolehkah iklan menyasar anak-anak secara langsung?"],["B2","2781","يَنْبَغِي أَنْ نَقِيسَ نَجَاحَ الْحَمْلَةِ بِنَتَائِجَ وَاضِحَةٍ لَا بِالْإِحْسَاسِ.","Kita sebaiknya mengukur keberhasilan kampanye dengan hasil yang jelas, bukan perasaan."],["B2","2782","تَكْسِبُ الشَّرِكَةُ ثِقَةَ الْعُمَلَاءِ حِينَ تَعْتَرِفُ بِخَطَئِهَا وَتُصْلِحُهُ.","Perusahaan memperoleh kepercayaan pelanggan ketika mengakui kesalahannya dan memperbaikinya."],["B2","2783","تُسَاعِدُنَا مُلَاحَظَاتُ الْعُمَلَاءِ فِي تَطْوِيرِ الْمُنْتَجِ قَبْلَ الْإِطْلَاقِ.","Masukan pelanggan membantu kami mengembangkan produk sebelum peluncuran."],["B2","2784","يَجِبُ أَنْ يَحْتَرِمَ الْإِعْلَانُ ذَكَاءَ الْمُشَاهِدِ وَلَا يُخْدِعَهُ.","Iklan harus menghormati kecerdasan penonton dan tidak menipunya."],["B2","2785","يُقَارِنُ الزَّبُونُ الْأَسْعَارَ عَلَى الْإِنْتَرْنِتِ قَبْلَ أَنْ يَشْتَرِيَ.","Pelanggan membandingkan harga di internet sebelum membeli."],["B2","2786","تَعَاقَدَتِ الشَّرِكَةُ مَعَ وَكَالَةٍ إِعْلَانِيَّةٍ لِتُدِيرَ حَمْلَتَهَا الْجَدِيدَةَ.","Perusahaan itu berkontrak dengan agen periklanan untuk mengelola kampanye barunya."],["B2","2788","وَصَلَتْنِي رِسَالَةٌ تَطْلُبُ بَيَانَاتِي الْمَصْرِفِيَّةِ، وَأَظُنُّهَا احْتِيَالًا.","Saya menerima pesan yang meminta data perbankan saya, dan saya kira itu penipuan."],["B2","2789","يُنْصَحُ بِتَفْعِيلِ التَّحَقُّقِ بِخُطْوَتَيْنِ لِحِمَايَةِ الْحِسَابِ.","Dianjurkan mengaktifkan verifikasi dua langkah untuk melindungi akun."],["B2","2790","تَعَرَّضَتِ الشَّرِكَةُ لِاخْتِرَاقٍ سَرَّبَ بَيَانَاتِ آلَافِ الْعُمَلَاءِ.","Perusahaan itu mengalami peretasan yang membocorkan data ribuan pelanggan."],["B2","2791","لَا يَجُوزُ جَمْعُ بَيَانَاتِ النَّاسِ دُونَ مُوَافَقَتِهِمْ الصَّرِيحَةِ.","Tidak boleh mengumpulkan data orang tanpa persetujuan eksplisit mereka."],["B2","2792","عِنْدَمَا نَتَّصِلُ بِشَبَكَةٍ عَامَّةٍ يَجِبُ أَنْ نَتَجَنَّبَ الْمُعَامَلَاتِ الْمَالِيَّةِ.","Saat terhubung ke jaringan publik kita harus menghindari transaksi keuangan."],["B2","2793","أَنْسَخُ مِلَفَّاتِي الْمُهِمَّةَ إِلَى قُرْصٍ خَارِجِيٍّ كُلَّ أُسْبُوعٍ.","Saya menyalin berkas penting ke cakram eksternal setiap minggu."],["B2","2794","الْخُصُوصِيَّةُ حَقٌّ، لَكِنَّنَا نَتَنَازَلُ عَنْهَا بِسُهُولَةٍ مُقَابِلَ الرَّاحَةِ.","Privasi adalah hak, tetapi kita mudah melepaskannya demi kenyamanan."],["B2","2795","لَا تُشَارِكْ مَوْقِعَكَ بِشَكْلٍ دَائِمٍ مَعَ كُلِّ التَّطْبِيقَاتِ.","Jangan membagikan lokasimu secara terus-menerus dengan semua aplikasi."],["B2","2796","يَدْفَعُ الْمُحْتَالُونَ عَلَى الْإِنْتَرْنِتِ النَّاسَ إِلَى التَّسَرُّعِ حَتَّى لَا يُفَكِّرُوا.","Para penipu di internet mendorong orang untuk tergesa-gesa agar mereka tidak berpikir."],["B2","2797","حَدِّثْ نِظَامَ التَّشْغِيلِ بِانْتِظَامٍ لِسَدِّ الثَّغَرَاتِ.","Perbarui sistem operasi secara berkala untuk menutup celah."],["B2","2798","عَلِّمْ أَطْفَالَكَ أَلَّا يُعْطُوا مَعْلُومَاتِهِمُ الشَّخْصِيَّةَ لِأَحَدٍ لَا يَعْرِفُونَهُ.","Ajari anak-anakmu agar tidak memberikan informasi pribadi kepada orang yang tidak mereka kenal."],["B2","2799","لَا أَفْتَحُ الْمُرْفَقَاتِ الْمَجْهُولَةَ مَهْمَا بَدَا الْمُرْسِلُ مَوْثُوقًا.","Saya tidak membuka lampiran yang tidak dikenal sekalipun pengirimnya tampak tepercaya."],["B2","2800","شَرِكَاتُ التِّقْنِيَةِ مَسْؤُولَةٌ عَنْ حِمَايَةِ بَيَانَاتِ مُسْتَخْدِمِيهَا.","Perusahaan teknologi bertanggung jawab melindungi data penggunanya."],["B2","2801","الْوَعْيُ الْأَمْنِيُّ هُوَ خَطُّ الدِّفَاعِ الْأَوَّلُ لِأَنَّ الثَّغْرَةَ غَالِبًا هِيَ الْإِنْسَانُ.","Kesadaran keamanan adalah garis pertahanan pertama karena celahnya sering kali manusia."],["B2","2802","يَتَعَلَّمُ الْمُخْتَرِقُونَ طُرُقًا جَدِيدَةً كُلَّ يَوْمٍ، لِذَا يَجِبُ أَنْ نَتَعَلَّمَ نَحْنُ أَيْضًا.","Para peretas mempelajari cara baru setiap hari, karena itu kita juga harus belajar."],["B2","2803","حِينَ أَتَلَقَّى رِسَالَةً مُرِيبَةً أَتَّصِلُ بِالْجِهَةِ مُبَاشَرَةً لِلتَّأَكُّدِ.","Ketika menerima pesan mencurigakan, saya menghubungi lembaganya langsung untuk memastikan."],["B2","2804","أَغْلَقْتُ الْإِشْعَارَاتِ كُلَّهَا لِأَنَّ الْمَعْلُومَاتِ تُجْمَعُ دُونَ عِلْمِي.","Saya mematikan semua notifikasi karena informasi dikumpulkan tanpa sepengetahuan saya."],["B2","2805","الْخَطِيبُ النَّاجِحُ يَبْدَأُ بِفِكْرَةٍ قَوِيَّةٍ ثُمَّ يُدَعِّمُهَا بِالْأَمْثِلَةِ.","Orator yang berhasil memulai dengan gagasan kuat lalu mendukungnya dengan contoh."],["B2","2806","يَجِبُ أَنْ يَكُونَ الصَّوْتُ وَاضِحًا وَالنَّبْرَةُ مُنَاسِبَةً لِلْمَوْضُوعِ.","Suara harus jelas dan nada sesuai dengan topik."],["B2","2807","فِي الْمُنَاظَرَةِ لَا نُهَاجِمُ الشَّخْصَ بَلْ نُفَنِّدُ الْفِكْرَةَ.","Dalam debat kita tidak menyerang orangnya, tetapi menyanggah gagasannya."],["B2","2808","أَمْهَلَنَا الْمُنَظِّمُ دَقِيقَتَيْنِ لِتَقْدِيمِ الْحُجَّةِ الْأُولَى.","Penyelenggara memberi kami dua menit untuk menyampaikan argumen pertama."],["B2","2809","أُوَاجِهُ صُعُوبَةً فِي التَّحَدُّثِ أَمَامَ الْجُمْهُورِ لِأَنِّي أَتَوَتَّرُ.","Saya kesulitan berbicara di depan umum karena saya gugup."],["B2","2810","يَنْبَغِي أَنْ نَتَوَقَّعَ أَسْئِلَةَ الْخَصْمِ وَنُجَهِّزَ إِجَابَاتٍ مُسْبَقَةً.","Kita sebaiknya mengantisipasi pertanyaan lawan dan menyiapkan jawaban lebih dulu."],["B2","2811","الِاسْتِشْهَادُ بِالْإِحْصَاءَاتِ يُقَوِّي الْحُجَّةَ بِشَرْطِ أَنْ تَكُونَ مَوْثُوقَةً.","Mengutip statistik menguatkan argumen dengan syarat bersumber tepercaya."],["B2","2812","مَا أَكْثَرَ الْخُطَبَ الَّتِي تُنْسَى بَعْدَ دَقَائِقَ!","Betapa banyaknya pidato yang dilupakan setelah beberapa menit!"],["B2","2813","أَعْتَذِرُ إِنْ أَخْطَأْتُ فِي الْمَعْلُومَةِ وَأَشْكُرُكَ عَلَى التَّصْحِيحِ.","Saya mohon maaf jika salah dalam informasi dan berterima kasih atas koreksinya."],["B2","2814","يَتَّسِمُ الْخِطَابُ الْجَيِّدُ بِالْإِيجَازِ وَالْوُضُوحِ وَالصِّدْقِ.","Pidato yang baik bercirikan ringkas, jelas, dan jujur."],["B2","2815","لَوْ كُنْتُ مَكَانَهُ لَرَدَدْتُ بِهُدُوءٍ بَدَلًا مِنَ الْغَضَبِ.","Seandainya saya di posisinya, saya akan menjawab dengan tenang, bukan marah."],["B2","2816","نَظَّمَتِ الْجَامِعَةُ مُنَاظَرَةً بَيْنَ فَرِيقَيْنِ حَوْلَ التَّعْلِيمِ عَنْ بُعْدٍ.","Universitas menyelenggarakan debat antara dua tim tentang pendidikan jarak jauh."],["B2","2817","الْإِقْنَاعُ فَنٌّ يَقُومُ عَلَى الْمَنْطِقِ وَالْعَاطِفَةِ مَعًا.","Persuasi adalah seni yang bertumpu pada logika dan emosi sekaligus."],["B2","2818","اسْتَمَعَ الْحُضُورُ بِانْتِبَاهٍ ثُمَّ صَفَّقُوا طَوِيلًا.","Hadirin mendengarkan dengan penuh perhatian lalu bertepuk tangan lama."],["B2","2819","يَحْتَاجُ الْمُتَحَدِّثُ إِلَى الْإِصْغَاءِ بِقَدْرِ حَاجَتِهِ إِلَى الْكَلَامِ.","Pembicara membutuhkan mendengarkan sebanyak ia membutuhkan berbicara."],["B2","2821","أَفْضَلُ طَرِيقَةٍ لِتَحْسِينِ الْإِلْقَاءِ هِيَ التَّسْجِيلُ وَالِاسْتِمَاعُ إِلَى النَّفْسِ.","Cara terbaik memperbaiki penyampaian adalah merekam dan mendengarkan diri sendiri."],["B2","2822","اخْتَلَفَ الْمُتَنَاظِرَانِ فِي الرَّأْيِ وَاتَّفَقَا عَلَى احْتِرَامِ بَعْضِهِمَا.","Kedua pendebat berbeda pendapat tetapi sepakat saling menghormati."],["B2","2823","يَجِبُ عَلَى الطَّبِيبِ أَنْ يُخْبِرَ الْمَرِيضَ بِحَالَتِهِ بِصِدْقٍ وَلُطْفٍ.","Dokter harus memberi tahu pasien tentang kondisinya dengan jujur dan lembut."],["B2","2824","لَا يَجُوزُ إِجْرَاءُ أَيِّ عَمَلِيَّةٍ دُونَ مُوَافَقَةٍ وَاعِيَةٍ مِنَ الْمَرِيضِ.","Tidak boleh melakukan operasi apa pun tanpa persetujuan sadar dari pasien."],["B2","2825","تَبْقَى أَسْرَارُ الْمَرِيضِ أَمَانَةً لَا يَجُوزُ كَشْفُهَا لِأَحَدٍ.","Rahasia pasien tetap menjadi amanah yang tidak boleh dibuka kepada siapa pun."],["B2","2826","تُوَاجِهُ الْمُسْتَشْفَيَاتُ نَقْصًا فِي الْأَسِرَّةِ وَالْكَوَادِرِ الطِّبِّيَّةِ.","Rumah sakit menghadapi kekurangan tempat tidur dan tenaga medis."],["B2","2827","هَلْ مِنَ الْعَدْلِ أَنْ يَحْصُلَ الْأَغْنِيَاءُ عَلَى عِلَاجٍ أَفْضَلَ؟","Adilkah jika orang kaya mendapat pengobatan yang lebih baik?"],["B2","2828","يَتَرَدَّدُ بَعْضُ النَّاسِ فِي طَلَبِ الْعِلَاجِ النَّفْسِيِّ خَوْفًا مِنَ الْوَصْمَةِ.","Sebagian orang ragu mencari terapi psikologis karena takut stigma."],["B2","2829","أَتَمَنَّى أَنْ يُصْبِحَ الْعِلَاجُ الْوِقَائِيُّ جُزْءًا مِنَ النِّظَامِ الصِّحِّيِّ.","Saya berharap pengobatan pencegahan menjadi bagian dari sistem kesehatan."],["B2","2830","لَا يَنْبَغِي لِلطَّبِيبِ أَنْ يَصِفَ دَوَاءً إِلَّا بَعْدَ فَحْصٍ دَقِيقٍ.","Dokter tidak seharusnya meresepkan obat kecuali setelah pemeriksaan teliti."],["B2","2831","سَاعَدَتِ التِّقْنِيَةُ الْحَدِيثَةُ الْأَطِبَّاءَ عَلَى تَشْخِيصٍ أَدَقَّ لِلْأَمْرَاضِ.","Teknologi modern membantu dokter mendiagnosis penyakit dengan lebih akurat."],["B2","2832","التَّبَرُّعُ بِالْأَعْضَاءِ عَمَلٌ إِنْسَانِيٌّ يُنْقِذُ حَيَاةَ آخَرِينَ.","Donor organ adalah perbuatan kemanusiaan yang menyelamatkan nyawa orang lain."],["B2","2833","تَبْذُلُ الْمُمَرِّضَاتُ جُهْدًا كَبِيرًا غَالِبًا مَا لَا يُقَدَّرُ.","Para perawat mencurahkan usaha besar yang sering kali tidak dihargai."],["B2","2834","يَجِبُ أَنْ تَخْضَعَ الْأَدْوِيَةُ الْجَدِيدَةُ لِتَجَارِبَ صَارِمَةٍ قَبْلَ طَرْحِهَا فِي الْأَسْوَاقِ.","Obat baru harus melalui uji ketat sebelum dipasarkan."],["B2","2835","أَرْفُضُ أَنْ أُجْرِيَ فَحْصًا لَا أَفْهَمُ سَبَبَهُ.","Saya menolak melakukan pemeriksaan yang tidak saya pahami alasannya."],["B2","2836","لِلْأُسْرَةِ دَوْرٌ كَبِيرٌ فِي دَعْمِ الْمَرِيضِ نَفْسِيًّا أَثْنَاءَ الْعِلَاجِ.","Keluarga punya peran besar dalam mendukung pasien secara psikologis selama pengobatan."],["B2","2837","تَفْرِضُ الْمِهْنَةُ الطِّبِّيَّةُ أَنْ يَضَعَ الطَّبِيبُ مَصْلَحَةَ الْمَرِيضِ فَوْقَ كُلِّ اعْتِبَارٍ.","Profesi kedokteran mewajibkan dokter mengutamakan kepentingan pasien di atas segalanya."],["B2","2838","يَجِبُ أَنْ نَثِقَ بِالْعِلْمِ وَلَا نَنْسَاقَ وَرَاءَ الشَّائِعَاتِ الطِّبِّيَّةِ.","Kita harus memercayai ilmu dan tidak ikut-ikutan rumor medis."],["B2","2840","يَجِبُ أَنْ تَكُونَ مَعْلُومَاتُ الصِّحَّةِ الْمَنْشُورَةُ دَقِيقَةً وَمَدْعُومَةً بِالْمَصَادِرِ.","Informasi kesehatan yang dipublikasikan harus akurat dan didukung sumber."],["B2","2841","يُعَدُّ التَّحَوُّلُ إِلَى الطَّاقَةِ الْمُتَجَدِّدَةِ ضَرُورَةً لَا خِيَارًا.","Beralih ke energi terbarukan dianggap sebagai keharusan, bukan pilihan."],["B2","2842","تَنْتَشِرُ الْأَلْوَاحُ الشَّمْسِيَّةُ عَلَى أَسْطُحِ الْبُيُوتِ فِي كَثِيرٍ مِنَ الْمُدُنِ.","Panel surya makin tersebar di atap rumah di banyak kota."],["B2","2843","يَرْتَفِعُ مُسْتَوَى سَطْحِ الْبَحْرِ بِسَبَبِ ذَوَبَانِ الْجَلِيدِ.","Permukaan laut naik karena mencairnya es."],["B2","2844","لَنْ نَسْتَطِيعَ إِيقَافَ التَّغَيُّرِ الْمُنَاخِيِّ إِلَّا بِتَعَاوُنٍ دَوْلِيٍّ حَقِيقِيٍّ.","Kita tidak akan mampu menghentikan perubahan iklim kecuali dengan kerja sama internasional yang nyata."],["B2","2845","تَشْهَدُ مِنْطَقَتُنَا مَوْجَاتِ حَرٍّ أَشَدَّ مِنَ الْمُعْتَادِ.","Kawasan kami mengalami gelombang panas yang lebih parah dari biasanya."],["B2","2846","يُمْكِنُ لِكُلِّ فَرْدٍ أَنْ يُقَلِّلَ بَصْمَتَهُ الْكَرْبُونِيَّةَ بِخُطُوَاتٍ بَسِيطَةٍ.","Setiap individu bisa mengurangi jejak karbonnya dengan langkah sederhana."],["B2","2847","تَسْتَثْمِرُ الدَّوْلَةُ فِي مَزَارِعِ الرِّيَاحِ لِتَوْلِيدِ الْكَهْرَبَاءِ النَّظِيفَةِ.","Negara berinvestasi pada ladang angin untuk menghasilkan listrik bersih."],["B2","2848","مِنَ الصَّعْبِ التَّخَلِّي عَنِ الْوَقُودِ الْأَحْفُورِيِّ بَيْنَ لَيْلَةٍ وَضُحَاهَا.","Sulit meninggalkan bahan bakar fosil dalam semalam."],["B2","2849","تَسْعَى الشَّرِكَاتُ إِلَى تَقْلِيلِ انْبِعَاثَاتِهَا لِأَنَّ الْمُسْتَهْلِكِينَ يَطْلُبُونَ ذَلِكَ.","Perusahaan berupaya mengurangi emisinya karena konsumen menuntutnya."],["B2","2850","أَثَّرَ الْجَفَافُ فِي مَوَارِدِ الْمِيَاهِ الْعَذْبَةِ فِي الْمِنْطَقَةِ.","Kekeringan memengaruhi sumber air tawar di kawasan itu."],["B2","2851","يَسْتَطِيعُ الْعِلْمُ أَنْ يَجِدَ حُلُولًا إِذَا تَوَفَّرَتِ الْإِرَادَةُ السِّيَاسِيَّةُ.","Sains dapat menemukan solusi jika ada kemauan politik."],["B2","2852","تُعَدُّ السَّيَّارَاتُ الْكَهْرَبَائِيَّةُ خُطْوَةً مُهِمَّةً لَكِنَّهَا لَيْسَتِ الْحَلَّ الْوَحِيدَ.","Mobil listrik adalah langkah penting tetapi bukan satu-satunya solusi."],["B2","2853","زَرَعَتِ الْمَدِينَةُ آلَافَ الْأَشْجَارِ لِتَخْفِيفِ حَرَارَةِ الصَّيْفِ.","Kota itu menanam ribuan pohon untuk meredakan panas musim panas."],["B2","2854","يَجِبُ أَنْ نُعَلِّمَ الْأَجْيَالَ الْقَادِمَةَ كَيْفَ تَحْمِي كَوْكَبَهَا.","Kita harus mengajari generasi mendatang cara melindungi planetnya."],["B2","2855","تَتَسَابَقُ الدُّوَلُ فِي تَطْوِيرِ بَطَّارِيَّاتٍ أَقْوَى لِتَخْزِينِ الطَّاقَةِ.","Negara-negara berlomba mengembangkan baterai yang lebih kuat untuk menyimpan energi."],["B2","2856","نُدْرِكُ الْآنَ أَنَّ الْبِيئَةَ وَالِاقْتِصَادَ لَيْسَا خَصْمَيْنِ بَلْ شَرِيكَانِ.","Kini kita sadar bahwa lingkungan dan ekonomi bukan lawan tetapi mitra."],["B2","2857","لَا نَمْلِكُ كَوْكَبًا آخَرَ، وَلِهَذَا يَجِبُ أَنْ نَحْمِيَ هَذَا.","Kita tidak punya planet lain, karena itu kita harus melindungi yang ini."],["B2","2858","بَدَأْتُ أُفَكِّرُ فِي أَثَرِ كُلِّ مَا أَشْتَرِيهِ عَلَى الْبِيئَةِ.","Saya mulai memikirkan dampak setiap yang saya beli terhadap lingkungan."],["B2","2859","يَشْتَرِي الْمُسْتَثْمِرُ الْأَسْهُمَ لِيَصِيرَ شَرِيكًا فِي أَرْبَاحِ الشَّرِكَةِ.","Investor membeli saham agar menjadi mitra dalam laba perusahaan."],["B2","2860","لَا تَسْتَثْمِرْ مَالًا تَحْتَاجُهُ فِي الْقَرِيبِ.","Jangan berinvestasi dengan uang yang kamu butuhkan dalam waktu dekat."],["B2","2861","التَّنْوِيعُ يُقَلِّلُ الْمُخَاطَرَ لَكِنَّهُ لَا يُلْغِيهَا.","Diversifikasi mengurangi risiko tetapi tidak menghapusnya."],["B2","2862","تَقَلَّبَتِ الْأَسْوَاقُ بِشِدَّةٍ بَعْدَ إِعْلَانِ الْبَنْكِ الْمَرْكَزِيِّ.","Pasar bergejolak keras setelah pengumuman bank sentral."],["B2","2863","لَا يُمْكِنُ التَّنَبُّؤُ بِالسُّوقِ بِدِقَّةٍ مَهْمَا كَانَتْ خِبْرَتُنَا.","Pasar tidak dapat diprediksi dengan tepat seberapa pun pengalaman kita."],["B2","2864","يَبْدَأُ بَعْضُهُمْ بِمَبَالِغَ صَغِيرَةٍ لِيَتَعَلَّمُوا قَبْلَ أَنْ يَزِيدُوا.","Sebagian orang mulai dengan jumlah kecil agar belajar sebelum menambah."],["B2","2865","يَجِبُ أَنْ نَقْرَأَ الْقَوَائِمَ الْمَالِيَّةَ لِلشَّرِكَةِ قَبْلَ شِرَاءِ أَسْهُمِهَا.","Kita harus membaca laporan keuangan perusahaan sebelum membeli sahamnya."],["B2","2866","تَحْمِي سَنَدَاتُ الْحُكُومَةِ رَأْسَ الْمَالِ لَكِنَّ عَائِدَهَا قَلِيلٌ.","Obligasi pemerintah melindungi modal tetapi imbal hasilnya kecil."],["B2","2867","يَجِبُ أَلَّا نَتَّخِذَ قَرَارًا اسْتِثْمَارِيًّا تَحْتَ تَأْثِيرِ الْخَوْفِ أَوِ الطَّمَعِ.","Kita tidak boleh mengambil keputusan investasi di bawah pengaruh takut atau serakah."],["B2","2868","ارْتَفَعَتْ أَسْعَارُ الذَّهَبِ حِينَ ازْدَادَ الْقَلَقُ فِي الْأَسْوَاقِ.","Harga emas naik ketika kecemasan di pasar meningkat."],["B2","2869","رَاجَعْتُ مَحْفَظَتِي الِاسْتِثْمَارِيَّةَ وَقَرَّرْتُ إِعَادَةَ تَوْزِيعِ الْأُصُولِ.","Saya meninjau portofolio investasi saya dan memutuskan mendistribusikan ulang aset."],["B2","2870","يَحْتَاجُ الْمُسْتَثْمِرُ الْمُبْتَدِئُ إِلَى نَصِيحَةِ مُسْتَشَارٍ مَالِيٍّ مَوْثُوقٍ.","Investor pemula membutuhkan nasihat penasihat keuangan tepercaya."],["B2","2871","لَا تُصَدِّقْ مَنْ يَعِدُكَ بِأَرْبَاحٍ مَضْمُونَةٍ وَسَرِيعَةٍ.","Jangan percaya orang yang menjanjikan keuntungan pasti dan cepat."],["B2","2872","تَنْمُو الْمُدَّخَرَاتُ مَعَ الزَّمَنِ بِفَضْلِ الْفَائِدَةِ الْمُرَكَّبَةِ.","Tabungan bertumbuh seiring waktu berkat bunga majemuk."],["B2","2873","هَلْ تُفَضِّلُ الْعَقَارَ أَمِ الْأَسْهُمَ لِلِاسْتِثْمَارِ طَوِيلِ الْأَجَلِ؟","Apakah kamu lebih suka properti atau saham untuk investasi jangka panjang?"],["B2","2874","عَلَّمَتْنِي الْأَزْمَةُ الْمَالِيَّةُ أَنْ أَحْتَفِظَ بِسُيُولَةٍ كَافِيَةٍ.","Krisis keuangan mengajari saya menyimpan likuiditas yang cukup."],["B2","2875","يَتَعَلَّمُ النَّاسُ الِاسْتِثْمَارَ بِالْخِبْرَةِ وَالْأَخْطَاءِ أَكْثَرَ مِنَ الْكُتُبِ.","Orang belajar berinvestasi dari pengalaman dan kesalahan lebih daripada dari buku."],["B2","2876","أَدْرُسُ الْمُخَاطَرَ بِعِنَايَةٍ قَبْلَ أَنْ أَضَعَ أَيَّ مَبْلَغٍ فِي أَيِّ مَشْرُوعٍ.","Saya mempelajari risiko dengan cermat sebelum menaruh dana pada proyek apa pun."],["B2","2877","يَبْدَأُ التَّفْكِيرُ الْفَلْسَفِيُّ بِسُؤَالٍ بَسِيطٍ: لِمَاذَا؟","Pemikiran filosofis dimulai dari pertanyaan sederhana: mengapa?"],["B2","2878","هَلِ الْحُرِّيَّةُ أَنْ نَفْعَلَ مَا نُرِيدُ أَمْ أَنْ نَفْعَلَ مَا يَنْبَغِي؟","Apakah kebebasan itu melakukan apa yang kita mau atau apa yang seharusnya?"],["B2","2880","تُعَلِّمُنَا الْفَلْسَفَةُ أَنْ نُشَكِّكَ فِي الْمُسَلَّمَاتِ وَنَبْحَثَ عَنِ الدَّلِيلِ.","Filsafat mengajari kita meragukan hal-hal yang dianggap pasti dan mencari bukti."],["B2","2881","مَا مَعْنَى السَّعَادَةِ؟ كُلُّ إِنْسَانٍ يُجِيبُ بِطَرِيقَتِهِ.","Apa makna kebahagiaan? Setiap orang menjawab dengan caranya."],["B2","2882","قَدْ يَخْتَلِفُ الصَّوَابُ بِاخْتِلَافِ الْمَنْظُورِ وَالسِّيَاقِ.","Kebenaran bisa berbeda tergantung sudut pandang dan konteks."],["B2","2883","الْعَقْلُ يُحَلِّلُ، وَالْقَلْبُ يَشْعُرُ، وَالْحِكْمَةُ تَجْمَعُ بَيْنَهُمَا.","Akal menganalisis, hati merasakan, dan kebijaksanaan memadukan keduanya."],["B2","2884","مَنْ يُجِيبُ عَنْ كُلِّ سُؤَالٍ بِسُرْعَةٍ قَلَّمَا يُفَكِّرُ بِعُمْقٍ.","Siapa menjawab setiap pertanyaan dengan cepat jarang berpikir mendalam."],["B2","2885","لَا بُدَّ أَنْ نُمَيِّزَ بَيْنَ مَا نَعْرِفُهُ وَمَا نَظُنُّ أَنَّنَا نَعْرِفُهُ.","Kita perlu membedakan antara apa yang kita ketahui dan apa yang kita kira kita ketahui."],["B2","2886","قَالَ الْفَيْلَسُوفُ إِنَّ الْحَيَاةَ غَيْرَ الْمَفْحُوصَةِ لَا تَسْتَحِقُّ أَنْ تُعَاشَ.","Filsuf itu berkata bahwa hidup yang tidak dikaji tidak layak dijalani."],["B2","2887","الصَّمْتُ أَحْيَانًا أَبْلَغُ مِنَ الْكَلَامِ.","Diam kadang lebih fasih daripada bicara."],["B2","2888","لِكُلِّ ثَقَافَةٍ رُؤْيَتُهَا لِلْحَيَاةِ وَالْمَوْتِ وَالْخَيْرِ وَالشَّرِّ.","Setiap budaya punya pandangannya tentang hidup, mati, baik, dan buruk."],["B2","2890","السُّؤَالُ الْجَيِّدُ أَثْمَنُ مِنْ إِجَابَةٍ سَرِيعَةٍ.","Pertanyaan yang baik lebih berharga daripada jawaban cepat."],["B2","2891","هَلِ الْأَخْلَاقُ مُطْلَقَةٌ أَمْ نِسْبِيَّةٌ؟ يَخْتَلِفُ الْمُفَكِّرُونَ فِي ذَلِكَ.","Apakah akhlak itu mutlak atau relatif? Para pemikir berbeda pendapat dalam hal itu."],["B2","2893","الْحُرِّيَّةُ مَسْؤُولِيَّةٌ قَبْلَ أَنْ تَكُونَ امْتِيَازًا.","Kebebasan adalah tanggung jawab sebelum menjadi keistimewaan."],["B2","2894","قَدْ يَكُونُ الْفَهْمُ الْعَمِيقُ لِلْآخَرِينَ أَصْعَبَ مِنَ الْفَهْمِ الْعَمِيقِ لِلنَّفْسِ.","Memahami orang lain secara mendalam mungkin lebih sulit daripada memahami diri sendiri."],["B2","2895","تَصِلُ الْمُوسِيقَى إِلَى الْقَلْبِ دُونَ حَاجَةٍ إِلَى تَرْجَمَةٍ.","Musik sampai ke hati tanpa perlu terjemahan."],["B2","2896","زُرْتُ مَعْرِضًا لِلْفَنِّ الْمُعَاصِرِ وَلَمْ أَفْهَمْ بَعْضَ الْأَعْمَالِ.","Saya mengunjungi pameran seni kontemporer dan tidak memahami sebagian karyanya."],["B2","2897","يَعْزِفُ ابْنِي عَلَى الْعُودِ مُنْذُ ثَلَاثِ سَنَوَاتٍ وَقَدْ تَحَسَّنَ كَثِيرًا.","Anak saya bermain oud sejak tiga tahun dan sudah sangat membaik."],["B2","2898","تَحْتَاجُ الْمَوْهِبَةُ إِلَى التَّدْرِيبِ لِتَصِيرَ مَهَارَةً.","Bakat membutuhkan latihan agar menjadi keterampilan."],["B2","2899","أَسْتَمِعُ إِلَى الْمُوسِيقَى حِينَ أَشْعُرُ بِالتَّوَتُّرِ فَتُهَدِّئُنِي.","Saya mendengarkan musik ketika merasa tegang dan itu menenangkan saya."],["B2","2900","يَرْسُمُ الْفَنَّانُ مَشَاعِرَهُ عَلَى اللَّوْحَةِ بِأَلْوَانٍ جَرِيئَةٍ.","Sang seniman melukiskan perasaannya di kanvas dengan warna-warna berani."],["B2","2901","تُقَامُ الْحَفَلَاتُ الْمُوسِيقِيَّةُ فِي السَّاحَةِ الْكَبِيرَةِ كُلَّ جُمُعَةٍ.","Konser musik diadakan di alun-alun besar setiap Jumat."],["B2","2902","بِيعَتِ اللَّوْحَةُ بِمَبْلَغٍ كَبِيرٍ فِي الْمَزَادِ.","Lukisan itu terjual dengan harga tinggi dalam lelang."],["B2","2904","يُفَضِّلُ بَعْضُ النَّاسِ الْمُوسِيقَى الْكَلَاسِيكِيَّةَ وَيُفَضِّلُ آخَرُونَ الْحَدِيثَةَ.","Sebagian orang menyukai musik klasik dan yang lain menyukai musik modern."],["B2","2905","الْخَطُّ الْعَرَبِيُّ فَنٌّ يَجْمَعُ بَيْنَ الْكِتَابَةِ وَالزُّخْرُفَةِ.","Kaligrafi Arab adalah seni yang memadukan tulisan dan ornamen."],["B2","2906","الْفَنَّانُ الْحَقِيقِيُّ يُبْدِعُ حَتَّى حِينَ لَا يَجِدُ جُمْهُورًا.","Seniman sejati berkarya meskipun tidak menemukan penonton."],["B2","2907","لَا أَسْتَطِيعُ الْعَمَلَ دُونَ مُوسِيقَى هَادِئَةٍ فِي الْخَلْفِيَّةِ.","Saya tidak bisa bekerja tanpa musik tenang di latar belakang."],["B2","2908","تَعَلَّمْتُ مِنَ الرَّسْمِ أَنْ أَنْظُرَ إِلَى التَّفَاصِيلِ.","Saya belajar dari menggambar untuk memperhatikan detail."],["B2","2909","يَجْمَعُ الْمِهْرَجَانُ فَنَّانِينَ مِنْ ثَقَافَاتٍ مُتَنَوِّعَةٍ.","Festival itu mengumpulkan seniman dari beragam budaya."],["B2","2910","يُعَبِّرُ الْإِنْسَانُ عَنْ نَفْسِهِ بِالْفَنِّ حِينَ تَعْجِزُ الْكَلِمَاتُ.","Manusia mengungkapkan dirinya lewat seni ketika kata-kata tak mampu."],["B2","2911","يُعَلِّمُ الْفَنُّ الْأَطْفَالَ الصَّبْرَ وَالتَّعْبِيرَ عَنْ أَنْفُسِهِمْ.","Seni mengajari anak kesabaran dan mengungkapkan diri."],["B2","2912","لَكُلِّ أُغْنِيَةٍ ذِكْرَى تَرْبِطُنِي بِزَمَنٍ مُعَيَّنٍ.","Setiap lagu punya kenangan yang mengikat saya dengan masa tertentu."],["B2","2913","الضَّغْطُ الدَّائِمُ فِي الْعَمَلِ قَدْ يَقُودُ إِلَى الْإِرْهَاقِ النَّفْسِيِّ.","Tekanan terus-menerus di tempat kerja bisa menyebabkan kelelahan mental."],["B2","2914","مِنَ الْمُهِمِّ أَنْ نَفْصِلَ بَيْنَ وَقْتِ الْعَمَلِ وَوَقْتِ الرَّاحَةِ.","Penting memisahkan antara waktu kerja dan waktu istirahat."],["B2","2915","عَلَى الْمُدِيرِ أَنْ يُرَاعِيَ ظُرُوفَ مُوَظَّفِيهِ وَلَا يُحَمِّلَهُمْ فَوْقَ طَاقَتِهِمْ.","Manajer harus memperhatikan keadaan karyawannya dan tidak membebani mereka melebihi kemampuan."],["B2","2916","أَشْعُرُ بِأَنَّ جُهْدِي لَا يُقَدَّرُ فِي هَذِهِ الشَّرِكَةِ.","Saya merasa usaha saya tidak dihargai di perusahaan ini."],["B2","2917","الْعَمَلُ فِي بِيئَةٍ إِيجَابِيَّةٍ يَزِيدُ السَّعَادَةَ وَالْإِبْدَاعَ.","Bekerja di lingkungan positif meningkatkan kebahagiaan dan kreativitas."],["B2","2918","وَضَعْتُ حُدُودًا وَاضِحَةً بَيْنَ حَيَاتِي الْمِهْنِيَّةِ وَالشَّخْصِيَّةِ.","Saya menetapkan batas jelas antara kehidupan profesional dan pribadi."],["B2","2919","اسْتَقَلْتُ مِنْ عَمَلِي لِأَنَّ الْبِيئَةَ كَانَتْ سَامَّةً.","Saya mengundurkan diri dari pekerjaan karena lingkungannya beracun."],["B2","2920","يَحْتَاجُ الْمُوَظَّفُ أَحْيَانًا إِلَى مَنْ يَسْمَعُهُ دُونَ أَنْ يَحْكُمَ عَلَيْهِ.","Karyawan terkadang butuh orang yang mendengarnya tanpa menghakimi."],["B2","2921","مِنَ الطَّبِيعِيِّ أَنْ نَشْعُرَ بِالْقَلَقِ قَبْلَ أَيِّ مُهِمَّةٍ كَبِيرَةٍ.","Wajar jika kita merasa cemas sebelum tugas besar apa pun."],["B2","2922","الِاسْتِرَاحَاتُ الْقَصِيرَةُ تُجَدِّدُ تَرْكِيزَنَا وَتَرْفَعُ إِنْتَاجِيَّتَنَا.","Istirahat singkat memulihkan fokus dan meningkatkan produktivitas kita."],["B2","2923","يَنْجَحُ الْفَرِيقُ الَّذِي يَشْعُرُ أَعْضَاؤُهُ بِالْأَمَانِ فِي التَّعْبِيرِ عَنْ آرَائِهِمْ.","Tim yang anggotanya merasa aman mengutarakan pendapat akan berhasil."],["B2","2924","رَغْمَ كَثْرَةِ الْمَهَامِّ، حَاوَلْتُ أَنْ أَحْتَفِظَ بِهُدُوئِي وَأُرَتِّبَ أَوْلَوِيَّاتِي.","Meskipun tugas banyak, saya berusaha tetap tenang dan menata prioritas."],["B2","2925","لَا تَتَرَدَّدْ فِي طَلَبِ الْمُسَاعَدَةِ حِينَ تُحِسُّ بِأَنَّكَ لَا تَسْتَطِيعُ التَّحَمُّلَ.","Jangan ragu meminta bantuan ketika kamu merasa tidak sanggup menanggung."],["B2","2926","تُسَاعِدُنِي الرِّيَاضَةُ عَلَى تَصْرِيفِ التَّوَتُّرِ الَّذِي أَجْمَعُهُ فِي الْعَمَلِ.","Olahraga membantu saya melepaskan ketegangan yang saya kumpulkan di tempat kerja."],["B2","2927","التَّقْدِيرُ الصَّادِقُ مِنَ الْمُدِيرِ يُغَيِّرُ شُعُورَ الْمُوَظَّفِ بِعَمَلِهِ.","Penghargaan tulus dari manajer mengubah perasaan karyawan terhadap pekerjaannya."],["B2","2928","يَنْبَغِي أَنْ تَتَوَفَّرَ لِلْمُوَظَّفِينَ مَسَاحَةٌ آمِنَةٌ لِلْحَدِيثِ عَنْ ضُغُوطِهِمْ.","Karyawan sebaiknya memiliki ruang aman untuk membicarakan tekanan mereka."],["B2","2929","حِينَ أَنْتَهِي مِنَ الْعَمَلِ أُغْلِقُ الْحَاسُوبَ وَلَا أَفْتَحُ الْبَرِيدَ حَتَّى الصَّبَاحِ.","Ketika selesai bekerja, saya menutup komputer dan tidak membuka surel sampai pagi."],["B2","2930","يَظْهَرُ الِاحْتِرَاقُ الْوَظِيفِيُّ حِينَ نَشْعُرُ بِأَنَّ جُهْدَنَا لَا يَنْتَهِي وَلَا يُثْمِرُ.","Kelelahan kerja muncul ketika kita merasa usaha kita tak berujung dan tidak berbuah."],["B2","2931","لَا تَعْرِفُ الْأَزَمَاتُ الْعَالَمِيَّةُ حُدُودًا، وَلِذَلِكَ يَجِبُ أَنْ تَكُونَ الْحُلُولُ عَالَمِيَّةً.","Krisis global tidak mengenal batas, karena itu solusinya harus global."],["B2","2932","أَظْهَرَتِ الْجَائِحَةُ مَدَى تَرَابُطِ الْعَالَمِ وَهَشَاشَةِ نُظُمِهِ.","Pandemi menunjukkan betapa terhubungnya dunia dan rapuhnya sistemnya."],["B2","2933","تُرْسِلُ الْمُنَظَّمَاتُ الدَّوْلِيَّةُ مُسَاعَدَاتٍ إِنْسَانِيَّةً إِلَى الْمَنَاطِقِ الْمُتَضَرِّرَةِ.","Organisasi internasional mengirim bantuan kemanusiaan ke daerah-daerah terdampak."],["B2","2934","يَهْرُبُ آلَافُ النَّاسِ مِنَ الْحُرُوبِ بَحْثًا عَنِ الْأَمَانِ.","Ribuan orang melarikan diri dari perang mencari keamanan."],["B2","2935","تُسْهِمُ الدِّبْلُومَاسِيَّةُ فِي حَلِّ النِّزَاعَاتِ قَبْلَ أَنْ تَتَحَوَّلَ إِلَى حُرُوبٍ.","Diplomasi berperan menyelesaikan sengketa sebelum berubah menjadi perang."],["B2","2936","ارْتَفَعَتْ أَسْعَارُ الْغِذَاءِ عَالَمِيًّا بِسَبَبِ الْحُرُوبِ وَاضْطِرَابِ سَلَاسِلِ الْإِمْدَادِ.","Harga pangan naik secara global akibat perang dan gangguan rantai pasok."],["B2","2937","لَا يُمْكِنُ لِدَوْلَةٍ وَاحِدَةٍ أَنْ تُوَاجِهَ تَغَيُّرَ الْمُنَاخِ وَحْدَهَا.","Satu negara saja tidak mungkin menghadapi perubahan iklim sendirian."],["B2","2938","تَعْمَلُ الْجَامِعَاتُ مَعًا عَلَى أَبْحَاثٍ تُفِيدُ الْإِنْسَانِيَّةَ كُلَّهَا.","Universitas-universitas bekerja sama dalam penelitian yang bermanfaat bagi seluruh umat manusia."],["B2","2939","عَلَيْنَا أَنْ نَتَحَقَّقَ مِنَ الْأَخْبَارِ فِي أَوْقَاتِ الْأَزَمَاتِ لِأَنَّ الشَّائِعَاتِ تَنْتَشِرُ بِسُرْعَةٍ.","Kita harus memeriksa berita di masa krisis karena rumor menyebar cepat."],["B2","2940","يَتَطَوَّعُ الشَّبَابُ فِي مُخَيَّمَاتِ الْإِغَاثَةِ لِيُسَاعِدُوا مَنْ فَقَدُوا بُيُوتَهُمْ.","Pemuda menjadi sukarelawan di kamp bantuan untuk menolong yang kehilangan rumah."],["B2","2941","السَّلَامُ لَا يَعْنِي غِيَابَ الْحَرْبِ فَقَطْ، بَلْ وُجُودَ الْعَدْلِ وَالْكَرَامَةِ.","Perdamaian tidak hanya berarti tidak adanya perang, tetapi adanya keadilan dan martabat."],["B2","2942","تَحْتَاجُ الدُّوَلُ النَّامِيَةُ إِلَى دَعْمٍ تِقْنِيٍّ لَا إِلَى مُسَاعَدَاتٍ مُؤَقَّتَةٍ فَقَطْ.","Negara berkembang membutuhkan dukungan teknologi, bukan hanya bantuan sementara."],["B2","2943","لَوْ تَعَاوَنَّا أَكْثَرَ لَتَجَنَّبْنَا كَثِيرًا مِنَ الْخَسَائِرِ.","Seandainya kita lebih banyak bekerja sama, kita akan menghindari banyak kerugian."],["B2","2944","نَتَشَارَكُ جَمِيعًا هَذَا الْكَوْكَبَ، وَمُسْتَقْبَلُنَا مُرْتَبِطٌ بِبَعْضِنَا.","Kita semua berbagi planet ini, dan masa depan kita saling terkait."],["B2","2945","تُنَسِّقُ الدُّوَلُ جُهُودَهَا لِمُكَافَحَةِ الْأَوْبِئَةِ قَبْلَ أَنْ تَنْتَشِرَ عَبْرَ الْحُدُودِ.","Negara-negara mengoordinasikan upaya melawan wabah sebelum menyebar lintas batas."],["B2","2946","يَحْتَاجُ اللَّاجِئُونَ إِلَى التَّعْلِيمِ وَالْعَمَلِ وَلَيْسَ إِلَى الطَّعَامِ وَحْدَهُ.","Para pengungsi membutuhkan pendidikan dan pekerjaan, bukan hanya makanan."],["B2","2947","إِذَا تَضَرَّرَ جَارُكَ فَسَيَنْعَكِسُ ذَلِكَ عَلَيْكَ عَاجِلًا أَمْ آجِلًا.","Jika tetanggamu dirugikan, hal itu akan berdampak padamu cepat atau lambat."],["B2","2948","تَبْذُلُ الْمُنَظَّمَاتُ الْإِنْسَانِيَّةُ جُهْدًا كَبِيرًا رَغْمَ نَقْصِ التَّمْوِيلِ.","Organisasi kemanusiaan mencurahkan usaha besar meskipun kekurangan dana."],["B2","2949","يَنْشَأُ الِابْتِكَارُ مِنْ مُشْكِلَةٍ حَقِيقِيَّةٍ تَبْحَثُ عَنْ حَلٍّ ذَكِيٍّ.","Inovasi lahir dari masalah nyata yang mencari solusi cerdas."],["B2","2950","طَوَّرَ الْفَرِيقُ نَمُوذَجًا أَوَّلِيًّا لِلْمُنْتَجِ وَجَرَّبَهُ مَعَ مُسْتَخْدِمِينَ حَقِيقِيِّينَ.","Tim itu mengembangkan prototipe produk dan mengujinya dengan pengguna nyata."],["B2","2952","تُشَجِّعُ بَعْضُ الشَّرِكَاتِ مُوَظَّفِيهَا عَلَى تَجْرِبَةِ أَفْكَارٍ جَدِيدَةٍ حَتَّى لَوْ فَشِلَتْ.","Sebagian perusahaan mendorong karyawannya mencoba ide baru meskipun gagal."],["B2","2953","يُحَوِّلُ الْبَاحِثُونَ نَتَائِجَ الْمُخْتَبَرِ إِلَى مُنْتَجَاتٍ تَخْدُمُ النَّاسَ.","Para peneliti mengubah hasil laboratorium menjadi produk yang melayani masyarakat."],["B2","2954","يَحْتَاجُ الْبَاحِثُ الشَّابُّ إِلَى مُوَجِّهٍ يُرْشِدُهُ دُونَ أَنْ يَفْرِضَ رَأْيَهُ.","Peneliti muda membutuhkan pembimbing yang mengarahkan tanpa memaksakan pendapat."],["B2","2955","تُقَلِّلُ الْأَدَوَاتُ الْحَدِيثَةُ مِنْ زَمَنِ التَّجْرِبَةِ وَالْخَطَأِ.","Alat modern mempersingkat waktu coba-coba."],["B2","2956","نَشَأَتْ هَذِهِ الشَّرِكَةُ مِنْ فِكْرَةٍ بَسِيطَةٍ فِي مَرْأَبِ سَيَّارَةٍ.","Perusahaan ini lahir dari ide sederhana di garasi mobil."],["B2","2957","تَبْدَأُ الْحُلُولُ الْعَظِيمَةُ بِمُلَاحَظَةِ مَا يُزْعِجُ النَّاسَ كُلَّ يَوْمٍ.","Solusi besar dimulai dari memperhatikan apa yang mengganggu orang setiap hari."],["B2","2958","الْتَزَمَتِ الْجَامِعَةُ بِدَعْمِ الْأَبْحَاثِ الَّتِي تَخْدُمُ الْمُجْتَمَعَ الْمَحَلِّيَّ.","Universitas berkomitmen mendukung penelitian yang melayani masyarakat setempat."],["B2","2959","يَرْبِطُ الِابْتِكَارُ بَيْنَ التِّقْنِيَةِ وَالْإِبْدَاعِ وَحَاجَةِ النَّاسِ.","Inovasi menghubungkan teknologi, kreativitas, dan kebutuhan manusia."],["B2","2960","اقْتَرَحْتُ فِكْرَةً لِتَحْسِينِ الْعَمَلِيَّةِ فَوَافَقَ عَلَيْهَا الْمُدِيرُ.","Saya mengusulkan ide untuk memperbaiki proses dan manajer menyetujuinya."],["B2","2961","لَا نَنْتَظِرُ الْمُنْتَجَ الْمِثَالِيَّ، بَلْ نُطْلِقُ نُسْخَةً بَسِيطَةً وَنُحَسِّنُهَا بِمُلَاحَظَاتِ الْمُسْتَخْدِمِينَ.","Kami tidak menunggu produk sempurna, tetapi meluncurkan versi sederhana dan memperbaikinya dengan masukan pengguna."],["B2","2962","يَجِبُ أَنْ يَسْتَمِعَ الْمُبْتَكِرُ إِلَى الْمُسْتَخْدِمِ قَبْلَ أَنْ يَفْتَرِضَ مَا يُرِيدُهُ.","Inovator harus mendengarkan pengguna sebelum mengira apa yang mereka inginkan."],["B2","2963","اسْتَخْدَمَ الْمُهَنْدِسُونَ مَوَادَّ مُعَادًا تَدْوِيرُهَا فِي الْمُنْتَجِ الْجَدِيدِ.","Para insinyur memakai bahan daur ulang dalam produk baru."],["B2","2964","اجْتَمَعَ الْفَرِيقُ لِيُحَلِّلَ أَسْبَابَ فَشَلِ التَّجْرِبَةِ الْأُولَى.","Tim berkumpul untuk menganalisis sebab kegagalan percobaan pertama."],["B2","2965","تُتِيحُ الْمُنَافَسَةُ الصَّحِيَّةُ فُرَصًا لِلتَّحَسُّنِ الْمُسْتَمِرِّ.","Persaingan sehat membuka peluang untuk perbaikan berkelanjutan."],["B2","2966","تَتَعَاوَنُ الشَّرِكَاتُ وَالْجَامِعَاتُ لِتَحْوِيلِ الْأَبْحَاثِ إِلَى مُنْتَجَاتٍ تِجَارِيَّةٍ.","Perusahaan dan universitas bekerja sama mengubah penelitian menjadi produk komersial."],["B2","2967","الْفُضُولُ هُوَ الْمُحَرِّكُ الْأَوَّلُ لِكُلِّ اكْتِشَافٍ وَابْتِكَارٍ.","Rasa ingin tahu adalah penggerak pertama setiap penemuan dan inovasi."],["B2","2968","تُبْنَى الْعَادَاتُ الْجَيِّدَةُ بِخُطُوَاتٍ صَغِيرَةٍ وَتَكْرَارٍ مُسْتَمِرٍّ.","Kebiasaan baik dibangun dengan langkah kecil dan pengulangan terus-menerus."],["B2","2970","يَبْدَأُ التَّغْيِيرُ بِالْوَعْيِ بِمَا نَفْعَلُهُ كُلَّ يَوْمٍ دُونَ تَفْكِيرٍ.","Perubahan dimulai dengan menyadari apa yang kita lakukan setiap hari tanpa berpikir."],["B2","2972","يَنْبَغِي أَنْ نَضَعَ أَهْدَافًا قَابِلَةً لِلْقِيَاسِ وَأَنْ نُرَاجِعَهَا بِانْتِظَامٍ.","Kita sebaiknya menetapkan target yang terukur dan meninjaunya secara teratur."],["B2","2973","أُقَلِّلُ اسْتِخْدَامَ الْهَاتِفِ فِي الصَّبَاحِ لِأَبْدَأَ يَوْمِي بِهُدُوءٍ.","Saya mengurangi pemakaian ponsel di pagi hari untuk memulai hari dengan tenang."],["B2","2974","أَتَعَلَّمُ مِنْ أَخْطَائِي وَلَا أَجْلِدُ نَفْسِي بِسَبَبِهَا.","Saya belajar dari kesalahan dan tidak menyalahkan diri berlebihan karenanya."],["B2","2975","يُسَاعِدُنِي التَّأَمُّلُ عَشْرَ دَقَائِقَ يَوْمِيًّا عَلَى تَصْفِيَةِ ذِهْنِي.","Merenung sepuluh menit setiap hari membantu saya menjernihkan pikiran."],["B2","2976","الِانْضِبَاطُ يَتَفَوَّقُ عَلَى الْحَمَاسِ فِي الْمَدَى الطَّوِيلِ.","Disiplin mengungguli semangat dalam jangka panjang."],["B2","2977","أُحِيطُ نَفْسِي بِأَشْخَاصٍ يُشَجِّعُونَنِي عَلَى النُّمُوِّ.","Saya mengelilingi diri dengan orang-orang yang mendorong saya berkembang."],["B2","2979","النَّوْمُ الْجَيِّدُ أَسَاسُ كُلِّ عَادَةٍ جَيِّدَةٍ أُخْرَى.","Tidur yang baik adalah dasar setiap kebiasaan baik lainnya."],["B2","2980","كُلَّمَا ازْدَدْتُ عِلْمًا اكْتَشَفْتُ كَمْ أَجْهَلُ.","Semakin bertambah ilmu saya, semakin saya sadar betapa banyak yang belum saya tahu."],["B2","2981","لَا يَأْتِي النَّجَاحُ بَيْنَ لَيْلَةٍ وَضُحَاهَا، بَلْ بِعَمَلٍ يَوْمِيٍّ صَبُورٍ.","Keberhasilan tidak datang dalam semalam, tetapi dengan kerja harian yang sabar."],["B2","2982","أُخَصِّصُ نِصْفَ سَاعَةٍ كُلَّ مَسَاءٍ لِمُرَاجَعَةِ يَوْمِي وَالتَّخْطِيطِ لِغَدِي.","Saya menyediakan setengah jam setiap malam untuk meninjau hari saya dan merencanakan esok."],["B2","2983","عِنْدَمَا أَشْعُرُ بِالْكَسَلِ أَبْدَأُ بِخُمْسِ دَقَائِقَ فَقَطْ.","Ketika merasa malas, saya mulai hanya dengan lima menit."],["B2","2984","لَا بَأْسَ أَنْ نَرْتَاحَ، فَالرَّاحَةُ جُزْءٌ مِنَ الْإِنْتَاجِيَّةِ.","Tidak apa-apa beristirahat, sebab istirahat bagian dari produktivitas."],["B2","2986","مَنْ سَارَ عَلَى الدَّرْبِ بِصَبْرٍ بَلَغَ مَقْصِدَهُ، وَلَوْ بَعْدَ حِينٍ.","Siapa menempuh jalan dengan sabar akan mencapai tujuannya, meskipun setelah beberapa waktu."],["B2","2988","لَيْسَتِ الْغَايَةُ أَنْ نَحْفَظَ الْجُمَلَ فَقَطْ، بَلْ أَنْ نَسْتَخْدِمَهَا فِي حَيَاتِنَا.","Tujuannya bukan hanya menghafal kalimat, tetapi memakainya dalam kehidupan kita."],["B2","2989","كُلُّ لُغَةٍ نَتَعَلَّمُهَا تُعْطِينَا حَيَاةً جَدِيدَةً وَنَظْرَةً أَوْسَعَ إِلَى الْعَالَمِ.","Setiap bahasa yang kita pelajari memberi kita kehidupan baru dan pandangan yang lebih luas tentang dunia."],["B2","2990","لَا تَخَفْ مِنَ الْخَطَإِ فِي الْكَلَامِ، فَهُوَ سُلَّمُ التَّعَلُّمِ.","Jangan takut salah dalam berbicara, sebab itu tangga belajar."],["B2","2992","الْعِلْمُ نُورٌ، وَالْجَهْلُ ظَلَامٌ، وَالْعَمَلُ ثَمَرَةُ الْعِلْمِ.","Ilmu adalah cahaya, kebodohan adalah kegelapan, dan amal adalah buah ilmu."],["B2","2995","حَافِظْ عَلَى مَا تَعَلَّمْتَ بِالْمُرَاجَعَةِ وَالْمُمَارَسَةِ كُلَّ يَوْمٍ.","Jagalah apa yang telah kamu pelajari dengan mengulang dan berlatih setiap hari."],["B2","2996","اللُّغَةُ جِسْرٌ بَيْنَ الْقُلُوبِ، وَكُلُّ كَلِمَةٍ طَيِّبَةٍ تَبْنِي جِسْرًا جَدِيدًا.","Bahasa adalah jembatan antar hati, dan setiap kata yang baik membangun jembatan baru."],["B2","2997","تَعَلَّمْنَا مَعًا آلَافَ الْجُمَلِ، وَمَا زَالَتْ أَمَامَنَا آلَافُ الْفُرَصِ لِنَسْتَخْدِمَهَا.","Kita telah belajar ribuan kalimat bersama, dan masih ada ribuan kesempatan untuk memakainya."],["B2","2998","أَفْضَلُ مَا نَتْرُكُهُ لِمَنْ بَعْدَنَا عِلْمٌ نَافِعٌ وَسِيرَةٌ طَيِّبَةٌ.","Yang terbaik yang kita tinggalkan bagi yang datang setelah kita adalah ilmu yang bermanfaat dan kenangan yang baik."],["B2","2999","كُنْ صَبُورًا مَعَ نَفْسِكَ، فَالتَّعَلُّمُ رِحْلَةٌ لَا سِبَاقٌ.","Bersabarlah dengan dirimu, sebab belajar adalah perjalanan, bukan perlombaan."],["B2","3000","شُكْرًا لَكَ عَلَى صَبْرِكَ وَاجْتِهَادِكَ، وَإِلَى اللِّقَاءِ فِي رِحْلَةٍ جَدِيدَةٍ إِنْ شَاءَ اللَّهُ.","Terima kasih atas kesabaran dan kesungguhanmu, sampai jumpa dalam perjalanan baru, insya Allah."]]}, CFG={"logo": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAHgAAAB4CAYAAAA5ZDbSAABtlUlEQVR42u39d5hdZ3nuj3/ed7Xd9/Sq3qwu27Jsy72BMb1E5lCSYFIoSTgkISGkOU44aSeFtG+AJBAO3SZgiG1sbGwL9yJZsnrXjKbXPbvvVd7398dau4wsUk6AcK7rN7oG5JnRnr3Ws552P/dzv4If/w9x5513Ch5/XLJ7t7oLVOs3H/j8nZmRY2eWBoE7oJW3TnvBaoFe6vt6QAdBj9Yqq5ROaKViUkhDCAVCBoZhVk1TlqVhLBimMSWFHBOWcU4JfUpo87hMZsbWb73o3JWv/Z/51t93J0juvF7CDequu+7SgP6xvnk/zu/t7l275KGN9+i77moa9e4//mh2euHEpaWF6hV+1btEKLVa+WrQ8/wegZaGlEhDIgwTwzYwHQPLjGEYBlKaIEBrhQ4CAuWjXB/le6ggQCkFWqO0UJZjTtmWNaoN45SdjL/U2ZV9Lrt01d5X3f4bC63G3rRrl9h19z1KiB9PQ/+4GVjs2rVLbty4Ud91112hUYXgf//KGzZS9ncKT99SKhSv9WrVAbQWphPDTiVJtmdo6+rU3f0DqnOgj0xHl0i3d5JIp0U8Ece2HCFNE6QJGGilCTwX16vpSrFAtVTQhVyO/Nyczk1MMDc5LvPzs6I0N4dfqYIOwLC0HbPGMqn0E2bcekSknWd+6qOfO6yVWmTs2++5R/04efWPjYF37dplbLznHl0PwX/xm7f2V8bdN9dK7ht9P7hM+UGXMCSpTIauJQMsv2hlsHL9Wt2/fIlId7ZLjBQgBXgot0q1VKaUL1MqlXErFXyvRhAECGFgmAlsx8KJx0ikkyTTGexkCiGSgAR8DSVy07NqYmhIjxw/LoZPnDDmxyZwSyWEAMM2Z+x47MVkJvWtdRtX33v9T/7heHQp8u7Q0MH/38Agrr8eY/duAkALKfj9O667QVfUO0qFylv8mt+tDUh3dbJu2wZ//SUbxdqN62S6rz9836VZRkfGmBgaZmp0ktmpeRYKRVy3htYBaIUhDUwpMQwDAI1GCAM0KB2gtEaYEtuMEYvFyGTTtPf00LVkCb1LltE5sARoA6rkpkb0yQOH1dE9e/XwkWNmOV8gZlnYqfh0R2fbN8y0/eWf+b2vPK6CIKwdrr/e+L3Hdwf/neF function add(o){o.nk=norm(o.ar+' '+(o.forms.map(f=>f[1]).join(' ')));o.ik=(o.id+' '+(o.oid||'')).toLowerCase();ENT[o.k]=o;ORDER.push(o.k)}
/* storage */
function ls(k,d){try{const v=localStorage.getItem('kamus_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem('kamus_'+k,JSON.stringify(v))}catch(e){}}
let FAV=ls('fav',[]),BOX=ls('box',{});
const isFav=k=>FAV.includes(k),hafal=k=>(BOX[k]||0)>=3;
function toggleFav(k){FAV=isFav(k)?FAV.filter(x=>x!==k):FAV.concat(k);lsSet('fav',FAV)}
/* audio */
let cur=null;
function stopAudio(){try{if(cur){cur.pause();cur=null}speechSynthesis&&speechSynthesis.cancel()}catch(e){}document.querySelectorAll('.on').forEach(b=>{if(b.classList.contains('play')||b.classList.contains('p2'))b.classList.remove('on')})}
function tts(text,done){try{if(!window.speechSynthesis)return done();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.85;const v=speechSynthesis.getVoices().find(x=>/^ar/i.test(x.lang));if(v)u.voice=v;u.onend=done;u.onerror=done;speechSynthesis.speak(u)}catch(e){done()}}
function playUrl(url,text,btn){stopAudio();if(btn)btn.classList.add('on');const done=()=>{if(btn)btn.classList.remove('on')};
 const a=new Audio(url);cur=a;a.onended=done;a.onerror=()=>{if(cur===a)tts(text,done)};const p=a.play();if(p&&p.catch)p.catch(()=>{if(cur===a)tts(text,done)})}

const saySent=(s,btn)=>playUrl(CFG.sent[s[0]]+s[1]+'.mp3',s[2],btn);
/* header */
function head(){return `<header><a class="brand" href="#home"><img src="${CFG.logo}" alt="Logo"><span><b>العربية الفصحى</b><small>AL-FUSHA ACADEMY</small></span></a><span class="badge">KAMUS<br>A1–B2</span></header>`}
function searchBox(q){return `<div class="search" style="position:sticky"><div style="position:relative"><span>🔍</span><input id="q" type="search" placeholder="Cari kata Arab atau Indonesia…" value="${esc(q||'')}" autocomplete="off"></div></div>`}
function bindSearch(){const q=$('#q');if(!q)return;q.oninput=()=>{const v=q.value.trim();if(v)renderSearch(v);else route()};}
function rowHTML(e,extra){return `<button class="row" data-k="${e.k}"><div class="m"><b>${esc(e.id)}</b><small>${extra||e.kind}${hafal(e.k)?' · ✅':''}</small></div><div class="w">${esc(e.ar)}${e.sub?`<small>${esc(e.sub)}</small>`:''}</div>${isFav(e.k)?'<span class="st">⭐</span>':''}</button>`}

 <div class="list">${list.length?list.map(e=>rowHTML(e)).join(''):'<p class="empty">Tidak ada kata.</p>'}</div></div>`;bindRows();bindSearch()}
function verbs(lv){const list=ORDER.filter(k=>k[0]==='v'&&ENT[k].lv===lv).map(k=>ENT[k]);
 app.innerHTML=head()+searchBox()+`<div id="res"><div class="top"><button class="back" onclick="go('home')">←</button><h2>Kata Kerja<span class="ar">الْأَفْعَالُ</span></h2><button class="btn sm" onclick="go('cards/v${lv}')">🎴</button></div>
 <div class="tabs">${['A1','A2','B1','B2'].map(l=>`<button class="${l===lv?'on':''}" style="${l===lv?`background:var(--${l});border-color:var(--${l})`:''}" onclick="go('verbs/${l}')">${l} · ${LV[l]}</button>`).join('')}</div>
 <div class="list">${list.map(e=>rowHTML(e,'Madhi · Mudhari‘ · Mashdar')).join('')}</div></div>`;bindRows();bindSearch()}
function ants(ak){const list=ORDER.filter(k=>k[0]==='o'&&ENT[k].ak===ak).map(k=>ENT[k]);
 app.innerHTML=head()+searchBox()+`<div id="res"><div class="top"><button class="back" onclick="go('home')">←</button><h2>Lawan Kata<span class="ar">الْأَضْدَادُ</span></h2><button class="btn sm" onclick="go('cards/o${ak}')">🎴</button></div>
 <div class="tabs">${Object.entries(AK).map(([k,n])=>`<button class="${k===ak?'on':''}" onclick="go('ant/${k}')">${n}</button>`).join('')}</div>
 <div class="list">${list.map(e=>`<button class="pair" data-k="${e.k}"><div class="s"><span class="ar">${esc(e.ar)}</span><small>${esc(e.id)}</small></div><span class="x">↔</span><div class="s"><span class="ar">${esc(e.opp)}</span><small>${esc(e.oid)}</small></div></button>`).join('')}</div></div>`;bindRows();bindSearch()}
function fav(){const list=FAV.map(k=>ENT[k]).filter(Boolean);
 app.innerHTML=head()+searchBox()+`<div id="res"><div class="top"><button class="back" onclick="go('home')">←</button><h2>Kata Saya ⭐<span class="ar">كَلِمَاتِي</span></h2>${list.length?`<button class="btn sm" onclick="go('cards/fav')">🎴</button>`:''}</div>
 <div class="list">${list.length?list.map(e=>rowHTML(e)).join(''):'<p class="empty">Belum ada kata.<br>Tekan ☆ pada kata mana pun untuk menyimpannya di sini.</p>'}</div></div>`;bindRows();bindSearch()}
function renderSearch(v){const res=$('#res');const n=norm(v),low=v.toLowerCase(),isAr=/[؀-ۿ]/.test(v);
 const hits=ORDER.filter(k=>isAr?ENT[k].nk.includes(n):ENT[k].ik.includes(low));
 hits.sort((a,b)=>{const A=ENT[a],B=ENT[b],ea=isAr?norm(A.ar)===n:A.id.toLowerCase().split(/[;,(]/)[0].trim()===low,eb=isAr?norm(B.ar)===n:B.id.toLowerCase().split(/[;,(]/)[0].trim()===low;return eb-ea});
 const show=hits.slice(0,80);
 res.innerHTML=`<div class="cnt"><span>${hits.length} hasil untuk “${esc(v)}”</span></div><div class="list">${show.length?show.map(e=>rowHTML(ENT[e])).join(''):'<p class="empty">Tidak ditemukan. Coba kata lain atau tanpa harakat.</p>'}</div>`;bindRows(res)}
/* word sheet */
function hl(ar,e){const keys=e.forms.map(f=>norm(f[1].split(' ')[0])).filter(x=>x.length>=2);return ar.split(' ').map(w=>{const n=norm(w).replace(/[^ء-ي]/g,'');return keys.some(k=>{const b=k.startsWith('ال')&&k.length>=5?k.slice(2):k;return n.includes(b.length>=3?b:k)})?`<mark>${esc(w)}</mark>`:esc(w)}).join(' ')}
function openWord(k){const e=ENT[k];stopAudio();
 const ctx=e.type==='v'?`<span class="lvl" style="background:var(--${e.lv})">${e.lv}</span>`:e.th!==undefined?`Tema ${e.th+1} · ${esc(D.themes[e.th][1])}`:'';
 const sh=document.createElement('div');sh.className='shade';
 sh.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="hd"><span class="kind">${e.kind} ${ctx?'· '+ctx:''}</span><button class="back" id="x" aria-label="Tutup">✕</button></div>
 <div class="wbig"><div class="ar">${esc(e.ar)}</div><div class="mn">${esc(e.id)}</div></div>
 <div style="display:flex;gap:12px;justify-content:center;align-items:center;margin-top:8px"><button class="play" id="pl" aria-label="Dengar">🔊</button><button class="star" id="fv" aria-label="Simpan">${isFav(k)?'⭐':'☆'}</button><button class="btn sm ${hafal(k)?'ok':'ghost'}" id="hf">${hafal(k)?'✅ Hafal':'Tandai hafal'}</button></div>
 <div class="forms">${e.forms.map(f=>`<div class="form"><small>${f[0]}</small><div class="ar">${esc(f[1])}</div></div>`).join('')}${e.type==='o'?`<div class="form"><small>Arti</small><b style="font-size:.85rem">${esc(e.id)} ↔ ${esc(e.oid)}</b></div>`:''}</div>
 ${e.s.length?`<div class="sec">💡 Dalam kalimat <span style="font-weight:500;color:var(--mut);font-size:.78rem">dari seri 3000 Kalimat</span></div>${e.s.map(i=>{const s=D.S[i];return `<div class="sent"><div class="tx"><span class="ar">${hl(s[2],e)}</span><small><span class="lvl" style="background:var(--${s[0]})">${s[0]}</span> ${esc(s[3])}</small></div><button class="p2" data-i="${i}" aria-label="Dengar kalimat">▶</button></div>`}).join('')}`:''}
 </div>`;
 document.body.appendChild(sh);document.body.style.overflow='hidden';
 const close=()=>{stopAudio();sh.remove();document.body.style.overflow='';route(true)};
 sh.onclick=ev=>{if(ev.target===sh)close()};sh.querySelector('#x').onclick=close;
 sh.querySelector('#pl').onclick=ev=>sayWord(e,ev.currentTarget);
 sh.querySelector('#fv').onclick=ev=>{toggleFav(k);ev.currentTarget.textContent=isFav(k)?'⭐':'☆'};
 sh.querySelector('#hf').onclick=ev=>{BOX[k]=hafal(k)?0:3;lsSet('box',BOX);ev.currentTarget.className='btn sm '+(hafal(k)?'ok':'ghost');ev.currentTarget.textContent=hafal(k)?'✅ Hafal':'Tandai hafal'};
 sh.querySelectorAll('.p2').forEach(b=>b.onclick=()=>saySent(D.S[+b.dataset.i],b));
 setTimeout(()=>sayWord(e,sh.querySelector('#pl')),250)}
/* flash cards */
function deckOf(id){if(id==='fav')return FAV.slice();if(id==='all')return ORDER.slice();
 if(id[0]==='t'){const i=+id.slice(1);return ORDER.filter(k=>(k[0]==='n'||k[0]==='a')&&ENT[k].th===i)}
 if(id[0]==='v')return ORDER.filter(k=>k[0]==='v'&&ENT[k].lv===id.slice(1));
 if(id[0]==='o')return ORDER.filter(k=>k[0]==='o'&&ENT[k].ak===id.slice(1));return []}
function deckName(id){if(id==='fav')return 'Kata Saya';if(id==='all')return 'Semua kata';if(id[0]==='t')return 'Tema '+(+id.slice(1)+1)+' · '+D.themes[+id.slice(1)][1];if(id[0]==='v')return 'Kata Kerja '+id.slice(1);if(id[0]==='o')return 'Lawan Kata · '+AK[id.slice(1)];return ''}
function cards(id){if(!id){
  app.innerHTML=head()+`<div class="top"><button class="back" onclick="go('home')">←</button><h2>Kartu Hafalan 🎴<span class="ar">بِطَاقَاتُ الْحِفْظِ</span></h2></div><p class="empty" style="padding:0 0 12px">Pilih kumpulan kata. Kata yang belum hafal akan muncul lebih sering.</p>
  <div class="list">${['all','fav','vA1','vA2','vB1','vB2','oon','ooa','oov'].concat(D.themes.map((_,i)=>'t'+i)).map(d=>{const ks=deckOf(d);if(!ks.length)return '';const h=ks.filter(hafal).length;return `<button class="row" onclick="go('cards/${d}')"><div class="m"><b>${esc(deckName(d))}</b><small>${h}/${ks.length} hafal</small></div><span class="st">▶</span></button>`}).join('')}</div>`;return}
 const all=deckOf(id);if(!all.length)return go('cards');
 const pick=shuffle(all).sort((a,b)=>(BOX[a]||0)-(BOX[b]||0)).slice(0,20),session=shuffle(pick);let i=0,ok=0;
 function show(){if(i>=session.length){const h=all.filter(hafal).length;app.innerHTML=head()+`<div class="top"><button class="back" onclick="go('cards')">←</button><h2>Selesai! 🎉</h2></div><div class="th" style="text-align:center;padding:24px"><div style="font-size:3rem">🏆</div><b style="font-size:1.2rem">${ok} dari ${session.length} kata kamu hafal</b><small style="font-size:.85rem;margin:6px 0 14px">Progres kumpulan ini: ${h}/${all.length} hafal</small><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="go('cards/${id}',1)">↻ Lagi</button><button class="btn ghost" onclick="go('cards')">Pilih kumpulan</button></div></div>`;return}
  const e=ENT[session[i]];
  app.innerHTML=head()+`<div class="top"><button class="back" onclick="go('cards')">←</button><h2 style="font-size:1rem">${esc(deckName(id))}</h2></div><div class="cnt"><span>${i+1}/${session.length}</span><span>✅ ${ok}</span></div><div class="bar2"><b style="width:${i/session.length*100}%"></b></div>
  <div class="fc" id="fc"><div class="in"><div class="f"><div class="ar">${esc(e.ar)}</div><small>Ketuk kartu untuk melihat arti</small></div><div class="b"><div class="mn">${esc(e.id)}</div><div class="ar">${e.forms.slice(1).map(f=>esc(f[1])).join(' · ')}</div></div></div></div>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn no" id="bl">😕 Belum</button><button class="play" id="pl" aria-label="Dengar">🔊</button><button class="btn ok" id="hf">✅ Hafal</button></div>`;
  $('#fc').onclick=()=>$('#fc').classList.toggle('flip');$('#pl').onclick=ev=>sayWord(e,ev.currentTarget);
  $('#bl').onclick=()=>{BOX[e.k]=0;lsSet('box',BOX);i++;show()};$('#hf').onclick=()=>{BOX[e.k]=(BOX[e.k]||0)+1;lsSet('box',BOX);ok++;i++;show()};
  setTimeout(()=>sayWord(e,$('#pl')),200)}
 show()}
/* router */
function go(h,force){if(location.hash==='#'+h&&force)route();else location.hash=h}
function route(keep){if(keep&&$('#q')&&$('#q').value.trim())return;const h=(location.hash||'#home').slice(1).split('/');stopAudio();if(!keep)window.scrollTo(0,0);
 if(h[0]==='themes')themes();else if(h[0]==='t')theme(h[1],h[2]||'n');else if(h[0]==='verbs')verbs(h[1]||'A1');else if(h[0]==='ant')ants(h[1]||'on');else if(h[0]==='fav')fav();else if(h[0]==='cards')cards(h[1]);else home()}
addEventListener('hashchange',()=>route());route();
</script>
