tasikan dengan yang berpengalaman sebelum memulai."],["B1","1985","تَذَكَّرْ أَنَّ النَّجَاحَ يَحْتَاجُ إِلَى صَبْرٍ.","Ingat bahwa sukses butuh kesabaran."],["B1","1986","اعْتَنِ بِصِحَّتِكَ قَبْلَ أَنْ تَفْقِدَهَا.","Jaga kesehatanmu sebelum kehilangannya."],["B1","1987","لَا تَسْمَحْ لِلْخَوْفِ أَنْ يَمْنَعَكَ مِنَ الْمُحَاوَلَةِ.","Jangan biarkan rasa takut menghalangimu mencoba."],["B1","1988","كُنْ لَطِيفًا مَعَ مَنْ حَوْلَكَ فَكُلُّنَا نَخُوضُ مَعَارِكَ.","Bersikaplah baik kepada orang di sekitarmu, sebab kita semua punya perjuangan."],["B1","1989","يَعْتَمِدُ الذَّكَاءُ الِاصْطِنَاعِيُّ عَلَى كَمٍّ هَائِلٍ مِنَ الْبَيَانَاتِ.","Kecerdasan buatan bergantung pada data dalam jumlah sangat besar."],["B1","1990","قَدْ تُغَيِّرُ هَذِهِ التِّقْنِيَّةُ طَرِيقَةَ عَمَلِنَا.","Teknologi ini mungkin mengubah cara kerja kita."],["B1","1991","مِنَ الْمُهِمِّ أَنْ نَسْتَخْدِمَهَا بِمَسْؤُولِيَّةٍ.","Penting menggunakannya secara bertanggung jawab."],["B1","1992","تَطَوَّرَتِ الطَّاقَةُ الشَّمْسِيَّةُ كَثِيرًا فِي السَّنَوَاتِ الْأَخِيرَةِ.","Energi surya berkembang pesat dalam beberapa tahun terakhir."],["B1","1993","أَصْبَحَتِ السَّيَّارَاتُ الْكَهْرَبَائِيَّةُ أَكْثَرَ انْتِشَارًا.","Mobil listrik semakin banyak digunakan."],["B1","1994","يَعْمَلُ الْعُلَمَاءُ عَلَى إِيجَادِ عِلَاجٍ لِهَذَا الْمَرَضِ.","Para ilmuwan berupaya menemukan pengobatan untuk penyakit ini."],["B1","1995","أَثْبَتَتِ الدِّرَاسَةُ أَنَّ النَّوْمَ الْكَافِيَ يُحَسِّنُ الذَّاكِرَةَ.","Studi membuktikan bahwa tidur yang cukup memperbaiki ingatan."],["B1","1996","سَتَتَطَوَّرُ الْأَجْهِزَةُ الذَّكِيَّةُ بِسُرْعَةٍ أَكْبَرَ.","Perangkat pintar akan berkembang lebih cepat."],["B1","1997","هَلْ تُؤَثِّرُ هَذِهِ التِّقْنِيَّاتُ عَلَى خُصُوصِيَّتِنَا؟","Apakah teknologi ini memengaruhi privasi kita?"],["B1","1998","يَنْبَغِي أَنْ نُوَاكِبَ التَّطَوُّرَ دُونَ أَنْ نَفْقِدَ إِنْسَانِيَّتَنَا.","Kita seharusnya mengikuti perkembangan tanpa kehilangan kemanusiaan kita."],["B1","1999","أَجْرَى الْبَاحِثُونَ تَجْرِبَةً عَلَى نِطَاقٍ وَاسِعٍ.","Para peneliti melakukan eksperimen berskala luas."],["B1","2000","يُتَوَقَّعُ أَنْ تَظْهَرَ اخْتِرَاعَاتٌ جَدِيدَةٌ فِي الْمُسْتَقْبَلِ الْقَرِيبِ.","Diperkirakan akan muncul penemuan baru dalam waktu dekat."],["B1","2001","أَبْحَثُ عَنْ شَقَّةٍ لِلْإِيجَارِ فِي هَذَا الْحَيِّ.","Saya sedang mencari apartemen untuk disewa di lingkungan ini."],["B1","2002","كَمْ يَبْلُغُ الْإِيجَارُ الشَّهْرِيُّ؟","Berapa sewa bulanannya?"],["B1","2003","هَلِ الشَّقَّةُ مَفْرُوشَةٌ أَمْ فَارِغَةٌ؟","Apakah apartemennya berperabot atau kosong?"],["B1","2004","أُرِيدُ أَنْ أَرَى الشَّقَّةَ قَبْلَ التَّوْقِيعِ.","Saya ingin melihat apartemennya sebelum tanda tangan."],["B1","2005","هَلْ يَشْمَلُ الْإِيجَارُ فَوَاتِيرَ الْكَهْرَبَاءِ؟","Apakah sewa sudah termasuk tagihan listrik?"],["B1","2006","مَا مُدَّةُ عَقْدِ الْإِيجَارِ؟","Berapa lama masa kontrak sewanya?"],["B1","2007","يَجِبُ أَنْ أَدْفَعَ تَأْمِينًا قَبْلَ السَّكَنِ.","Saya harus membayar uang jaminan sebelum menempati."],["B1","2008","السَّقْفُ يُسَرِّبُ الْمَاءَ عِنْدَ الْمَطَرِ.","Atapnya bocor saat hujan."],["B1","2009","لَا يَعْمَلُ مُكَيِّفُ الْهَوَاءِ فِي غُرْفَةِ النَّوْمِ.","AC di kamar tidur tidak berfungsi."],["B1","2010","هَلْ فِي الْمَبْنَى مِصْعَدٌ؟","Apakah di gedung ini ada lift?"],["B1","2011","سَأَنْتَقِلُ إِلَى بَيْتِي الْجَدِيدِ الْأُسْبُوعَ الْقَادِمَ.","Saya akan pindah ke rumah baru minggu depan."],["B1","2012","أَنْهَيْتُ الْعَقْدَ وَسَأُسَلِّمُ الْمَفَاتِيحَ غَدًا.","Saya sudah mengakhiri kontrak dan akan menyerahkan kunci besok."],["B1","2013","الْإِيجَارُ هُنَا أَغْلَى مِنْهُ فِي الضَّوَاحِي.","Sewa di sini lebih mahal daripada di pinggiran kota."],["B1","2014","هَلْ يُسْمَحُ بِتَرْبِيَةِ الْحَيَوَانَاتِ فِي الشَّقَّةِ؟","Apakah boleh memelihara hewan di apartemen?"],["B1","2015","أَيْنَ أَجِدُ مَالِكَ الْعَقَارِ؟","Di mana saya bisa menemui pemilik properti?"],["B1","2016","الْغُرْفَةُ صَغِيرَةٌ لَكِنَّهَا مُرِيحَةٌ وَنَظِيفَةٌ.","Kamarnya kecil tetapi nyaman dan bersih."],["B1","2017","أُفَضِّلُ السَّكَنَ مَعَ زَمِيلٍ لِتَوْفِيرِ التَّكَالِيفِ.","Saya lebih suka tinggal bersama teman untuk menghemat biaya."],["B1","2018","هَلِ الْحَيُّ آمِنٌ فِي اللَّيْلِ؟","Apakah lingkungan ini aman pada malam hari?"],["B1","2019","أَكْتُبُ إِلَيْكُمْ بِخُصُوصِ الْوَظِيفَةِ الْمُعْلَنَةِ.","Saya menulis kepada Anda sekalian mengenai lowongan yang diumumkan."],["B1","2020","أَرْفَقْتُ سِيرَتِي الذَّاتِيَّةَ مَعَ هَذِهِ الرِّسَالَةِ.","Saya melampirkan CV saya bersama surat ini."],["B1","2021","يَسُرُّنِي أَنْ أَحْضُرَ الْمُقَابَلَةَ فِي أَيِّ وَقْتٍ.","Saya senang menghadiri wawancara kapan saja."],["B1","2022","حَدِّثْنِي عَنْ نَفْسِكَ وَخِبْرَاتِكَ السَّابِقَةِ.","Ceritakan kepada saya tentang dirimu dan pengalamanmu sebelumnya."],["B1","2023","مَا هِيَ نِقَاطُ قُوَّتِكَ؟","Apa saja kekuatanmu?"],["B1","2025","أَعْتَذِرُ عَنْ تَأَخُّرِي فِي الرَّدِّ عَلَى رِسَالَتِكُمْ.","Saya mohon maaf atas keterlambatan membalas surat Anda."],["B1","2026","أَرْجُو إِفَادَتِي بِمَوْعِدِ الِاجْتِمَاعِ الْقَادِمِ.","Mohon beri tahu saya jadwal rapat berikutnya."],["B1","2027","تَحِيَّةً طَيِّبَةً وَبَعْدُ، أَوَدُّ الِاسْتِفْسَارَ عَنْ خِدْمَاتِكُمْ.","Salam hormat, saya ingin menanyakan tentang layanan Anda."],["B1","2028","مَعَ خَالِصِ التَّقْدِيرِ وَالِاحْتِرَامِ.","Dengan hormat dan penghargaan yang tulus."],["B1","2029","هَلْ يُمْكِنُ تَغْيِيرُ مَوْعِدِ الْمُقَابَلَةِ إِلَى الْأُسْبُوعِ الْقَادِمِ؟","Apakah jadwal wawancara bisa diubah ke minggu depan?"],["B1","2031","مَا الرَّاتِبُ الَّذِي تَتَوَقَّعُهُ؟","Berapa gaji yang kamu harapkan?"],["B1","2032","سَنَتَّصِلُ بِكَ خِلَالَ أُسْبُوعٍ لِإِبْلَاغِكَ بِالْقَرَارِ.","Kami akan menghubungimu dalam seminggu untuk menyampaikan keputusan."],["B1","2034","أَوَدُّ أَنْ أَشْكُرَكُمْ عَلَى الْفُرْصَةِ.","Saya ingin berterima kasih kepada Anda atas kesempatannya."],["B1","2035","لَمْ أَتَسَلَّمْ أَيَّ رَدٍّ حَتَّى الْآنَ.","Saya belum menerima balasan apa pun sampai sekarang."],["B1","2036","مَعْذِرَةً، هَلْ لِي أَنْ أُضِيفَ نُقْطَةً؟","Maaf, bolehkah saya menambahkan satu poin?"],["B1","2037","أَحْتَرِمُ رَأْيَكَ لَكِنِّي أَرَى الْأَمْرَ بِشَكْلٍ مُخْتَلِفٍ.","Saya menghormati pendapatmu tetapi saya melihat masalahnya secara berbeda."],["B1","2038","لَقَدْ فَهِمْتُ وِجْهَةَ نَظَرِكَ جَيِّدًا.","Saya sudah memahami sudut pandangmu dengan baik."],["B1","2039","مَا قُلْتَهُ صَحِيحٌ جُزْئِيًّا فَقَطْ.","Apa yang kamu katakan hanya benar sebagian."],["B1","2040","دَعْنَا نَسْتَمِعْ إِلَى الْجَمِيعِ قَبْلَ أَنْ نَتَّخِذَ الْقَرَارَ.","Mari kita dengarkan semua orang sebelum kita memutuskan."],["B1","2041","لَا أُرِيدُ أَنْ أَقَاطِعَكَ، لَكِنْ عِنْدِي سُؤَالٌ.","Saya tidak ingin menyela, tetapi saya punya pertanyaan."],["B1","2042","أَعْتَقِدُ أَنَّنَا نَسْتَطِيعُ الْوُصُولَ إِلَى حَلٍّ وَسَطٍ.","Saya yakin kita bisa mencapai jalan tengah."],["B1","2043","مِنَ الْأَفْضَلِ أَنْ نَتَحَدَّثَ بِهُدُوءٍ.","Sebaiknya kita berbicara dengan tenang."],["B1","2044","هَلْ يُمْكِنُكَ أَنْ تُوَضِّحَ مَا تَقْصِدُهُ؟","Bisakah kamu menjelaskan apa yang kamu maksud?"],["B1","2045","أَنَا لَا أُوَافِقُ تَمَامًا، وَلَكِنِّي أَفْهَمُ سَبَبَكَ.","Saya tidak sepenuhnya setuju, tetapi saya mengerti alasanmu."],["B1","2046","لِنَتَّفِقْ عَلَى أَنْ نَخْتَلِفَ فِي هَذِهِ النُّقْطَةِ.","Mari kita sepakat untuk berbeda pendapat dalam hal ini."],["B1","2047","مِنْ فَضْلِكَ، اخْفِضْ صَوْتَكَ قَلِيلًا.","Tolong pelankan sedikit suaramu."],["B1","2048","لَا أَقْصِدُ الْإِسَاءَةَ إِلَيْكَ، فَقَطْ أُرِيدُ الْوُضُوحَ.","Saya tidak bermaksud menyinggungmu, saya hanya ingin jelas."],["B1","2049","دَعْنِي أُلَخِّصْ مَا اتَّفَقْنَا عَلَيْهِ.","Biar saya ringkas apa yang telah kita sepakati."],["B1","2050","رُبَّمَا أَخْطَأْتُ فِي فَهْمِ كَلَامِكَ.","Mungkin saya salah memahami perkataanmu."],["B1","2051","مَا رَأْيُكُمْ أَنْ نُؤَجِّلَ الْقَرَارَ إِلَى الْغَدِ؟","Bagaimana kalau kita tunda keputusan sampai besok?"],["B1","2052","أَشْكُرُكُمْ عَلَى هَذَا النِّقَاشِ الْمُفِيدِ.","Terima kasih atas diskusi yang bermanfaat ini."],["B1","2053","أُفَضِّلُ أَنْ نَسْمَعَ الْأَدِلَّةَ قَبْلَ الْحُكْمِ.","Saya lebih suka kita mendengar bukti dulu sebelum menilai."],["B1","2055","لَوْ كُنْتُ غَنِيًّا لَسَافَرْتُ حَوْلَ الْعَالَمِ.","Seandainya saya kaya, saya akan berkeliling dunia."],["B1","2057","أَتَمَنَّى أَنْ تَكُونَ الْحَيَاةُ أَسْهَلَ قَلِيلًا.","Saya berharap hidup ini sedikit lebih mudah."],["B1","2058","نَدِمْتُ عَلَى مَا قُلْتُهُ لَهُ أَمْسِ.","Saya menyesal atas apa yang saya katakan kepadanya kemarin."],["B1","2059","لَوْ عَلِمْتُ بِالْخَبَرِ لَأَخْبَرْتُكَ.","Seandainya saya tahu kabarnya, saya pasti memberitahumu."],["B1","2061","لَوْلَا الزِّحَامُ لَوَصَلْنَا مُبَكِّرًا.","Seandainya tidak macet, kita pasti tiba lebih awal."],["B1","2064","لَيْتَ الْمَطَرَ يَتَوَقَّفُ قَبْلَ رَحِيلِنَا.","Semoga hujan berhenti sebelum kita berangkat."],["B1","2065","مَاذَا تَفْعَلُ لَوْ رَبِحْتَ جَائِزَةً كَبِيرَةً؟","Apa yang akan kamu lakukan seandainya memenangkan hadiah besar?"],["B1","2066","لَوْ تَرَكْتُ الْعَمَلَ لَفَقَدْتُ دَخْلِي.","Seandainya saya berhenti bekerja, saya akan kehilangan penghasilan."],["B1","2067","أَشْعُرُ بِالنَّدَمِ لِأَنِّي لَمْ أَزُرْ جَدِّي كَثِيرًا.","Saya menyesal karena tidak sering mengunjungi kakek."],["B1","2068","إِنْ نَجَحْتَ فِي الْمُقَابَلَةِ فَسَتَبْدَأُ الْعَمَلَ فِي الشَّهْرِ الْقَادِمِ.","Jika kamu berhasil dalam wawancara, kamu akan mulai bekerja bulan depan."],["B1","2069","لَوْ أُتِيحَتْ لِيَ الْفُرْصَةُ لَدَرَسْتُ فِي الْخَارِجِ.","Seandainya ada kesempatan, saya akan belajar di luar negeri."],["B1","2071","الْوَقْتُ مِنْ ذَهَبٍ.","Waktu adalah emas."],["B1","2072","الْعِلْمُ فِي الصِّغَرِ كَالنَّقْشِ عَلَى الْحَجَرِ.","Belajar di waktu kecil bagaikan mengukir di atas batu."],["B1","2073","الصَّبْرُ مِفْتَاحُ الْفَرَجِ.","Kesabaran adalah kunci jalan keluar."],["B1","2074","الْجَارُ قَبْلَ الدَّارِ.","Pilih tetangga dulu sebelum memilih rumah."],["B1","2075","مَنْ جَدَّ وَجَدَ.","Siapa bersungguh-sungguh, dia akan berhasil."],["B1","2076","الْوِقَايَةُ خَيْرٌ مِنَ الْعِلَاجِ.","Mencegah lebih baik daripada mengobati."],["B1","2077","الطُّيُورُ عَلَى أَشْكَالِهَا تَقَعُ.","Burung-burung berkumpul dengan sejenisnya."],["B1","2078","لَيْسَ كُلُّ مَا يَلْمَعُ ذَهَبًا.","Tidak semua yang berkilau itu emas."],["B1","2079","رُبَّ أَخٍ لَمْ تَلِدْهُ أُمُّكَ.","Boleh jadi ada saudara yang tidak dilahirkan oleh ibumu."],["B1","2080","الْعَجَلَةُ مِنَ الشَّيْطَانِ وَالتَّأَنِّي مِنَ الرَّحْمَنِ.","Tergesa-gesa itu dari setan, sedangkan hati-hati dari Yang Maha Pengasih."],["B1","2081","مَا كُلُّ مَا يَتَمَنَّى الْمَرْءُ يُدْرِكُهُ.","Tidak semua yang diinginkan seseorang pasti tercapai."],["B1","2082","يَدٌ وَاحِدَةٌ لَا تُصَفِّقُ.","Satu tangan tidak bisa bertepuk."],["B1","2083","خَيْرُ الْكَلَامِ مَا قَلَّ وَدَلَّ.","Sebaik-baik ucapan adalah yang singkat dan bermakna."],["B1","2084","هُوَ يَضْرِبُ عُصْفُورَيْنِ بِحَجَرٍ وَاحِدٍ.","Dia sekali mendayung dua tiga pulau terlampaui."],["B1","2085","لَا تَضَعْ بَيْضَكَ كُلَّهُ فِي سَلَّةٍ وَاحِدَةٍ.","Jangan menaruh semua telurmu dalam satu keranjang."],["B1","2086","بَعْدَ الْعُسْرِ يُسْرٌ.","Setelah kesulitan ada kemudahan."],["B1","2087","لَقَدْ كَسَرَ الْجَلِيدَ بَيْنَنَا بِنُكْتَةٍ لَطِيفَةٍ.","Dia mencairkan suasana di antara kami dengan lelucon yang menyenangkan."],["B1","2088","مَنْ سَارَ عَلَى الدَّرْبِ وَصَلَ.","Siapa berjalan di jalannya, dia akan sampai."],["B1","2090","أُرِيدُ أَنْ أُبَلِّغَ عَنْ ضَيَاعِ جَوَازِ سَفَرِي.","Saya ingin melaporkan paspor saya hilang."],["B1","2091","أُلْغِيَتْ رِحْلَتِي بِسَبَبِ الْعَاصِفَةِ.","Penerbangan saya dibatalkan karena badai."],["B1","2092","فَاتَتْنِي الطَّائِرَةُ بِسَبَبِ الزِّحَامِ.","Saya ketinggalan pesawat karena kemacetan."],["B1","2093","هَلْ يُغَطِّي التَّأْمِينُ الْعِلَاجَ فِي الْخَارِجِ؟","Apakah asuransi menanggung pengobatan di luar negeri?"],["B1","2094","تَعَطَّلَتْ سَيَّارَتِي عَلَى الطَّرِيقِ السَّرِيعِ.","Mobil saya mogok di jalan tol."],["B1","2095","اتَّصِلْ بِالشُّرْطَةِ إِذَا حَدَثَ شَيْءٌ.","Hubungi polisi jika terjadi sesuatu."],["B1","2096","هُنَاكَ حَرِيقٌ فِي الطَّابِقِ الثَّانِي!","Ada kebakaran di lantai dua!"],["B1","2097","أَحْتَاجُ إِلَى سَيَّارَةِ إِسْعَافٍ حَالًا.","Saya butuh ambulans sekarang juga."],["B1","2098","ضَاعَتْ مِنِّي مَحْفَظَتِي وَفِيهَا بِطَاقَاتِي.","Dompet saya hilang dan kartu-kartu saya ada di dalamnya."],["B1","2099","أَيْنَ أَقْرَبُ سِفَارَةٍ لِبَلَدِي؟","Di mana kedutaan terdekat untuk negara saya?"],["B1","2100","تَأَخَّرَ الْقِطَارُ سَاعَتَيْنِ بِسَبَبِ عُطْلٍ فَنِّيٍّ.","Kereta terlambat dua jam karena gangguan teknis."],["B1","2101","لَمْ أَحْجِزْ فُنْدُقًا وَالْمَدِينَةُ مُزْدَحِمَةٌ.","Saya belum memesan hotel dan kota ini ramai sekali."],["B1","2102","أَنَا ضَائِعٌ، هَلْ تَدُلُّنِي عَلَى الطَّرِيقِ؟","Saya tersesat, bisakah kamu menunjukkan jalannya?"],["B1","2103","انْتَهَتْ صَلَاحِيَّةُ التَّأْشِيرَةِ الْأُسْبُوعَ الْمَاضِيَ.","Masa berlaku visa telah habis minggu lalu."],["B1","2104","هُنَاكَ تَحْذِيرٌ مِنْ فَيَضَانٍ فِي الْمِنْطَقَةِ.","Ada peringatan banjir di daerah ini."],["B1","2106","هَلْ تَعْرِفُ أَقْرَبَ مُسْتَشْفًى مِنْ هُنَا؟","Tahukah kamu rumah sakit terdekat dari sini?"],["B1","2108","هَلْ يُمْكِنُ تَأْجِيلُ الْمَوْعِدِ إِلَى يَوْمِ الْخَمِيسِ؟","Apakah janji bisa ditunda ke hari Kamis?"],["B1","2109","أَحْتَاجُ إِلَى وَصْفَةٍ طِبِّيَّةٍ لِهَذَا الدَّوَاءِ.","Saya butuh resep dokter untuk obat ini."],["B1","2111","عِنْدِي حَسَاسِيَّةٌ مِنْ بَعْضِ الْأَدْوِيَةِ.","Saya alergi terhadap beberapa obat."],["B1","2112","يَجِبُ أَنْ تُجْرِيَ تَحْلِيلَ دَمٍ قَبْلَ الْعِلَاجِ.","Kamu harus melakukan tes darah sebelum pengobatan."],["B1","2113","تَظْهَرُ النَّتَائِجُ بَعْدَ يَوْمَيْنِ.","Hasilnya keluar setelah dua hari."],["B1","2114","أُحِسُّ بِأَلَمٍ فِي ظَهْرِي مُنْذُ أُسْبُوعٍ.","Punggung saya terasa sakit sejak seminggu."],["B1","2115","هَلْ تَقْبَلُونَ التَّأْمِينَ الصِّحِّيَّ؟","Apakah Anda menerima asuransi kesehatan?"],["B1","2116","الرَّجَاءُ مِلْءُ هَذِهِ الِاسْتِمَارَةِ أَوَّلًا.","Mohon isi formulir ini terlebih dahulu."],["B1","2118","هَلْ يَلْزَمُنِي صِيَامٌ قَبْلَ التَّحْلِيلِ؟","Apakah saya perlu berpuasa sebelum tes?"],["B1","2120","الصَّيْدَلِيَّةُ تُغْلِقُ أَبْوَابَهَا عِنْدَ التَّاسِعَةِ.","Apotek tutup pukul sembilan."],["B1","2121","أَحْتَاجُ إِلَى شَهَادَةٍ طِبِّيَّةٍ لِلْعَمَلِ.","Saya butuh surat keterangan dokter untuk kantor."],["B1","2122","اتَّبِعْ هَذَا النِّظَامَ الْغِذَائِيَّ لِمُدَّةِ شَهْرٍ.","Ikuti pola makan ini selama sebulan."],["B1","2123","هَلْ يَحْتَاجُ الْأَمْرُ إِلَى عَمَلِيَّةٍ جِرَاحِيَّةٍ؟","Apakah perlu operasi?"],["B1","2124","شُكْرًا يَا دُكْتُورُ، أَشْعُرُ بِتَحَسُّنٍ كَبِيرٍ.","Terima kasih, Dokter, saya merasa jauh lebih baik."],["B1","2125","جَارُنَا الْجَدِيدُ يَبْدُو رَجُلًا لَطِيفًا.","Tetangga baru kita tampaknya orang yang ramah."],["B1","2126","مِنْ فَضْلِكَ، لَا تَتْرُكْ سَيَّارَتَكَ أَمَامَ مَدْخَلِنَا.","Tolong jangan parkir mobilmu di depan pintu masuk kami."],["B1","2127","أَصْوَاتُ الْمُوسِيقَى مُرْتَفِعَةٌ جِدًّا بَعْدَ مُنْتَصَفِ اللَّيْلِ.","Suara musik terlalu keras setelah tengah malam."],["B1","2129","اجْتَمَعَ سُكَّانُ الْحَيِّ لِتَنْظِيفِ الشَّارِعِ.","Warga lingkungan berkumpul untuk membersihkan jalan."],["B1","2130","هَلْ تَسْمَحُ لِي بِاسْتِعَارَةِ سُلَّمِكَ؟","Bolehkah saya meminjam tangga milikmu?"],["B1","2131","الْمَتْجَرُ الْقَرِيبُ يَفْتَحُ حَتَّى مُنْتَصَفِ اللَّيْلِ.","Toko di dekat sini buka sampai tengah malam."],["B1","2132","سَاعَدَنِي جَارِي فِي حَمْلِ الْأَكْيَاسِ إِلَى الْمَنْزِلِ.","Tetangga saya membantu membawa kantong belanja ke rumah."],["B1","2133","نَحْنُ نَتَنَاوَبُ عَلَى سَقْيِ نَبَاتَاتِ بَعْضِنَا.","Kami bergantian menyiram tanaman satu sama lain."],["B1","2135","لَقَدْ أَقَمْنَا حَفْلًا صَغِيرًا لِلْجِيرَانِ.","Kami mengadakan pesta kecil untuk para tetangga."],["B1","2136","يَرْمِي بَعْضُهُمُ النُّفَايَاتِ فِي مَكَانٍ غَيْرِ مُنَاسِبٍ.","Sebagian orang membuang sampah di tempat yang tidak semestinya."],["B1","2137","تَعَرَّفْتُ عَلَى جِيرَانِي فِي أَوَّلِ أُسْبُوعٍ.","Saya berkenalan dengan tetangga-tetangga saya di minggu pertama."],["B1","2139","هَلْ عِنْدَكُمْ مَشْكِلَةٌ فِي الْمِيَاهِ فِي الْحَيِّ؟","Apakah ada masalah air di lingkungan Anda?"],["B1","2140","سَنَعْقِدُ اجْتِمَاعًا لِلسُّكَّانِ يَوْمَ السَّبْتِ.","Kami akan mengadakan rapat warga hari Sabtu."],["B1","2141","كُلُّ شَيْءٍ نَحْتَاجُهُ مَوْجُودٌ فِي هَذَا الْحَيِّ.","Semua yang kita butuhkan ada di lingkungan ini."],["B1","2142","نَسِينَا الْمَفَاتِيحَ فِي الدَّاخِلِ وَجَارُنَا عِنْدَهُ نُسْخَةٌ.","Kami meninggalkan kunci di dalam dan tetangga kami punya salinannya."],["B1","2143","يَجِبُ أَنْ نُوَفِّرَ الْمَاءَ فِي الصَّيْفِ.","Kita harus menghemat air di musim panas."],["B1","2144","أَطْفِئِ الْأَنْوَارَ عِنْدَمَا تَخْرُجُ مِنَ الْغُرْفَةِ.","Matikan lampu ketika kamu keluar dari ruangan."],["B1","2145","نَفْصِلُ النُّفَايَاتِ إِلَى وَرَقٍ وَبُلَاسْتِيكٍ وَزُجَاجٍ.","Kami memilah sampah menjadi kertas, plastik, dan kaca."],["B1","2146","لِمَاذَا ارْتَفَعَتْ دَرَجَاتُ الْحَرَارَةِ هَذِهِ السَّنَةَ؟","Mengapa suhu naik tahun ini?"],["B1","2147","أَسْتَخْدِمُ الدَّرَّاجَةَ بَدَلًا مِنَ السَّيَّارَةِ.","Saya memakai sepeda sebagai ganti mobil."],["B1","2148","تُنْتِجُ بَعْضُ الدُّوَلِ كَهْرَبَاءَ مِنَ الشَّمْسِ وَالرِّيَاحِ.","Beberapa negara menghasilkan listrik dari matahari dan angin."],["B1","2149","الْهَوَاءُ فِي الْمَدِينَةِ مُلَوَّثٌ بِدُخَانِ السَّيَّارَاتِ.","Udara di kota tercemar asap kendaraan."],["B1","2150","لَا تَرْمِ الْقُمَامَةَ فِي الْبَحْرِ.","Jangan membuang sampah ke laut."],["B1","2151","أَحْمِلُ كِيسًا قُمَاشِيًّا عِنْدَ التَّسَوُّقِ.","Saya membawa kantong kain saat berbelanja."],["B1","2152","زَرَعْنَا عِشْرِينَ شَجَرَةً فِي سَاحَةِ الْمَدْرَسَةِ.","Kami menanam dua puluh pohon di halaman sekolah."],["B1","2153","الْمَوَارِدُ الطَّبِيعِيَّةُ لَيْسَتْ بِلَا نِهَايَةٍ.","Sumber daya alam tidak tak terbatas."],["B1","2154","نَشَرَتِ الْبَلَدِيَّةُ جَدْوَلًا لِجَمْعِ الْقُمَامَةِ.","Pemerintah kota menerbitkan jadwal pengangkutan sampah."],["B1","2155","أُفَضِّلُ الْمُنْتَجَاتِ الَّتِي يُمْكِنُ إِعَادَةُ اسْتِخْدَامِهَا.","Saya lebih suka produk yang bisa dipakai ulang."],["B1","2156","جَفَّ النَّهْرُ بَعْدَ شَهْرَيْنِ بِلَا مَطَرٍ.","Sungai mengering setelah dua bulan tanpa hujan."],["B1","2157","أُشَارِكُ فِي حَمْلَةِ تَنْظِيفِ الشَّاطِئِ.","Saya ikut dalam kampanye membersihkan pantai."],["B1","2158","يَجِبُ عَلَى الْمَصَانِعِ أَنْ تُعَالِجَ مِيَاهَهَا.","Pabrik-pabrik harus mengolah limbah airnya."],["B1","2159","الطَّقْسُ أَصْبَحَ غَيْرَ مُسْتَقِرٍّ فِي السَّنَوَاتِ الْأَخِيرَةِ.","Cuaca menjadi tidak menentu dalam beberapa tahun terakhir."],["B1","2160","كُلُّنَا مَسْؤُولُونَ عَنْ حِمَايَةِ كَوْكَبِنَا.","Kita semua bertanggung jawab melindungi planet kita."],["B1","2161","نَحْتَاجُ إِلَى تَوْزِيعِ الْمَهَامِ بَيْنَ أَعْضَاءِ الْفَرِيقِ.","Kita perlu membagi tugas di antara anggota tim."],["B1","2162","أَنْهَيْنَا نِصْفَ الْمَشْرُوعِ فِي الْمَوْعِدِ.","Kami menyelesaikan separuh proyek tepat waktu."],["B1","2163","أَرْجُو تَسْلِيمَ التَّقْرِيرِ قَبْلَ نِهَايَةِ الْأُسْبُوعِ.","Mohon serahkan laporan sebelum akhir pekan."],["B1","2165","مَنْ مَسْؤُولٌ عَنْ هَذَا الْقِسْمِ؟","Siapa yang bertanggung jawab atas bagian ini?"],["B1","2166","لَدَيْنَا مُشْكِلَةٌ فِي التَّوَاصُلِ دَاخِلَ الْفَرِيقِ.","Kami punya masalah komunikasi di dalam tim."],["B1","2167","يَنْبَغِي أَنْ نَضَعَ جَدْوَلًا زَمَنِيًّا وَاضِحًا لِلْمَشْرُوعِ.","Kita harus menyepakati jadwal waktu yang jelas."],["B1","2168","أَشْكُرُ كُلَّ مَنْ سَاهَمَ فِي هَذَا النَّجَاحِ.","Saya berterima kasih kepada semua yang berkontribusi dalam keberhasilan ini."],["B1","2169","تَغَيَّبَ أَحَدُ الْأَعْضَاءِ عَنِ الِاجْتِمَاعِ.","Salah satu anggota tidak hadir dalam rapat."],["B1","2170","هَلْ يُمْكِنُنَا تَقْسِيمُ الْعَمَلِ بِشَكْلٍ عَادِلٍ؟","Bisakah kita membagi pekerjaan secara adil?"],["B1","2171","الِاتِّصَالُ الْمُبَاشِرُ أَسْرَعُ مِنَ الرَّسَائِلِ الطَّوِيلَةِ.","Berkomunikasi langsung lebih cepat daripada pesan panjang."],["B1","2172","تَأَخَّرْنَا عَنِ الْمَوْعِدِ النِّهَائِيِّ بِيَوْمَيْنِ.","Kami terlambat dua hari dari tenggat akhir."],["B1","2173","يَتَعَلَّمُ الْمُوَظَّفُونَ الْجُدُدُ مِنَ الزُّمَلَاءِ الْقُدَامَى.","Karyawan baru belajar dari rekan-rekan lama."],["B1","2174","أُرِيدُ تَقْيِيمًا صَادِقًا لِأَدَائِي.","Saya ingin penilaian yang jujur atas kinerja saya."],["B1","2175","مَنْ يَعْمَلْ بِجِدٍّ يَحْصُلْ عَلَى تَرْقِيَةٍ.","Siapa bekerja keras akan mendapat kenaikan jabatan."],["B1","2176","نُقَدِّمُ خِدْمَةً أَفْضَلَ حِينَ نَعْمَلُ مَعًا.","Kita memberi layanan lebih baik saat bekerja bersama."],["B1","2177","رَاجِعْ مُلَاحَظَاتِ الْعَمِيلِ قَبْلَ الْإِرْسَالِ.","Periksa catatan klien sebelum mengirim."],["B1","2178","أَحْتَاجُ إِلَى مُسَاعَدَةِ زَمِيلِي فِي هَذِهِ الْمَهَمَّةِ.","Saya butuh bantuan rekan kerja saya dalam tugas ini."],["B1","2179","أُحَاوِلُ أَنْ أَدَّخِرَ جُزْءًا مِنْ رَاتِبِي كُلَّ شَهْرٍ.","Saya berusaha menabung sebagian gaji setiap bulan."],["B1","2181","هَلْ يُمْكِنُنِي تَحْوِيلُ مَبْلَغٍ إِلَى حِسَابِ أَخِي؟","Bisakah saya mentransfer sejumlah uang ke rekening kakak saya?"],["B1","2182","نِسْبَةُ الْفَائِدَةِ عَلَى هَذَا الْقَرْضِ مُرْتَفِعَةٌ.","Suku bunga pinjaman ini tinggi."],["B1","2183","أَنْفَقْتُ أَكْثَرَ مِمَّا خَطَّطْتُ هَذَا الشَّهْرَ.","Bulan ini saya mengeluarkan lebih banyak daripada yang saya rencanakan."],["B1","2185","بِكَمْ تَبِيعُونَ الدُّولَارَ الْيَوْمَ؟","Berapa Anda menjual dolar hari ini?"],["B1","2186","هَلْ تَقْبَلُونَ الدَّفْعَ بِالْبِطَاقَةِ؟","Apakah Anda menerima pembayaran dengan kartu?"],["B1","2187","وَصَلَتْنِي فَاتُورَةٌ أَعْلَى مِنَ الْمُعْتَادِ.","Tagihan yang sampai kepada saya lebih tinggi dari biasanya."],["B1","2188","أَدْفَعُ الْقِسْطَ الشَّهْرِيَّ فِي أَوَّلِ كُلِّ شَهْرٍ.","Saya membayar cicilan bulanan di awal setiap bulan."],["B1","2189","مِنَ الْحِكْمَةِ أَنْ نُخَصِّصَ مَبْلَغًا لِلطَّوَارِئِ.","Adalah bijak jika kita menyisihkan dana untuk keadaan darurat."],["B1","2191","أَرْغَبُ فِي شِرَاءِ سَيَّارَةٍ مُسْتَعْمَلَةٍ.","Saya ingin membeli mobil bekas."],["B1","2192","هَلْ تُرِيدُ إِيصَالًا بِالْمَبْلَغِ؟","Apakah Anda ingin kuitansi pembayaran?"],["B1","2193","خُصِمَ مِنْ حِسَابِي مَبْلَغٌ لَا أَعْرِفُهُ.","Ada sejumlah uang terpotong dari rekening saya yang tidak saya ketahui."],["B1","2194","أُفَضِّلُ الِادِّخَارَ عَلَى شِرَاءِ أَشْيَاءَ غَيْرِ ضَرُورِيَّةٍ.","Saya lebih suka menabung daripada membeli barang yang tidak perlu."],["B1","2195","هَلْ تُفَضِّلُ الدَّفْعَ دُفْعَةً وَاحِدَةً أَمْ بِالتَّقْسِيطِ؟","Apakah kamu lebih suka membayar sekaligus atau dicicil?"],["B1","2196","لَا تُقْرِضْ مَالَكَ لِأَحَدٍ إِلَّا إِذَا كُنْتَ قَادِرًا عَلَى خَسَارَتِهِ.","Jangan meminjamkan uangmu kepada siapa pun kecuali kamu siap kehilangannya."],["B1","2197","كُلُّ عَامٍ وَأَنْتُمْ بِخَيْرٍ، عِيدٌ مُبَارَكٌ!","Selamat Hari Raya, semoga kalian selalu sehat dan bahagia!"],["B1","2199","يَلْبَسُ الْأَطْفَالُ ثِيَابًا جَدِيدَةً فِي الْعِيدِ.","Anak-anak memakai baju baru saat hari raya."],["B1","2200","نُحَضِّرُ الْحَلْوَى وَالْكَعْكَ قَبْلَ الْعِيدِ بِأَيَّامٍ.","Kami menyiapkan manisan dan kue beberapa hari sebelum hari raya."],["B1","2201","فِي رَمَضَانَ نُفْطِرُ مَعًا عِنْدَ الْغُرُوبِ.","Di bulan Ramadan kami berbuka bersama saat matahari terbenam."],["B1","2202","تُقَامُ الْأَعْرَاسُ هُنَا بِأَجْوَاءٍ احْتِفَالِيَّةٍ كَبِيرَةٍ.","Pernikahan di sini diselenggarakan dengan suasana perayaan yang meriah."],["B1","2203","قَدَّمْنَا لِلضُّيُوفِ الْقَهْوَةَ وَالتَّمْرَ.","Kami menyuguhkan kopi dan kurma kepada para tamu."],["B1","2204","فِي بَلَدِنَا نَحْتَفِلُ بِالْعِيدِ الْوَطَنِيِّ كُلَّ سَنَةٍ.","Di negara kami, kami merayakan hari nasional setiap tahun."],["B1","2205","أَحْتَرِمُ تَقَالِيدَ الْآخَرِينَ حِينَ أَزُورُ بَلَدًا جَدِيدًا.","Saya menghormati tradisi orang lain ketika mengunjungi negara baru."],["B1","2206","مِنَ الْعَادَةِ أَنْ نَخْلَعَ الْحِذَاءَ قَبْلَ دُخُولِ الْبَيْتِ.","Sudah menjadi kebiasaan melepas sepatu sebelum masuk rumah."],["B1","2207","يُهْدِي النَّاسُ بَعْضُهُمْ بَعْضًا فِي الْمُنَاسَبَاتِ.","Orang-orang saling memberi hadiah pada acara-acara tertentu."],["B1","2208","نَقُولُ «مَبْرُوكٌ» عِنْدَمَا يَنْجَحُ أَحَدٌ أَوْ يَتَزَوَّجُ.","Kami mengucapkan \"mabruk\" ketika seseorang lulus atau menikah."],["B1","2209","نَقُولُ لِلْمَرِيضِ: «سَلَامَتُكَ» أَوْ «شِفَاكَ اللَّهُ».","Kepada orang sakit kami mengucapkan \"semoga lekas sembuh\"."],["B1","2210","يَتَبَادَلُ النَّاسُ الزِّيَارَاتِ فِي أَيَّامِ الْعِيدِ.","Orang-orang saling berkunjung pada hari-hari raya."],["B1","2211","أَقَمْنَا وَلِيمَةً كَبِيرَةً بِمُنَاسَبَةِ تَخَرُّجِ أَخِي.","Kami mengadakan jamuan besar untuk merayakan kelulusan kakak saya."],["B1","2212","فِي بَعْضِ الْبُلْدَانِ يُحْتَفَلُ بِالْمَوْلِدِ النَّبَوِيِّ.","Di beberapa negara diperingati Maulid Nabi."],["B1","2213","هَذَا الطَّبَقُ التَّقْلِيدِيُّ يُحَضَّرُ فِي الْمُنَاسَبَاتِ فَقَطْ.","Hidangan tradisional ini hanya dibuat pada acara-acara tertentu."],["B1","2214","الْعِيدُ فَرْصَةٌ لِلصُّلْحِ وَنِسْيَانِ الْخِلَافَاتِ.","Hari raya adalah kesempatan berdamai dan melupakan perselisihan."],["B1","2215","فِي الْغَابَةِ حَيَوَانَاتٌ كَثِيرَةٌ لَا نَرَاهَا فِي الْمَدِينَةِ.","Di hutan ada banyak hewan yang tidak kita lihat di kota."],["B1","2216","عِنْدِي قِطَّةٌ صَغِيرَةٌ تَنَامُ بِجَانِبِي.","Saya punya kucing kecil yang tidur di sampingku."],["B1","2217","الْكَلْبُ مِنْ أَوْفَى الْحَيَوَانَاتِ لِصَاحِبِهِ.","Anjing termasuk hewan yang paling setia kepada pemiliknya."],["B1","2218","تُهَاجِرُ الطُّيُورُ جَنُوبًا فِي الشِّتَاءِ.","Burung-burung bermigrasi ke selatan pada musim dingin."],["B1","2219","نَسْتَطِيعُ رُؤْيَةَ الدَّلَافِينِ مِنْ هَذَا الشَّاطِئِ.","Kita bisa melihat lumba-lumba dari pantai ini."],["B1","2220","تَسَلَّقْنَا الْجَبَلَ وَوَصَلْنَا إِلَى الْقِمَّةِ عِنْدَ الظُّهْرِ.","Kami mendaki gunung dan tiba di puncak saat tengah hari."],["B1","2221","الْمَنْظَرُ مِنْ هُنَاكَ يَأْخُذُ الْأَنْفَاسَ.","Pemandangan dari sana membuat napas tertahan."],["B1","2222","اِتْرُكِ الْحَيَوَانَاتِ فِي مَوْطِنِهَا وَلَا تُزْعِجْهَا.","Biarkan hewan-hewan di habitatnya dan jangan mengganggunya."],["B1","2223","نَامَتِ الدِّبَبَةُ طَوَالَ الشِّتَاءِ.","Beruang-beruang tidur sepanjang musim dingin."],["B1","2224","الْغَابَاتُ الْمَطِيرَةُ تَحْتَوِي عَلَى أَنْوَاعٍ نَادِرَةٍ مِنَ النَّبَاتَاتِ.","Hutan hujan mengandung jenis tumbuhan yang langka."],["B1","2225","نَنْصِبُ الْخَيْمَةَ قُرْبَ الْبُحَيْرَةِ.","Kami mendirikan tenda di dekat danau."],["B1","2226","سَمِعْنَا صَوْتَ الْمَاءِ يَنْزِلُ مِنْ شَلَّالٍ قَرِيبٍ.","Kami mendengar suara air jatuh dari air terjun di dekat sini."],["B1","2227","النَّحْلُ مُهِمٌّ لِلنَّبَاتَاتِ وَالْمَحَاصِيلِ.","Lebah penting bagi tumbuhan dan hasil panen."],["B1","2228","لَا نَقْطِفُ الزُّهُورَ مِنَ الْحَدِيقَةِ الْعَامَّةِ.","Kita tidak memetik bunga dari taman umum."],["B1","2229","الطَّبِيعَةُ تُعَلِّمُنَا الصَّبْرَ وَالْهُدُوءَ.","Alam mengajari kita kesabaran dan ketenangan."],["B1","2230","تُوجَدُ فِي هَذِهِ الْمَحْمِيَّةِ أَنْوَاعٌ مُهَدَّدَةٌ بِالِانْقِرَاضِ.","Di cagar alam ini terdapat jenis-jenis yang terancam punah."],["B1","2231","تَعِيشُ الْأَسْمَاكُ الْمُلَوَّنَةُ بَيْنَ الشِّعَابِ الْمَرْجَانِيَّةِ.","Ikan-ikan berwarna hidup di antara terumbu karang."],["B1","2232","تُحِبُّ الْقِطَطُ أَنْ تَنَامَ فِي أَمَاكِنَ دَافِئَةٍ.","Kucing suka tidur di tempat yang hangat."],["B1","2233","أَتَطَوَّعُ فِي دَارِ رِعَايَةِ الْمُسِنِّينَ كُلَّ سَبْتٍ.","Saya menjadi sukarelawan di panti jompo setiap Sabtu."],["B1","2234","نُوَزِّعُ الطَّعَامَ عَلَى الْمُحْتَاجِينَ فِي رَمَضَانَ.","Kami membagikan makanan kepada yang membutuhkan di bulan Ramadan."],["B1","2235","جَمَعَتِ الْجَمْعِيَّةُ تَبَرُّعَاتٍ لِضَحَايَا الزِّلْزَالِ.","Perkumpulan itu mengumpulkan donasi untuk korban gempa."],["B1","2236","التَّطَوُّعُ يُعَلِّمُنِي الْمَسْؤُولِيَّةَ وَالتَّعَاوُنَ.","Menjadi sukarelawan mengajari saya tanggung jawab dan kerja sama."],["B1","2237","نَحْتَاجُ إِلَى مُتَطَوِّعِينَ لِتَنْظِيمِ الْفِعَالِيَّةِ.","Kami membutuhkan sukarelawan untuk menyelenggarakan acara."],["B1","2238","أَعْطَيْتُ الْكُتُبَ الْقَدِيمَةَ لِلْمَكْتَبَةِ الْعَامَّةِ.","Saya memberikan buku-buku lama kepada perpustakaan umum."],["B1","2239","يُسَاعِدُ الْمُتَطَوِّعُونَ الطُّلَّابَ الْجُدُدَ عَلَى التَّكَيُّفِ.","Para sukarelawan membantu mahasiswa baru beradaptasi."],["B1","2240","هَلْ لَدَيْكَ وَقْتٌ فَارِغٌ تُخَصِّصُهُ لِلْعَمَلِ الْخَيْرِيِّ؟","Apakah kamu punya waktu luang untuk kegiatan amal?"],["B1","2241","بَنَى الْأَهَالِي مَدْرَسَةً صَغِيرَةً بِجُهُودِهِمُ الذَّاتِيَّةِ.","Warga membangun sekolah kecil dengan usaha mereka sendiri."],["B1","2242","نُنَظِّمُ يَوْمًا مَفْتُوحًا لِلتَّعْرِيفِ بِعَمَلِنَا.","Kami menyelenggarakan hari terbuka untuk memperkenalkan kegiatan kami."],["B1","2243","أَشْعُرُ بِالسَّعَادَةِ حِينَ أَسْتَطِيعُ مُسَاعَدَةَ غَيْرِي.","Saya merasa bahagia ketika bisa membantu orang lain."],["B1","2244","يَجِبُ أَنْ نَهْتَمَّ بِجِيرَانِنَا الْمُسِنِّينَ وَنَزُورَهُمْ.","Kita harus peduli kepada tetangga lansia dan mengunjungi mereka."],["B1","2245","تَطَوَّعْتُ لِتَعْلِيمِ الْقِرَاءَةِ لِلْكِبَارِ.","Saya menjadi sukarelawan untuk mengajar membaca kepada orang dewasa."],["B1","2246","لَا يَقْتَصِرُ الْعَطَاءُ عَلَى الْمَالِ، فَالْوَقْتُ هَدِيَّةٌ أَيْضًا.","Memberi tidak terbatas pada uang, waktu juga merupakan hadiah."],["B1","2247","شُكْرًا لِكُلِّ مَنْ سَاعَدَ وَتَبَرَّعَ.","Terima kasih kepada semua yang membantu dan menyumbang."],["B1","2248","هَلْ تَعْرِفُ جَمْعِيَّةً تَحْتَاجُ إِلَى مُتَطَوِّعِينَ؟","Apakah kamu tahu perkumpulan yang membutuhkan sukarelawan?"],["B1","2249","سَاهَمَ الشَّبَابُ فِي تَرْمِيمِ الْمَسْجِدِ الْقَدِيمِ.","Para pemuda berkontribusi dalam merenovasi masjid tua."],["B1","2250","أُحِبُّ أَنْ أَرَى الْمُجْتَمَعَ يَتَعَاوَنُ فِي الْأَزَمَاتِ.","Saya suka melihat masyarakat saling membantu di masa krisis."],["B2","2251","أَرَى أَنَّ التَّعْلِيمَ الْمَجَّانِيَّ حَقٌّ لِكُلِّ مُوَاطِنٍ، وَذَلِكَ لِأَنَّهُ أَسَاسُ التَّنْمِيَةِ.","Menurut saya pendidikan gratis adalah hak setiap warga, karena ia dasar pembangunan."],["B2","2252","لَا أَنْكِرُ وُجُودَ مَشَاكِلَ، وَمَعَ ذَلِكَ أَعْتَقِدُ أَنَّ الْحَلَّ مُمْكِنٌ.","Saya tidak menyangkal adanya masalah, namun saya yakin solusinya mungkin."],["B2","2253","الْحُجَّةُ الْأَقْوَى فِي رَأْيِي هِيَ مَا تَدْعَمُهُ الْأَرْقَامُ.","Argumen yang paling kuat menurut saya adalah yang didukung oleh angka."],["B2","2254","إِذَا نَظَرْنَا إِلَى الْمَوْضُوعِ مِنْ زَاوِيَةٍ أُخْرَى فَسَنَجِدُ نَتِيجَةً مُخْتَلِفَةً.","Jika kita melihat masalahnya dari sudut lain, kita akan menemukan hasil yang berbeda."],["B2","2255","لَيْسَ كُلُّ مَنْ يُخَالِفُنَا الرَّأْيَ عَدُوًّا لَنَا.","Tidak semua orang yang berbeda pendapat dengan kita adalah musuh kita."],["B2","2256","يَبْدُو لِي أَنَّ هَذِهِ الْحُجَّةَ تَقُومُ عَلَى افْتِرَاضٍ خَاطِئٍ.","Menurut saya argumen ini bertumpu pada asumsi yang keliru."],["B2","2257","لَوْ كَانَ هَذَا صَحِيحًا لَظَهَرَتْ نَتَائِجُهُ فِي السِّنِينَ الْمَاضِيَةِ.","Seandainya ini benar, hasilnya sudah tampak pada tahun-tahun lalu."],["B2","2258","أُوَافِقُكَ فِي الْمَبْدَإِ، وَأَخْتَلِفُ مَعَكَ فِي التَّفَاصِيلِ.","Saya setuju denganmu dalam prinsip, tetapi berbeda pendapat dalam rinciannya."],["B2","2259","بِنَاءً عَلَى مَا سَبَقَ، يُمْكِنُنَا أَنْ نَسْتَنْتِجَ مَا يَلِي.","Berdasarkan apa yang telah disebutkan, kita dapat menyimpulkan hal berikut."],["B2","2260","لَا يَكْفِي أَنْ نَنْتَقِدَ، بَلْ يَجِبُ أَنْ نَقْتَرِحَ بَدَائِلَ.","Tidak cukup hanya mengkritik, tetapi kita harus mengusulkan alternatif."],["B2","2261","مِنَ الْمُؤَكَّدِ أَنَّ لِكُلِّ قَرَارٍ ثَمَنًا، وَالسُّؤَالُ هُوَ مَنْ يَدْفَعُهُ.","Yang pasti setiap keputusan ada harganya, dan pertanyaannya siapa yang membayarnya."],["B2","2262","لَا يُمْكِنُ تَعْمِيمُ حَالَةٍ وَاحِدَةٍ عَلَى الْمُجْتَمَعِ كُلِّهِ.","Satu kasus tidak bisa digeneralisasi untuk seluruh masyarakat."],["B2","2263","رَغْمَ أَهَمِّيَّةِ الْمَوْضُوعِ، فَإِنَّ النِّقَاشَ حَوْلَهُ مَحْدُودٌ.","Meskipun topiknya penting, pembahasan tentangnya terbatas."],["B2","2264","أُرِيدُ أَنْ أَسْمَعَ الْحُجَجَ الْمُضَادَّةَ قَبْلَ أَنْ أُكَوِّنَ رَأْيِي.","Saya ingin mendengar argumen tandingan sebelum membentuk pendapat."],["B2","2265","مَا تَقُولُهُ مَنْطِقِيٌّ، غَيْرَ أَنَّهُ لَا يُنَاسِبُ وَاقِعَنَا.","Apa yang kamu katakan logis, hanya saja tidak sesuai dengan kenyataan kita."],["B2","2266","يَنْبَغِي أَلَّا نَحْكُمَ عَلَى الْفِكْرَةِ قَبْلَ أَنْ نَفْهَمَهَا جَيِّدًا.","Kita sebaiknya tidak menilai suatu gagasan sebelum memahaminya dengan baik."],["B2","2267","لَقَدْ أَقْنَعَتْنِي حُجَّتُكَ، وَسَأُغَيِّرُ مَوْقِفِي.","Argumenmu telah meyakinkan saya, dan saya akan mengubah sikap saya."],["B2","2268","يَرَى كَثِيرُونَ أَنَّ الْعَمَلَ عَنْ بُعْدٍ يُحَسِّنُ جَوْدَةَ الْحَيَاةِ.","Banyak orang berpendapat bahwa bekerja jarak jauh meningkatkan kualitas hidup."],["B2","2269","مِنَ الْمُهِمِّ أَنْ نُعْطِيَ الشَّبَابَ فُرْصَةً لِلْمُشَارَكَةِ فِي الْقَرَارَاتِ.","Penting bagi kita memberi pemuda kesempatan ikut dalam pengambilan keputusan."],["B2","2270","تَتَزَايَدُ الْفَجْوَةُ بَيْنَ الْأَغْنِيَاءِ وَالْفُقَرَاءِ عَامًا بَعْدَ عَامٍ.","Kesenjangan antara kaya dan miskin semakin melebar dari tahun ke tahun."],["B2","2271","لَا أُؤْمِنُ بِأَنَّ الْمَالَ وَحْدَهُ يَصْنَعُ السَّعَادَةَ.","Saya tidak percaya bahwa uang saja menciptakan kebahagiaan."],["B2","2272","أَصْبَحَ الْوَالِدَانِ قَلِقَيْنِ مِنْ تَأْثِيرِ الشَّاشَاتِ عَلَى أَطْفَالِهِمَا.","Para orang tua menjadi cemas akan pengaruh layar terhadap anak-anak mereka."],["B2","2273","أَعْتَقِدُ أَنَّ احْتِرَامَ كِبَارِ السِّنِّ مِقْيَاسٌ لِرُقِيِّ الْمُجْتَمَعِ.","Saya yakin menghormati orang lanjut usia adalah ukuran kemajuan masyarakat."],["B2","2274","هَلْ تُؤَيِّدُ فَرْضَ ضَرِيبَةٍ عَلَى الْمَشْرُوبَاتِ السُّكَّرِيَّةِ؟","Apakah kamu mendukung pengenaan pajak atas minuman manis?"],["B2","2275","الْعَمَلُ التَّطَوُّعِيُّ لَا يُغْنِي عَنْ دَوْرِ الدَّوْلَةِ.","Kerja sukarela tidak menggantikan peran negara."],["B2","2276","يَتَغَيَّرُ مَفْهُومُ الْأُسْرَةِ مَعَ تَغَيُّرِ الْعَصْرِ.","Konsep keluarga berubah seiring perubahan zaman."],["B2","2277","مَنْ يَتَحَمَّلُ مَسْؤُولِيَّةَ تَرْبِيَةِ الطِّفْلِ: الْأُسْرَةُ أَمِ الْمَدْرَسَةُ؟","Siapa yang bertanggung jawab mendidik anak: keluarga atau sekolah?"],["B2","2278","مِنَ الظُّلْمِ أَنْ نَحْكُمَ عَلَى النَّاسِ مِنْ مَظْهَرِهِمْ فَقَطْ.","Merupakan ketidakadilan menilai orang hanya dari penampilannya."],["B2","2279","تُسَاهِمُ الْمَرْأَةُ فِي الِاقْتِصَادِ بِقَدْرِ مَا يُسَاهِمُ الرَّجُلُ.","Perempuan berkontribusi dalam ekonomi sebanyak laki-laki."],["B2","2280","أَظُنُّ أَنَّ الْإِعْلَانَاتِ تُؤَثِّرُ فِي قَرَارَاتِنَا أَكْثَرَ مِمَّا نَعْتَرِفُ.","Saya kira iklan memengaruhi keputusan kita lebih dari yang kita akui."],["B2","2281","يَجِبُ أَنْ تَكُونَ الْمُوَاصَلَاتُ الْعَامَّةُ أَرْخَصَ وَأَسْرَعَ.","Transportasi umum harus lebih murah dan lebih cepat."],["B2","2282","الْفَنُّ لَيْسَ تَرَفًا، بَلْ حَاجَةٌ إِنْسَانِيَّةٌ.","Seni bukanlah kemewahan, melainkan kebutuhan manusia."],["B2","2283","كُلَّمَا ازْدَادَ الْوَعْيُ قَلَّتِ الْمَشَاكِلُ الِاجْتِمَاعِيَّةُ.","Semakin tinggi kesadaran, semakin sedikit masalah sosial."],["B2","2284","لَا أُحِبُّ أَنْ يَفْرِضَ عَلَيَّ أَحَدٌ طَرِيقَةَ حَيَاتِي.","Saya tidak suka ada orang yang memaksakan cara hidup kepada saya."],["B2","2286","يَتَنَاوَلُ هَذَا الْعَرْضُ ثَلَاثَةَ مَحَاوِرَ رَئِيسِيَّةٍ.","Presentasi ini membahas tiga pokok utama."],["B2","2287","كَمَا يَظْهَرُ فِي الرَّسْمِ الْبَيَانِيِّ، ارْتَفَعَتِ الْمَبِيعَاتُ بِنِسْبَةٍ كَبِيرَةٍ.","Seperti tampak pada grafik, penjualan meningkat dengan persentase besar."],["B2","2288","أَخْشَى أَنَّ الْوَقْتَ لَا يَكْفِي لِمُنَاقَشَةِ كُلِّ الْبُنُودِ.","Saya khawatir waktunya tidak cukup untuk membahas semua butir."],["B2","2289","هَلْ لَدَى أَحَدٍ مُلَاحَظَةٌ أَوِ اعْتِرَاضٌ عَلَى هَذَا الْبَنْدِ؟","Adakah yang punya catatan atau keberatan atas butir ini?"],["B2","2290","سَنُرْسِلُ مَحْضَرَ الِاجْتِمَاعِ خِلَالَ أَرْبَعٍ وَعِشْرِينَ سَاعَةً.","Kami akan mengirim notulen rapat dalam dua puluh empat jam."],["B2","2291","أُرِيدُ أَنْ أُؤَكِّدَ أَنَّ الْمَوْعِدَ النِّهَائِيَّ لَا يَقْبَلُ التَّأْجِيلَ.","Saya ingin menegaskan bahwa tenggat akhir tidak bisa ditunda."],["B2","2292","مِنْ خِلَالِ هَذِهِ الدِّرَاسَةِ تَبَيَّنَ لَنَا أَنَّ السُّوقَ تَتَغَيَّرُ بِسُرْعَةٍ.","Melalui kajian ini jelas bagi kami bahwa pasar berubah dengan cepat."],["B2","2293","أَشْكُرُكُمْ عَلَى حُسْنِ الْإِصْغَاءِ، وَأَنَا مُسْتَعِدٌّ لِلْإِجَابَةِ عَنْ أَسْئِلَتِكُمْ.","Terima kasih atas perhatian Anda, dan saya siap menjawab pertanyaan Anda."],["B2","2294","أُعِيدُ صِيَاغَةَ سُؤَالِكَ لِلتَّأَكُّدِ مِنْ أَنِّي فَهِمْتُهُ.","Saya merumuskan ulang pertanyaanmu untuk memastikan saya memahaminya."],["B2","2295","لَمْ نَتَوَصَّلْ إِلَى اتِّفَاقٍ، لِذَا سَنُؤَجِّلُ التَّصْوِيتَ.","Kami belum mencapai kesepakatan, karena itu pemungutan suara kita tunda."],["B2","2296","يُرْجَى إِغْلَاقُ الْهَوَاتِفِ أَثْنَاءَ الِاجْتِمَاعِ.","Mohon matikan ponsel selama rapat."],["B2","2297","الْغَرَضُ مِنْ هَذَا الِاجْتِمَاعِ هُوَ تَقْيِيمُ مَا أُنْجِزَ حَتَّى الْآنَ.","Tujuan rapat ini adalah menilai apa yang telah dicapai sejauh ini."],["B2","2298","سَأَنْتَقِلُ الْآنَ إِلَى الشَّرِيحَةِ التَّالِيَةِ.","Saya sekarang beralih ke slide berikutnya."],["B2","2299","لِنُلَخِّصِ الْقَرَارَاتِ الَّتِي اتُّخِذَتْ فِي هَذَا الِاجْتِمَاعِ.","Mari kita ringkas keputusan yang diambil dalam rapat ini."],["B2","2300","نَحْنُ بِحَاجَةٍ إِلَى مَزِيدٍ مِنَ الشَّفَافِيَّةِ فِي إِدَارَةِ الْمَشْرُوعِ.","Kita membutuhkan lebih banyak transparansi dalam pengelolaan proyek."],["B2","2301","نَرْغَبُ فِي مُرَاجَعَةِ بُنُودِ الْعَقْدِ قَبْلَ التَّوْقِيعِ النِّهَائِيِّ.","Kami ingin meninjau butir-butir kontrak sebelum tanda tangan akhir."],["B2","2302","السِّعْرُ الَّذِي تَعْرِضُونَهُ أَعْلَى مِنْ مِيزَانِيَّتِنَا.","Harga yang Anda tawarkan lebih tinggi dari anggaran kami."],["B2","2303","مَا هِيَ شُرُوطُ الدَّفْعِ وَمَوَاعِيدُ التَّسْلِيمِ؟","Apa saja syarat pembayaran dan jadwal pengiriman?"],["B2","2304","لَا نَسْتَطِيعُ قَبُولَ هَذَا الشَّرْطِ بِصِيغَتِهِ الْحَالِيَّةِ.","Kami tidak bisa menerima syarat ini dalam rumusannya yang sekarang."],["B2","2305","نَحْنُ مُسْتَعِدُّونَ لِلتَّنَازُلِ عَنْ نُقْطَةٍ مُقَابِلَ نُقْطَةٍ أُخْرَى.","Kami bersedia mengalah pada satu poin dengan imbalan poin lain."],["B2","2306","يَجِبُ أَنْ يَنُصَّ الْعَقْدُ صَرَاحَةً عَلَى الْعُقُوبَاتِ عِنْدَ التَّأْخِيرِ.","Kontrak harus menyebutkan secara tegas sanksi jika terjadi keterlambatan."],["B2","2308","نُقَدِّرُ هَذِهِ الْمَرُونَةَ وَنَأْمُلُ فِي شَرَاكَةٍ طَوِيلَةِ الْأَمَدِ.","Kami menghargai fleksibilitas ini dan berharap kemitraan jangka panjang."],["B2","2309","إِذَا لَمْ تَلْتَزِمُوا بِالْمَوَاعِيدِ فَسَنُضْطَرُّ إِلَى فَسْخِ الْعَقْدِ.","Jika Anda tidak menaati jadwal, kami terpaksa membatalkan kontrak."],["B2","2310","هَلْ يُمْكِنُ إِدْرَاجُ ضَمَانٍ لِمُدَّةِ سَنَتَيْنِ؟","Bisakah dimasukkan garansi selama dua tahun?"],["B2","2311","الْمُفَاوَضَاتُ نَاجِحَةٌ حِينَ يَرْبَحُ الطَّرَفَانِ مَعًا.","Negosiasi berhasil ketika kedua belah pihak sama-sama untung."],["B2","2312","نُرِيدُ تَوْضِيحًا بِشَأْنِ الْمَسْؤُولِيَّةِ فِي حَالَةِ الْأَضْرَارِ.","Kami menginginkan penjelasan mengenai tanggung jawab bila terjadi kerusakan."],["B2","2313","لِنَتَّفِقْ عَلَى مُسَوَّدَةٍ أَوَّلِيَّةٍ ثُمَّ نَبْدَأُ بِالتَّعْدِيلَاتِ.","Mari kita sepakati draf awal lalu mulai dengan revisi."],["B2","2314","تُعَدُّ هَذِهِ الْفُرْصَةُ مُنَاسِبَةً لِكِلَا الطَّرَفَيْنِ.","Kesempatan ini dianggap cocok bagi kedua belah pihak."],["B2","2315","بَعْدَ الدِّرَاسَةِ وَالنِّقَاشِ، وَافَقْنَا عَلَى الصِّيغَةِ النِّهَائِيَّةِ.","Setelah dikaji dan dibahas, kami menyetujui rumusan akhir."],["B2","2316","إِنَّ الصَّبْرَ فِي الْمُفَاوَضَاتِ غَالِبًا مَا يُحَقِّقُ نَتَائِجَ أَفْضَلَ.","Kesabaran dalam negosiasi sering kali menghasilkan hasil yang lebih baik."],["B2","2317","نَحْتَاجُ إِلَى مُوَافَقَةٍ خَطِّيَّةٍ قَبْلَ أَنْ نَبْدَأَ التَّنْفِيذَ.","Kami membutuhkan persetujuan tertulis sebelum memulai pelaksanaan."],["B2","2318","لَا بُدَّ مِنَ الْإِشَارَةِ إِلَى أَنَّ الْأَسْعَارَ قَابِلَةٌ لِلتَّغْيِيرِ.","Perlu ditegaskan bahwa harga dapat berubah."],["B2","2319","لَمْ تَعُدِ الْأَخْبَارُ تَصِلُ إِلَيْنَا مِنَ الصُّحُفِ فَقَطْ، بَلْ مِنْ مَوَاقِعِ التَّوَاصُلِ أَيْضًا.","Berita tidak lagi sampai kepada kita hanya dari surat kabar, tetapi juga dari media sosial."],["B2","2320","يَجِبُ أَنْ نَتَأَكَّدَ مِنْ مَصْدَرِ الْخَبَرِ قَبْلَ أَنْ نُشَارِكَهُ.","Kita harus memastikan sumber berita sebelum membagikannya."],["B2","2321","تَسْتَهْدِفُ الْمِنَصَّاتُ مَا نُحِبُّ لِتُبْقِيَنَا أَطْوَلَ وَقْتٍ مُمْكِنٍ.","Platform menargetkan apa yang kita sukai agar kita bertahan selama mungkin."],["B2","2322","أُحَاوِلُ أَنْ أَقْرَأَ الْخَبَرَ مِنْ أَكْثَرِ مِنْ مَصْدَرٍ.","Saya berusaha membaca berita dari lebih dari satu sumber."],["B2","2323","تَأْثِيرُ الْمَشَاهِيرِ عَلَى الشَّبَابِ يَفُوقُ تَأْثِيرَ الْمُعَلِّمِينَ أَحْيَانًا.","Pengaruh selebritas pada anak muda terkadang melebihi pengaruh guru."],["B2","2324","حَذَفْتُ التَّطْبِيقَ مِنْ هَاتِفِي لِأَنِّي أَضَعْتُ وَقْتًا كَثِيرًا.","Saya menghapus aplikasi itu dari ponsel karena banyak waktu terbuang."],["B2","2325","لِلْإِعْلَامِ دَوْرٌ مُهِمٌّ فِي تَشْكِيلِ الرَّأْيِ الْعَامِّ.","Media punya peran penting dalam membentuk opini publik."],["B2","2326","الصُّورَةُ قَدْ تَكُونُ مُعَدَّلَةً، فَلَا تُصَدِّقْ كُلَّ مَا تَرَى.","Gambar bisa saja telah diedit, jadi jangan percaya semua yang kamu lihat."],["B2","2327","يَكْتُبُ بَعْضُهُمْ تَعْلِيقَاتٍ جَارِحَةً لِأَنَّهُمْ يَخْتَبِئُونَ خَلْفَ أَسْمَاءٍ مُسْتَعَارَةٍ.","Sebagian orang menulis komentar menyakitkan karena bersembunyi di balik nama samaran."],["B2","2328","أَصْبَحَ بِإِمْكَانِ أَيِّ شَخْصٍ أَنْ يَنْشُرَ رَأْيَهُ أَمَامَ الْمَلَايِينِ.","Kini siapa pun bisa menyebarkan pendapatnya di hadapan jutaan orang."],["B2","2329","لَمْ أَقْرَأِ الْجَرِيدَةَ الْوَرَقِيَّةَ مُنْذُ سَنَوَاتٍ.","Saya sudah bertahun-tahun tidak membaca koran cetak."],["B2","2330","هَلْ تَعْتَقِدُ أَنَّ الْإِنْتَرْنِتَ جَعَلَنَا أَقْرَبَ أَمْ أَبْعَدَ عَنْ بَعْضِنَا؟","Menurutmu, apakah internet membuat kita lebih dekat atau lebih jauh satu sama lain?"],["B2","2331","يَجِبُ حِمَايَةُ الْخُصُوصِيَّةِ عِنْدَ نَشْرِ صُوَرِ الْأَطْفَالِ.","Privasi harus dilindungi saat mengunggah foto anak-anak."],["B2","2332","تَصْنَعُ الْإِعْلَانَاتُ حَاجَاتٍ جَدِيدَةً لَمْ نَكُنْ نَشْعُرُ بِهَا.","Iklan menciptakan kebutuhan baru yang tadinya tidak kita rasakan."],["B2","2333","الْفَرْقُ بَيْنَ الْخَبَرِ وَالرَّأْيِ يَجِبُ أَنْ يَكُونَ وَاضِحًا لِلْقَارِئِ.","Perbedaan antara berita dan opini harus jelas bagi pembaca."],["B2","2334","تَابَعْتُ الْمُؤْتَمَرَ الصُّحُفِيَّ مُبَاشَرَةً عَلَى الْإِنْتَرْنِتِ.","Saya menyaksikan konferensi pers secara langsung di internet."],["B2","2335","نَشَرَتِ الصَّحِيفَةُ تَصْحِيحًا لِلْخَبَرِ الْخَاطِئِ.","Surat kabar menerbitkan koreksi atas berita yang keliru."],["B2","2336","يَتَطَلَّبُ سُوقُ الْعَمَلِ الْيَوْمَ مَهَارَاتٍ لَمْ تَكُنْ مَوْجُودَةً مِنْ قَبْلُ.","Pasar kerja saat ini membutuhkan keterampilan yang dulu belum ada."],["B2","2337","لَا يَكْفِي أَنْ نَحْفَظَ الْمَعْلُومَاتِ، بَلْ يَجِبُ أَنْ نَفْهَمَهَا وَنُطَبِّقَهَا.","Tidak cukup menghafal informasi, kita harus memahami dan menerapkannya."],["B2","2338","الدِّرَاسَةُ فِي الْخَارِجِ تُوَسِّعُ الْمَدَارِكَ وَتُعَلِّمُ الِاسْتِقْلَالَ.","Belajar di luar negeri memperluas wawasan dan mengajarkan kemandirian."],["B2","2339","أَرْغَبُ فِي إِكْمَالِ الدِّرَاسَاتِ الْعُلْيَا بَعْدَ التَّخَرُّجِ.","Saya ingin melanjutkan studi pascasarjana setelah lulus."],["B2","2340","الْمُعَلِّمُ الْجَيِّدُ يُلْهِمُ طُلَّابَهُ وَلَا يَكْتَفِي بِالشَّرْحِ.","Guru yang baik menginspirasi murid-muridnya, tidak hanya menjelaskan."],["B2","2341","يُمْكِنُ لِلتَّعَلُّمِ عَنْ بُعْدٍ أَنْ يَنْجَحَ إِذَا الْتَزَمَ الطَّالِبُ بِجَدْوَلٍ.","Belajar jarak jauh bisa berhasil jika siswa menaati jadwal."],["B2","2342","اكْتَسَبْتُ الْخِبْرَةَ مِنْ التَّدْرِيبِ الْعَمَلِيِّ أَكْثَرَ مِنَ الْمُحَاضَرَاتِ.","Saya mendapat pengalaman dari magang lebih banyak daripada dari kuliah."],["B2","2343","مِنَ الضَّرُورِيِّ أَنْ تَتَعَلَّمَ لُغَةً أَجْنَبِيَّةً إِلَى جَانِبِ لُغَتِكَ.","Penting bagi kamu untuk belajar bahasa asing selain bahasa sendiri."],["B2","2344","لَيْسَ هُنَاكَ عُمْرٌ مُحَدَّدٌ لِلتَّعَلُّمِ، فَالْعِلْمُ لَا يَنْتَهِي.","Tidak ada usia tertentu untuk belajar, sebab ilmu tidak berujung."],["B2","2345","يَتَغَيَّرُ شَكْلُ الْوَظَائِفِ بِسُرْعَةٍ بِسَبَبِ التِّقْنِيَةِ.","Bentuk pekerjaan berubah cepat karena teknologi."],["B2","2346","حَصَلْتُ عَلَى مِنْحَةٍ لِدِرَاسَةِ الْمَاجِسْتِيرِ فِي الْقَاهِرَةِ.","Saya mendapat beasiswa untuk studi magister di Kairo."],["B2","2347","عَلَى الْمَدَارِسِ أَنْ تُدَرِّسَ التَّفْكِيرَ النَّقْدِيَّ لَا الْحِفْظَ فَقَطْ.","Sekolah seharusnya mengajarkan berpikir kritis, bukan sekadar menghafal."],["B2","2348","بَدَأْتُ دَوْرَةً عَلَى الْإِنْتَرْنِتِ لِأُحَسِّنَ مَهَارَاتِي فِي الْكِتَابَةِ.","Saya mulai kursus daring untuk meningkatkan keterampilan menulis."],["B2","2349","يُسَاعِدُ الْعَمَلُ الْجَمَاعِيُّ الطُّلَّابَ عَلَى تَعَلُّمِ الْقِيَادَةِ.","Kerja kelompok membantu para siswa belajar kepemimpinan."],["B2","2350","مَا أَهَمُّ مَهَارَةٍ تَنْصَحُ بِتَعَلُّمِهَا لِلْمُسْتَقْبَلِ؟","Keterampilan terpenting apa yang kamu sarankan untuk masa depan?"],["B2","2351","يَحْتَاجُ الطَّالِبُ إِلَى بِيئَةٍ هَادِئَةٍ لِيُذَاكِرَ بِتَرْكِيزٍ.","Siswa membutuhkan lingkungan yang tenang untuk belajar dengan fokus."],["B2","2352","الِامْتِحَانَاتُ لَيْسَتِ الْمِقْيَاسَ الْوَحِيدَ لِلْفَهْمِ.","Ujian bukan satu-satunya ukuran pemahaman."],["B2","2353","يُسَاعِدُنَا الذَّكَاءُ الِاصْطِنَاعِيُّ فِي إِنْجَازِ الْأَعْمَالِ الرُّوتِينِيَّةِ بِسُرْعَةٍ.","Kecerdasan buatan membantu kita menyelesaikan pekerjaan rutin dengan cepat."],["B2","2354","لَا يَجُوزُ أَنْ نَثِقَ بِإِجَابَةِ الْآلَةِ دُونَ مُرَاجَعَةٍ.","Tidak boleh kita memercayai jawaban mesin tanpa memeriksanya."],["B2","2355","تُثِيرُ الْبَيَانَاتُ الشَّخْصِيَّةُ تَسَاؤُلَاتٍ حَوْلَ الْأَمَانِ وَالْخُصُوصِيَّةِ.","Data pribadi menimbulkan pertanyaan tentang keamanan dan privasi."],["B2","2356","سَتُغَيِّرُ السَّيَّارَاتُ ذَاتِيَّةُ الْقِيَادَةِ شَكْلَ الْمُدُنِ.","Mobil swakemudi akan mengubah wajah kota-kota."],["B2","2357","الِاعْتِمَادُ الزَّائِدُ عَلَى التِّقْنِيَةِ يُضْعِفُ بَعْضَ مَهَارَاتِنَا.","Ketergantungan berlebihan pada teknologi melemahkan sebagian keterampilan kita."],["B2","2358","اسْتَخْدَمْتُ تَرْجَمَةً آلِيَّةً ثُمَّ رَاجَعْتُهَا بِنَفْسِي.","Saya memakai terjemahan mesin lalu memeriksanya sendiri."],["B2","2359","يُمْكِنُ لِلتَّقْنِيَةِ أَنْ تُسَاعِدَ ذَوِي الِاحْتِيَاجَاتِ الْخَاصَّةِ.","Teknologi dapat membantu penyandang kebutuhan khusus."],["B2","2360","مَنْ يَتَحَمَّلُ الْمَسْؤُولِيَّةَ إِذَا أَخْطَأَ النِّظَامُ الذَّكِيُّ؟","Siapa yang bertanggung jawab jika sistem cerdas itu membuat kesalahan?"],["B2","2361","احْرِصْ عَلَى تَحْدِيثِ بَرَامِجِكَ لِتَسُدَّ الثَّغَرَاتِ الْأَمْنِيَّةَ.","Pastikan memperbarui perangkat lunakmu untuk menutup celah keamanan."],["B2","2362","تَجْمَعُ الشَّرِكَاتُ بَيَانَاتِنَا لِتُقَدِّمَ لَنَا إِعْلَانَاتٍ مُنَاسِبَةً.","Perusahaan mengumpulkan data kita untuk menampilkan iklan yang cocok."],["B2","2363","أَدَّتِ الْأَتْمَتَةُ إِلَى فُقْدَانِ بَعْضِ الْوَظَائِفِ وَخَلْقِ وَظَائِفَ جَدِيدَةٍ.","Otomasi menyebabkan hilangnya sebagian pekerjaan dan menciptakan pekerjaan baru."],["B2","2364","أَعْتَمِدُ عَلَى التَّطْبِيقَاتِ لِتَنْظِيمِ وَقْتِي وَمَهَامِّي.","Saya mengandalkan aplikasi untuk mengatur waktu dan tugas saya."],["B2","2365","لَنْ تَسْتَطِيعَ الْآلَةُ أَنْ تَفْهَمَ الْمَشَاعِرَ كَمَا يَفْهَمُهَا الْإِنْسَانُ.","Mesin tidak akan mampu memahami perasaan sebagaimana manusia memahaminya."],["B2","2366","تَعَلَّمْتُ الْبَرْمَجَةَ لِأَنِّي أَرَدْتُ فَهْمَ كَيْفَ تَعْمَلُ التَّطْبِيقَاتِ.","Saya belajar pemrograman karena ingin tahu cara kerja aplikasi."],["B2","2367","يَجِبُ عَلَيْنَا أَنْ نَسْتَخْدِمَ التَّقْنِيَةَ بِوَعْيٍ وَلَيْسَ بِإِدْمَانٍ.","Kita harus menggunakan teknologi dengan sadar, bukan dengan kecanduan."],["B2","2368","كَثِيرٌ مِنَ الْمَهَامِّ يُمْكِنُ أَتْمَتَتُهَا لَكِنَّ الْإِبْدَاعَ يَبْقَى لِلْإِنْسَانِ.","Banyak tugas bisa diotomatisasi tetapi kreativitas tetap milik manusia."],["B2","2369","يُحْفَظُ الْكَثِيرُ مِنَ الْمَعْلُومَاتِ فِي السَّحَابَةِ الْإِلِكْتُرُونِيَّةِ.","Banyak informasi disimpan di penyimpanan awan."],["B2","2370","ارْتَفَعَ التَّضَخُّمُ هَذَا الْعَامَ مِمَّا أَثَّرَ فِي الْقُدْرَةِ الشِّرَائِيَّةِ.","Inflasi naik tahun ini sehingga memengaruhi daya beli."],["B2","2371","يَقْتَرِضُ كَثِيرٌ مِنَ النَّاسِ لِشِرَاءِ بُيُوتٍ ثُمَّ يَجِدُونَ الْأَقْسَاطَ ثَقِيلَةً.","Banyak orang berutang untuk membeli rumah lalu mendapati cicilannya berat."],["B2","2372","تَعْتَمِدُ الْأَسْوَاقُ عَلَى الثِّقَةِ بَيْنَ الْبَائِعِ وَالْمُشْتَرِي.","Pasar bergantung pada kepercayaan antara penjual dan pembeli."],["B2","2373","قَرَّرَتِ الْحُكُومَةُ دَعْمَ الْمَشَارِيعِ الصَّغِيرَةِ لِخَلْقِ فُرَصِ عَمَلٍ.","Pemerintah memutuskan mendukung usaha kecil untuk menciptakan lapangan kerja."],["B2","2374","لَا أُفَضِّلُ الِاسْتِثْمَارَ فِي شَيْءٍ لَا أَفْهَمُهُ جَيِّدًا.","Saya tidak suka berinvestasi pada sesuatu yang tidak saya pahami dengan baik."],["B2","2375","انْخَفَضَتْ أَسْعَارُ النِّفْطِ، فَتَأَثَّرَتْ مِيزَانِيَّاتُ الدُّوَلِ الْمُصَدِّرَةِ.","Harga minyak turun, sehingga anggaran negara pengekspor terpengaruh."],["B2","2376","التَّنَوُّعُ فِي الِاقْتِصَادِ يَحْمِي الْبَلَدَ مِنَ الْأَزَمَاتِ.","Keragaman ekonomi melindungi negara dari krisis."],["B2","2377","يَدْفَعُ الْمُسْتَهْلِكُ فِي النِّهَايَةِ ثَمَنَ ارْتِفَاعِ التَّكَالِيفِ.","Pada akhirnya konsumenlah yang membayar kenaikan biaya."],["B2","2378","يُعَدُّ التَّعْلِيمُ أَفْضَلَ اسْتِثْمَارٍ طَوِيلِ الْأَمَدِ.","Pendidikan dianggap sebagai investasi jangka panjang terbaik."],["B2","2379","هَلْ تَعْتَقِدُ أَنَّ الْعُمْلَةَ الرَّقْمِيَّةَ سَتَحُلُّ مَحَلَّ النَّقْدِ؟","Apakah kamu kira mata uang digital akan menggantikan uang tunai?"],["B2","2380","تَرْتَفِعُ الْأَسْعَارُ عِنْدَمَا يَزِيدُ الطَّلَبُ عَلَى الْعَرْضِ.","Harga naik ketika permintaan melebihi penawaran."],["B2","2381","أَنَا أُفَضِّلُ دَعْمَ الْمُنْتَجَاتِ الْمَحَلِّيَّةِ حَتَّى لَوْ كَانَتْ أَغْلَى.","Saya lebih suka mendukung produk lokal meskipun lebih mahal."],["B2","2382","لَا أَحَدَ يَعْرِفُ بِدِقَّةٍ مَا سَيَحْدُثُ لِلْأَسْوَاقِ الْعَامَ الْقَادِمَ.","Tidak ada yang tahu persis apa yang akan terjadi pada pasar tahun depan."],["B2","2383","رَبِحَتِ الشَّرِكَةُ هَذَا الْعَامَ بِفَضْلِ التَّوَسُّعِ فِي الْأَسْوَاقِ الْخَارِجِيَّةِ.","Perusahaan itu untung tahun ini berkat ekspansi ke pasar luar negeri."],["B2","2384","يُعَانِي الْمُزَارِعُونَ مِنْ تَقَلُّبِ الْأَسْعَارِ بَيْنَ مَوْسِمٍ وَآخَرَ.","Para petani menderita akibat naik-turunnya harga dari musim ke musim."],["B2","2385","مِنَ الصَّعْبِ أَنْ تَبْنِيَ تِجَارَةً دُونَ رَأْسِ مَالٍ كَافٍ.","Sulit membangun usaha tanpa modal yang cukup."],["B2","2386","تَعْمَلُ الْعَوْلَمَةُ عَلَى رَبْطِ الْأَسْوَاقِ، لَكِنَّهَا تَزِيدُ الْمُنَافَسَةَ.","Globalisasi menghubungkan pasar, tetapi menambah persaingan."],["B2","2387","يُنْصَحُ بِتَحْدِيدِ مِيزَانِيَّةٍ شَهْرِيَّةٍ وَالِالْتِزَامِ بِهَا.","Dianjurkan menetapkan anggaran bulanan dan menaatinya."],["B2","2388","الْوِقَايَةُ مِنَ الْأَمْرَاضِ تَبْدَأُ مِنَ الْغِذَاءِ وَالنَّوْمِ وَالْحَرَكَةِ.","Pencegahan penyakit dimulai dari makanan, tidur, dan gerak."],["B2","2389","يَجِبُ عَلَى الْجَمِيعِ تَلَقِّي اللَّقَاحَاتِ فِي مَوَاعِيدِهَا.","Semua orang wajib menerima vaksin sesuai jadwalnya."],["B2","2390","قِلَّةُ النَّوْمِ تُضْعِفُ التَّرْكِيزَ وَالْمَنَاعَةَ مَعًا.","Kurang tidur melemahkan konsentrasi dan kekebalan tubuh sekaligus."],["B2","2391","يُوصِي الْأَطِبَّاءُ بِتَقْلِيلِ السُّكَّرِ وَالْمِلْحِ فِي الطَّعَامِ.","Para dokter menganjurkan mengurangi gula dan garam dalam makanan."],["B2","2392","الْفَحْصُ الدَّوْرِيُّ يَكْشِفُ الْأَمْرَاضَ قَبْلَ أَنْ تَتَفَاقَمَ.","Pemeriksaan berkala mendeteksi penyakit sebelum bertambah parah."],["B2","2393","الضَّغْطُ النَّفْسِيُّ الْمُسْتَمِرُّ قَدْ يُسَبِّبُ أَمْرَاضًا جَسَدِيَّةً.","Stres yang terus-menerus bisa menyebabkan penyakit fisik."],["B2","2394","رَغْمَ أَنَّهُ يَعْلَمُ ضَرَرَ التَّدْخِينِ، لَمْ يَسْتَطِعْ أَنْ يُقْلِعَ عَنْهُ.","Meskipun ia tahu bahaya merokok, ia belum mampu berhenti."],["B2","2395","اغْسِلْ يَدَيْكَ جَيِّدًا قَبْلَ تَنَاوُلِ الطَّعَامِ وَبَعْدَ الْعَوْدَةِ مِنَ الْخَارِجِ.","Cucilah tanganmu dengan baik sebelum makan dan setelah pulang dari luar."],["B2","2396","يَحْتَاجُ الْجِسْمُ إِلَى مَاءٍ كَافٍ خُصُوصًا فِي الطَّقْسِ الْحَارِّ.","Tubuh membutuhkan air yang cukup terutama di cuaca panas."],["B2","2397","عَلَيْنَا أَنْ نَهْتَمَّ بِالصِّحَّةِ النَّفْسِيَّةِ كَاهْتِمَامِنَا بِالصِّحَّةِ الْجَسَدِيَّةِ.","Kita harus memperhatikan kesehatan mental seperti halnya kesehatan fisik."],["B2","2398","يُفَضَّلُ أَنْ نَتَنَاوَلَ الْغَدَاءَ الرَّئِيسِيَّ قَبْلَ الْعَصْرِ.","Sebaiknya kita makan siang utama sebelum waktu asar."],["B2","2399","ارْتَفَعَتْ نِسْبَةُ السِّمْنَةِ بَيْنَ الْأَطْفَالِ بِسَبَبِ قِلَّةِ الْحَرَكَةِ.","Angka obesitas di kalangan anak meningkat karena kurang gerak."],["B2","2400","الْمَشْيُ نِصْفُ سَاعَةٍ يَوْمِيًّا يُحَسِّنُ الْقَلْبَ وَالْمِزَاجَ.","Berjalan setengah jam setiap hari memperbaiki jantung dan suasana hati."],["B2","2401","لَا تَتَنَاوَلْ دَوَاءً بِدُونِ اسْتِشَارَةِ الطَّبِيبِ.","Jangan minum obat tanpa berkonsultasi dengan dokter."],["B2","2402","صِحَّتُنَا هِيَ أَثْمَنُ مَا نَمْلِكُ، وَلَا نَعْرِفُ قِيمَتَهَا إِلَّا إِذَا فَقَدْنَاهَا.","Kesehatan adalah milik kita yang paling berharga, dan kita baru tahu nilainya ketika kehilangannya."],["B2","2403","يُنْصَحُ بِتَنَاوُلِ الْخُضَارِ وَالْفَوَاكِهِ يَوْمِيًّا.","Dianjurkan makan sayur dan buah setiap hari."],["B2","2404","يَزُورُ الْمَرِيضَ أَهْلُهُ وَيُشْعِرُونَهُ بِالدَّعْمِ.","Keluarga mengunjungi si sakit dan membuatnya merasa didukung."],["B2","2405","تَحْتَاجُ الْحَوَامِلُ إِلَى مُتَابَعَةٍ طِبِّيَّةٍ مُنْتَظِمَةٍ.","Ibu hamil membutuhkan pemantauan medis secara teratur."],["B2","2406","انْتَقَلْتُ إِلَى بَلَدٍ جَدِيدٍ وَاحْتَجْتُ وَقْتًا لِأَتَأَقْلَمَ مَعَ نَمَطِ الْحَيَاةِ.","Saya pindah ke negara baru dan butuh waktu untuk menyesuaikan diri dengan pola hidup."],["B2","2407","الْحَنِينُ إِلَى الْوَطَنِ يَزْدَادُ فِي الْأَعْيَادِ.","Rindu kepada tanah air bertambah di hari-hari raya."],["B2","2408","أُحَافِظُ عَلَى لُغَتِي وَثَقَافَتِي حَتَّى فِي الْغُرْبَةِ.","Saya menjaga bahasa dan budaya saya bahkan di perantauan."],["B2","2409","الِانْدِمَاجُ فِي الْمُجْتَمَعِ الْجَدِيدِ لَا يَعْنِي نِسْيَانَ الْأَصْلِ.","Berbaur dengan masyarakat baru tidak berarti melupakan asal."],["B2","2410","وَاجَهْتُ صُعُوبَةً فِي إِيجَادِ عَمَلٍ لِأَنَّ شَهَادَتِي لَمْ تُعْتَمَدْ.","Saya kesulitan mendapat pekerjaan karena ijazah saya belum diakui."],["B2","2411","أَشْعُرُ أَنَّ لِي وَطَنَيْنِ: الْأَوَّلُ وُلِدْتُ فِيهِ وَالثَّانِي اخْتَرْتُهُ.","Saya merasa punya dua tanah air: yang pertama tempat saya lahir dan yang kedua saya pilih."],["B2","2412","يَسْهُلُ تَكْوِينُ الصَّدَاقَاتِ عِنْدَمَا نَتَعَلَّمُ لُغَةَ الْبَلَدِ.","Menjalin persahabatan menjadi mudah saat kita belajar bahasa negeri itu."],["B2","2413","لَقِيتُ تَرْحِيبًا كَبِيرًا مِنْ جِيرَانِي الْجُدُدِ.","Saya disambut hangat oleh tetangga-tetangga baru saya."],["B2","2414","يَجِبُ عَلَى الْمُجْتَمَعَاتِ أَنْ تَحْتَرِمَ التَّنَوُّعَ الثَّقَافِيَّ.","Masyarakat harus menghormati keragaman budaya."],["B2","2416","لَا أُرِيدُ أَنْ أَفْقِدَ جُذُورِي مَهْمَا ابْتَعَدْتُ.","Saya tidak ingin kehilangan akar saya sejauh apa pun saya pergi."],["B2","2417","يَتَعَلَّمُ أَبْنَاؤُنَا لُغَتَيْنِ، وَهَذَا مَكْسَبٌ كَبِيرٌ لَهُمْ.","Anak-anak kami belajar dua bahasa, dan itu keuntungan besar bagi mereka."],["B2","2418","أَحْيَانًا أُحِسُّ بِأَنِّي غَرِيبٌ فِي الْمَكَانَيْنِ.","Kadang saya merasa asing di kedua tempat."],["B2","2419","انْضَمَمْتُ إِلَى جَمْعِيَّةٍ لِلْمُغْتَرِبِينَ مِنْ بَلَدِي.","Saya bergabung dengan perkumpulan perantau dari negara saya."],["B2","2420","أَشْعُرُ بِالْفَخْرِ لِأَنِّي أُمَثِّلُ بَلَدِي فِي الْخَارِجِ.","Saya merasa bangga karena mewakili negara saya di luar negeri."],["B2","2421","عِنْدَمَا عُدْتُ إِلَى الْوَطَنِ بَعْدَ سَنَوَاتٍ وَجَدْتُ كُلَّ شَيْءٍ قَدْ تَغَيَّرَ.","Ketika saya pulang ke tanah air setelah bertahun-tahun, saya mendapati segalanya telah berubah."],["B2","2422","الْغُرْبَةُ تُعَلِّمُ الْإِنْسَانَ الِاعْتِمَادَ عَلَى نَفْسِهِ.","Hidup di perantauan mengajari manusia mengandalkan dirinya sendiri."],["B2","2423","اللُّغَةُ لَيْسَتْ مُجَرَّدَ كَلِمَاتٍ، بَلْ هِيَ طَرِيقَةٌ فِي التَّفْكِيرِ.","Bahasa bukan sekadar kata-kata, tetapi cara berpikir."],["B2","2424","لَا تُوجَدُ دَائِمًا كَلِمَةٌ مُطَابِقَةٌ تَمَامًا فِي لُغَتَيْنِ مُخْتَلِفَتَيْنِ.","Tidak selalu ada kata yang persis sama di dua bahasa yang berbeda."],["B2","2425","تُرْجِمَ الْكِتَابُ إِلَى أَكْثَرَ مِنْ عِشْرِينَ لُغَةً.","Buku itu telah diterjemahkan ke lebih dari dua puluh bahasa."],["B2","2426","أَسْتَطِيعُ فَهْمَ الْكَلَامِ لَكِنِّي أُوَاجِهُ صُعُوبَةً فِي الْكِتَابَةِ.","Saya bisa memahami percakapan tetapi kesulitan dalam menulis."],["B2","2427","يَخْتَلِفُ نُطْقُ الْكَلِمَةِ الْوَاحِدَةِ مِنْ لَهْجَةٍ إِلَى أُخْرَى.","Pelafalan satu kata berbeda dari satu dialek ke dialek lain."],["B2","2428","مِنَ الْأَفْضَلِ أَنْ نَتَعَلَّمَ الْعِبَارَاتِ كَامِلَةً وَلَيْسَ كَلِمَاتٍ مُنْفَرِدَةً.","Sebaiknya kita belajar ungkapan secara utuh, bukan kata-kata terpisah."],["B2","2430","أَخْطَأْتُ فِي الْإِعْرَابِ لَكِنَّهُمْ فَهِمُوا قَصْدِي.","Saya salah dalam tata bahasa i'rab, tetapi mereka memahami maksud saya."],["B2","2431","يُحَدِّثُنِي مُعَلِّمِي بِبُطْءٍ وَوُضُوحٍ لِأَفْهَمَ.","Guru saya berbicara kepada saya pelan dan jelas supaya saya paham."],["B2","2432","هَلْ تَقْصِدُ الْمَعْنَى الْحَرْفِيَّ أَمِ الْمَعْنَى الْمَجَازِيَّ؟","Apakah kamu maksud arti harfiah atau arti kiasan?"],["B2","2433","لِلْمُتَرْجِمِ دَوْرٌ مُهِمٌّ فِي نَقْلِ الثَّقَافَاتِ لَا اللُّغَاتِ فَقَطْ.","Penerjemah punya peran penting dalam memindahkan budaya, bukan hanya bahasa."],["B2","2434","يُمْكِنُكَ أَنْ تُعَبِّرَ عَنْ نَفْسِكَ بِطُرُقٍ مُخْتَلِفَةٍ إِذَا عَرَفْتَ مُرَادِفَاتٍ كَثِيرَةً.","Kamu bisa mengekspresikan diri dengan cara berbeda jika tahu banyak sinonim."],["B2","2435","لَمْ أَفْهَمِ الْمَثَلَ لِأَنَّ تَرْجَمَتَهُ الْحَرْفِيَّةَ لَا مَعْنَى لَهَا.","Saya tidak paham peribahasa itu karena terjemahan harfiahnya tidak bermakna."],["B2","2436","الْحُرُوفُ الْعَرَبِيَّةُ تَتَغَيَّرُ أَشْكَالُهَا بِحَسَبِ مَوْضِعِهَا فِي الْكَلِمَةِ.","Bentuk huruf Arab berubah sesuai posisinya dalam kata."],["B2","2437","كُلَّمَا مَارَسْتُ الْكَلَامَ أَكْثَرَ زَادَتْ ثِقَتِي بِنَفْسِي.","Semakin banyak saya berlatih berbicara, semakin percaya diri saya."],["B2","2438","سَأُتْقِنُ الْعَرَبِيَّةَ بِإِذْنِ اللَّهِ إِذَا وَاصَلْتُ التَّدْرِيبَ.","Saya akan menguasai bahasa Arab, insya Allah, jika terus berlatih."],["B2","2439","تَرْجَمَةُ الشِّعْرِ أَصْعَبُ مِنْ تَرْجَمَةِ النَّثْرِ لِأَنَّ الْإِيقَاعَ يَضِيعُ.","Menerjemahkan puisi lebih sulit daripada prosa karena iramanya hilang."],["B2","2440","يَنُصُّ الدُّسْتُورُ عَلَى أَنَّ الْمُوَاطِنِينَ مُتَسَاوُونَ أَمَامَ الْقَانُونِ.","Konstitusi menyatakan bahwa warga negara setara di hadapan hukum."],["B2","2441","لِكُلِّ مُتَّهَمٍ الْحَقُّ فِي مُحَامٍ يُدَافِعُ عَنْهُ.","Setiap terdakwa berhak mendapat pengacara yang membelanya."],["B2","2442","رَفَعَ الْعُمَّالُ دَعْوَى ضِدَّ الشَّرِكَةِ بِسَبَبِ تَأَخُّرِ الْأُجُورِ.","Para pekerja mengajukan gugatan terhadap perusahaan karena keterlambatan gaji."],["B2","2443","لَا يُعْفِي جَهْلُ الْقَانُونِ أَحَدًا مِنَ الْمَسْؤُولِيَّةِ.","Ketidaktahuan akan hukum tidak membebaskan siapa pun dari tanggung jawab."],["B2","2444","تَحْمِي قَوَانِينُ الْعَمَلِ حُقُوقَ الْعَامِلِينَ مِنَ التَّعَسُّفِ.","Undang-undang ketenagakerjaan melindungi hak pekerja dari kesewenang-wenangan."],["B2","2445","قَدَّمْتُ شَكْوَى رَسْمِيَّةً وَأَنْتَظِرُ الرَّدَّ.","Saya mengajukan pengaduan resmi dan menunggu jawaban."],["B2","2446","يَجِبُ أَنْ يَكُونَ الْقَاضِي مُحَايِدًا وَلَا يَتَأَثَّرَ بِالضُّغُوطِ.","Hakim harus netral dan tidak terpengaruh tekanan."],["B2","2447","مِنْ حَقِّ الْمُسْتَهْلِكِ أَنْ يَسْتَرِدَّ ثَمَنَ السِّلْعَةِ الْمَعِيبَةِ.","Konsumen berhak mengembalikan harga barang yang cacat."],["B2","2448","اخْتَلَفَ الْجَارَانِ عَلَى حُدُودِ الْأَرْضِ فَلَجَأَا إِلَى الْمَحْكَمَةِ.","Dua tetangga berselisih soal batas tanah lalu mengadu ke pengadilan."],["B2","2449","حُرِّيَّةُ التَّعْبِيرِ حَقٌّ، لَكِنَّهَا لَا تَعْنِي الْإِسَاءَةَ لِلْآخَرِينَ.","Kebebasan berpendapat adalah hak, tetapi bukan berarti menghina orang lain."],["B2","2450","يُعَاقَبُ كُلُّ مَنْ يُخَالِفُ الْأَنْظِمَةَ الْمَرُورِيَّةِ بِغَرَامَةٍ.","Setiap pelanggar aturan lalu lintas dikenai denda."],["B2","2451","مِنْ حَقِّكَ أَنْ تَعْرِفَ سَبَبَ الْقَرَارِ وَأَنْ تَعْتَرِضَ عَلَيْهِ.","Kamu berhak mengetahui alasan keputusan dan mengajukan keberatan."],["B2","2452","لَا يُدَانُ الشَّخْصُ حَتَّى تَثْبُتَ إِدَانَتُهُ بِحُكْمٍ نِهَائِيٍّ.","Seseorang tidak dinyatakan bersalah hingga terbukti dengan putusan final."],["B2","2453","شَهِدَ الْجَمِيعُ بِأَنَّهُ كَانَ فِي الْمَكَانِ نَفْسِهِ وَقْتَ الْحَادِثِ.","Semua orang bersaksi bahwa ia berada di tempat yang sama saat kejadian."],["B2","2454","يُسَاعِدُ مَرْكَزُ الْمُسَاعَدَةِ الْقَانُونِيَّةِ الْفُقَرَاءَ مَجَّانًا.","Pusat bantuan hukum membantu orang miskin secara gratis."],["B2","2456","مِنَ الْمُهِمِّ أَنْ نَقْرَأَ الْعَقْدَ كَامِلًا قَبْلَ أَنْ نُوَقِّعَهُ.","Penting bagi kita membaca kontrak secara utuh sebelum menandatanganinya."],["B2","2457","تُعَدُّ الْعَدَالَةُ الْبَطِيئَةُ نَوْعًا مِنَ الظُّلْمِ.","Keadilan yang lambat dianggap sebagai salah satu bentuk ketidakadilan."],["B2","2458","الْعَيْشُ فِي الْمَدِينَةِ أَسْرَعُ إِيقَاعًا مِنَ الْعَيْشِ فِي الرِّيفِ، لَكِنَّهُ أَغْلَى كَثِيرًا.","Hidup di kota lebih cepat temponya daripada di desa, tetapi jauh lebih mahal."],["B2","2459","كِلَا الْخِيَارَيْنِ لَهُ مَزَايَا، غَيْرَ أَنَّ الثَّانِيَ أَنْسَبُ لِظُرُوفِي.","Kedua pilihan itu ada kelebihannya, hanya saja yang kedua lebih sesuai dengan keadaan saya."],["B2","2460","عَلَى عَكْسِ مَا كُنْتُ أَظُنُّ، الْعَمَلُ فِي فَرِيقٍ أَسْهَلُ مِنَ الْعَمَلِ الْفَرْدِيِّ.","Berbeda dari dugaan saya, bekerja dalam tim lebih mudah daripada bekerja sendiri."],["B2","2461","مَقَارَنَةً بِالْعَامِ الْمَاضِي، انْخَفَضَتْ تَكَالِيفُ الْإِنْتَاجِ بِنِسْبَةِ عَشَرَةٍ بِالْمِئَةِ.","Dibandingkan tahun lalu, biaya produksi turun sepuluh persen."],["B2","2462","تَتَشَابَهُ الْأَسْعَارُ فِي الْمَحَلَّيْنِ، وَتَخْتَلِفُ الْخِدْمَةُ كَثِيرًا.","Harga di kedua toko mirip, tetapi layanannya sangat berbeda."],["B2","2463","لَيْسَ هُنَاكَ خِيَارٌ مِثَالِيٌّ، فَعَلَيْنَا أَنْ نَزِنَ الْإِيجَابِيَّاتِ وَالسَّلْبِيَّاتِ.","Tidak ada pilihan yang sempurna, jadi kita harus menimbang sisi positif dan negatifnya."],["B2","2464","كُلَّمَا قَارَنْتُ بَيْنَ الْعُرُوضِ ازْدَدْتُ حَيْرَةً.","Semakin saya membandingkan tawaran-tawaran itu, semakin bingung saya."],["B2","2466","فِي حِينِ يُفَضِّلُ بَعْضُهُمُ الِادِّخَارَ، يَنْفِقُ آخَرُونَ كُلَّ مَا يَكْسِبُونَ.","Sementara sebagian orang lebih suka menabung, yang lain menghabiskan semua penghasilannya."],["B2","2467","هَذَا الْهَاتِفُ لَيْسَ أَفْضَلَ مِنَ الْآخَرِ، إِنَّمَا يَخْتَلِفُ فِي الْمَزَايَا.","Ponsel ini tidak lebih baik dari yang lain, hanya berbeda dalam fitur."],["B2","2468","مِنْ جِهَةٍ الْمُرَتَّبُ جَيِّدٌ، وَمِنْ جِهَةٍ أُخْرَى سَاعَاتُ الْعَمَلِ طَوِيلَةٌ.","Di satu sisi gajinya bagus, di sisi lain jam kerjanya panjang."],["B2","2469","لَا يُمْكِنُ مُقَارَنَةُ بَلَدَيْنِ مُخْتَلِفَيْنِ فِي الظُّرُوفِ التَّارِيخِيَّةِ بِسُهُولَةٍ.","Dua negara yang berbeda kondisi sejarahnya tidak mudah dibandingkan."],["B2","2470","يُعَدُّ هَذَا الْمَطْعَمُ الْأَفْضَلَ فِي الْمِنْطَقَةِ مِنْ حَيْثُ الطَّعْمُ وَالنَّظَافَةُ.","Restoran ini dianggap yang terbaik di daerah itu dari segi rasa dan kebersihan."],["B2","2471","بَدَلًا مِنْ شِرَاءِ سَيَّارَةٍ جَدِيدَةٍ، قَرَّرْتُ إِصْلَاحَ الْقَدِيمَةِ.","Daripada membeli mobil baru, saya memutuskan memperbaiki yang lama."],["B2","2472","كِلَاهُمَا يَسْتَحِقُّ الثَّنَاءَ، وَإِنْ كَانَتْ جُهُودُ الْأَوَّلِ أَكْبَرَ.","Keduanya layak dipuji, meskipun usaha yang pertama lebih besar."],["B2","2473","كُلُّ طَرِيقَةٍ فِي التَّدْرِيسِ لَهَا نِقَاطُ قُوَّةٍ وَضَعْفٍ.","Setiap metode mengajar memiliki kekuatan dan kelemahan."],["B2","2474","الشِّتَاءُ هُنَا أَبْرَدُ بِكَثِيرٍ مِمَّا كُنْتُ أَتَوَقَّعُ.","Musim dingin di sini jauh lebih dingin dari yang saya duga."],["B2","2475","مَا الْفَرْقُ بَيْنَ الْوَظِيفَتَيْنِ مِنْ حَيْثُ الْفُرَصُ وَالرَّاتِبُ؟","Apa perbedaan kedua pekerjaan itu dari segi peluang dan gaji?"],["B2","2476","أَعْتَقِدُ أَنَّ الْخِبْرَةَ تَتَفَوَّقُ عَلَى الشَّهَادَةِ فِي بَعْضِ الْمِهَنِ.","Saya yakin pengalaman mengungguli ijazah dalam beberapa profesi."],["B2","2478","مِنَ الْمُفِيدِ أَنْ نَسْأَلَ أَكْثَرَ مِنْ شَخْصٍ قَبْلَ أَنْ نُقَرِّرَ.","Berguna jika kita bertanya kepada lebih dari satu orang sebelum memutuskan."],["B2","2479","هَذَا الْحَلُّ أَرْخَصُ، لَكِنَّ ذَاكَ أَدْوَمُ.","Solusi ini lebih murah, tetapi yang itu lebih awet."],["B2","2480","الْقَائِدُ النَّاجِحُ هُوَ مَنْ يَسْتَمِعُ قَبْلَ أَنْ يَأْمُرَ.","Pemimpin yang berhasil adalah yang mendengar sebelum memerintah."],["B2","2481","عِنْدَمَا تَقَعُ الْأَزْمَةُ يَجِبُ أَنْ نَحْتَفِظَ بِهُدُوئِنَا وَنُحَدِّدَ الْأَوْلَوِيَّاتِ.","Ketika krisis terjadi, kita harus tetap tenang dan menentukan prioritas."],["B2","2482","لَا يُمْكِنُ حَلُّ الْمُشْكِلَةِ إِلَّا إِذَا فَهِمْنَا جَذْرَهَا.","Masalah tidak dapat diselesaikan kecuali kita memahami akarnya."],["B2","2483","عَلَى الْمُدِيرِ أَنْ يَتَحَمَّلَ مَسْؤُولِيَّةَ قَرَارَاتِهِ لَا أَنْ يُلْقِيَ اللَّوْمَ عَلَى غَيْرِهِ.","Manajer harus menanggung tanggung jawab keputusannya, bukan menyalahkan orang lain."],["B2","2484","لَقَدْ مَرَرْنَا بِأَزْمَةٍ مَالِيَّةٍ وَخَرَجْنَا مِنْهَا أَقْوَى.","Kami pernah mengalami krisis keuangan dan keluar darinya lebih kuat."],["B2","2485","الْقِيَادَةُ لَيْسَتْ مَنْصِبًا، بَلْ هِيَ قُدْرَةٌ عَلَى التَّأْثِيرِ الْإِيجَابِيِّ.","Kepemimpinan bukan jabatan, melainkan kemampuan memberi pengaruh positif."],["B2","2486","فِي الْأَزَمَاتِ يَظْهَرُ مَعْدِنُ الْفَرِيقِ الْحَقِيقِيُّ.","Dalam krisis, karakter sejati sebuah tim akan tampak."],["B2","2487","عَلَيْنَا أَنْ نَضَعَ خُطَّةً بَدِيلَةً تَحَسُّبًا لِأَيِّ طَارِئٍ.","Kita harus membuat rencana cadangan sebagai antisipasi segala keadaan darurat."],["B2","2488","الْقَرَارُ السَّرِيعُ لَيْسَ دَائِمًا الْقَرَارَ الصَّحِيحَ.","Keputusan cepat tidak selalu keputusan yang benar."],["B2","2489","يَنْبَغِي أَنْ نَتَوَاصَلَ بِوُضُوحٍ مَعَ الْجَمِيعِ فِي أَوْقَاتِ الشِّدَّةِ.","Kita sebaiknya berkomunikasi dengan jelas kepada semua orang di masa sulit."],["B2","2490","الْمُدِيرُ الَّذِي يُفَوِّضُ الْمَهَامَّ يُنَمِّي مَهَارَاتِ فَرِيقِهِ.","Manajer yang mendelegasikan tugas mengembangkan keterampilan timnya."],["B2","2491","لَوْ تَعَاوَنَّا مِنَ الْبِدَايَةِ لَمَا وَصَلَتِ الْأُمُورُ إِلَى هَذَا الْحَدِّ.","Seandainya kita bekerja sama sejak awal, keadaan tidak akan sampai separah ini."],["B2","2492","حِينَ يَخْتَلِفُ الْفَرِيقُ يَجِبُ عَلَى الْقَائِدِ أَنْ يُقَرِّبَ وُجُهَاتِ النَّظَرِ.","Ketika tim berbeda pendapat, pemimpin harus mendekatkan sudut pandang."],["B2","2493","مَنْ لَا يَتَعَلَّمُ مِنْ أَخْطَائِهِ يُكَرِّرُهَا.","Siapa yang tidak belajar dari kesalahannya akan mengulanginya."],["B2","2494","مَا أَنْجَحَ الْقَادَةَ الَّذِينَ يُحِبُّونَ مَنْ يَعْمَلُونَ مَعَهُمْ!","Betapa suksesnya para pemimpin yang mencintai orang-orang yang bekerja bersama mereka!"],["B2","2495","اجْتَمَعْنَا فِي أَثْنَاءِ الطَّارِئِ وَاتَّخَذْنَا الْقَرَارَ فِي سَاعَةٍ.","Kami berkumpul saat keadaan darurat dan mengambil keputusan dalam satu jam."],["B2","2496","الْمَسْؤُولِيَّةُ الْجَمَاعِيَّةُ تُخَفِّفُ عَنِ الْفَرْدِ ثِقَلَ الْقَرَارِ.","Tanggung jawab bersama meringankan beban keputusan dari individu."],["B2","2497","إِنَّ الْقَائِدَ الْحَقِيقِيَّ يَصْنَعُ قَادَةً آخَرِينَ.","Pemimpin sejati melahirkan pemimpin-pemimpin lain."],["B2","2498","لَا تَنْتَظِرِ الْأَزْمَةَ لِتَبْدَأَ التَّخْطِيطَ.","Jangan menunggu krisis untuk mulai merencanakan."],["B2","2499","التَّغْيِيرُ يُخِيفُ الْكَثِيرِينَ، وَوَاجِبُ الْقَائِدِ أَنْ يُطَمْئِنَهُمْ وَيَشْرَحَ لَهُمُ الْأَسْبَابَ.","Perubahan menakutkan banyak orang, dan kewajiban pemimpin adalah menenangkan dan menjelaskan alasannya."],["B2","2500","قَبْلَ أَنْ نَبْحَثَ عَنْ مُذْنِبٍ، دَعُونَا نَبْحَثْ عَنْ حَلٍّ.","Sebelum mencari siapa yang bersalah, mari kita cari solusi."],["B2","2501","شَاهَدْتُ فِيلْمًا يَطْرَحُ أَسْئِلَةً عَمِيقَةً عَنِ الْحُرِّيَّةِ وَالْمَسْؤُولِيَّةِ.","Saya menonton film yang mengajukan pertanyaan mendalam tentang kebebasan dan tanggung jawab."],["B2","2502","لَمْ يَكُنِ الْفِيلْمُ كَمَا تَوَقَّعْتُ، فَقَدْ كَانَتِ الْقِصَّةُ بَطِيئَةً.","Filmnya tidak seperti yang saya harapkan, ceritanya lambat."],["B2","2503","أُفَضِّلُ الْمَسْرَحَ لِأَنَّ الْمُمَثِّلَ يَقِفُ أَمَامَكَ مُبَاشَرَةً.","Saya lebih suka teater karena aktornya berdiri langsung di hadapanmu."],["B2","2504","أَدَّى الْمُمَثِّلُ دَوْرَ الْأَبِ بِإِتْقَانٍ حَتَّى بَكَى الْجُمْهُورُ.","Aktor itu memerankan sang ayah dengan sangat baik hingga penonton menangis."],["B2","2505","النِّهَايَةُ كَانَتْ مَفْتُوحَةً فَتَرَكَتْنَا نُفَكِّرُ طَوِيلًا.","Akhir ceritanya terbuka sehingga membuat kita berpikir lama."],["B2","2506","يُعْرَضُ الْفِيلْمُ فِي دُورِ السِّينَمَا ابْتِدَاءً مِنَ الْخَمِيسِ.","Film itu ditayangkan di bioskop mulai hari Kamis."],["B2","2507","فَازَ الْفِيلْمُ بِجَائِزَةِ أَفْضَلِ سِيَنَارْيُو فِي الْمِهْرَجَانِ.","Film itu memenangkan penghargaan skenario terbaik di festival."],["B2","2509","دَخَلْنَا الْمَسْرَحَ قَبْلَ بِدَايَةِ الْعَرْضِ بِعَشْرِ دَقَائِقَ.","Kami masuk ke teater sepuluh menit sebelum pertunjukan dimulai."],["B2","2510","تُعَالِجُ الْمَسْرَحِيَّةُ قَضِيَّةً اجْتِمَاعِيَّةً بِأُسْلُوبٍ سَاخِرٍ.","Drama itu mengangkat isu sosial dengan gaya satir."],["B2","2511","أَعَدْتُ مُشَاهَدَةَ الْمَشْهَدِ الْأَخِيرِ ثَلَاثَ مَرَّاتٍ.","Saya menonton ulang adegan terakhir sebanyak tiga kali."],["B2","2513","الْمَوْسِيقَى التَّصْوِيرِيَّةُ تَزِيدُ الْمَشْهَدَ تَأْثِيرًا.","Musik latar menambah kuat pengaruh adegan."],["B2","2514","لِمَاذَا يُحِبُّ النَّاسُ أَفْلَامَ الرُّعْبِ مَعَ أَنَّهَا تُخِيفُهُمْ؟","Mengapa orang menyukai film horor padahal menakutkan mereka?"],["B2","2515","صُوِّرَ الْفِيلْمُ فِي صَحْرَاءَ بَعِيدَةٍ عَنِ الْمُدُنِ.","Film itu dibuat di gurun yang jauh dari kota."],["B2","2516","أَعْمَلُ فِي مَجَالِ الْمُوَنْتَاجِ وَأُحِبُّ مَا أَفْعَلُهُ.","Saya bekerja di bidang penyuntingan film dan menyukai apa yang saya lakukan."],["B2","2517","لَا أَتَذَكَّرُ اسْمَ الْمُخْرِجِ لَكِنِّي أَتَذَكَّرُ الْفِكْرَةَ جَيِّدًا.","Saya tidak ingat nama sutradaranya, tetapi saya ingat idenya dengan baik."],["B2","2518","ظَهَرَ الْمُمَثِّلُ الْمَشْهُورُ فِي مُسَلْسَلٍ جَدِيدٍ يُعْرَضُ فِي رَمَضَانَ.","Aktor terkenal itu muncul dalam serial baru yang ditayangkan di bulan Ramadan."],["B2","2519","الصَّدِيقُ الْحَقِيقِيُّ هُوَ مَنْ يَقِفُ بِجَانِبِكَ فِي الشِّدَّةِ.","Sahabat sejati adalah yang berdiri di sisimu saat kesulitan."],["B2","2520","تَحْتَاجُ الصَّدَاقَةُ إِلَى الْوَقْتِ وَالِاهْتِمَامِ لِتَبْقَى.","Persahabatan membutuhkan waktu dan perhatian agar bertahan."],["B2","2521","اخْتَلَفْنَا حَوْلَ مَسْأَلَةٍ صَغِيرَةٍ، لَكِنَّنَا تَصَالَحْنَا سَرِيعًا.","Kami berselisih soal hal kecil, tetapi segera berdamai."],["B2","2522","لَا أَسْتَطِيعُ أَنْ أَثِقَ بِمَنْ يَكْذِبُ عَلَيَّ حَتَّى فِي الْأَشْيَاءِ الصَّغِيرَةِ.","Saya tidak bisa memercayai orang yang berbohong kepada saya bahkan dalam hal kecil."],["B2","2523","شَعَرْتُ بِالْوَحْدَةِ بَعْدَ أَنْ سَافَرَ أَقْرَبُ أَصْدِقَائِي.","Saya merasa kesepian setelah sahabat terdekat saya pergi."],["B2","2524","عَلَيْنَا أَنْ نُصَارِحَ بَعْضَنَا بِلُطْفٍ حِينَ نَخْتَلِفُ.","Kita harus berterus terang satu sama lain dengan lembut ketika berbeda pendapat."],["B2","2525","أَشْكُرُكَ لِأَنَّكَ سَمِعْتَنِي حِينَ لَمْ يَسْمَعْنِي أَحَدٌ.","Terima kasih karena kamu mendengarkan saya ketika tidak ada orang lain yang mendengar."],["B2","2526","نَصِلُ إِلَى مَرْحَلَةٍ نُدْرِكُ فِيهَا أَنَّ الْأَصْدِقَاءَ الْقَلِيلِينَ أَفْضَلُ مِنَ الْكَثِيرِينَ.","Kita sampai pada tahap menyadari bahwa sedikit sahabat lebih baik daripada banyak."],["B2","2527","لَمْ أَتَوَقَّعْ أَنْ يَتَغَيَّرَ سُلُوكُهُ مَعِي بَعْدَ الشُّهْرَةِ.","Saya tidak menyangka sikapnya terhadap saya berubah setelah terkenal."],["B2","2528","لَنْ أَنْسَى مَوْقِفَكَ الْجَمِيلَ مَعِي مَا حَيِيتُ.","Saya tidak akan melupakan sikap baikmu kepada saya seumur hidup."],["B2","2529","مِنَ الصَّعْبِ أَنْ نَعْتَذِرَ أَحْيَانًا، لَكِنَّهُ يُنْقِذُ الْعَلَاقَةَ.","Terkadang sulit meminta maaf, tetapi itu menyelamatkan hubungan."],["B2","2530","هَلْ تَظُنُّ أَنَّ الصَّدَاقَةَ بَيْنَ الرَّجُلِ وَالْمَرْأَةِ مُمْكِنَةٌ؟","Apakah kamu kira persahabatan antara laki-laki dan perempuan itu mungkin?"],["B2","2532","قَدْ تَبْتَعِدُ الْمَسَافَاتُ بَيْنَنَا لَكِنَّ الْقُلُوبَ تَبْقَى قَرِيبَةً.","Jarak mungkin memisahkan kita tetapi hati tetap dekat."],["B2","2533","قَابَلْتُ صَدِيقَ الطُّفُولَةِ بَعْدَ عِشْرِينَ سَنَةً.","Saya bertemu sahabat masa kecil setelah dua puluh tahun."],["B2","2534","لَا يَقِيسُ الْوَقْتُ الصَّدَاقَةَ، بَلْ تَقِيسُهَا الْمَوَاقِفُ.","Waktu tidak mengukur persahabatan, melainkan sikap-sikap yang menguji."],["B2","2535","أُقَدِّرُ الصَّدِيقَ الَّذِي يَقُولُ لِي الْحَقِيقَةَ وَإِنْ كَانَتْ مُرَّةً.","Saya menghargai sahabat yang mengatakan kebenaran kepada saya meskipun pahit."],["B2","2537","يَتَعَلَّمُ الطِّفْلُ مِنَ الْقُدْوَةِ أَكْثَرَ مِمَّا يَتَعَلَّمُ مِنَ الْكَلَامِ.","Anak belajar dari teladan lebih banyak daripada dari perkataan."],["B2","2538","يَجِبُ عَلَى الْوَالِدَيْنِ أَنْ يُخَصِّصَا وَقْتًا لِلْجُلُوسِ مَعَ أَبْنَائِهِمَا.","Orang tua harus menyediakan waktu untuk duduk bersama anak-anak mereka."],["B2","2539","لَا أُحِبُّ أَنْ أَقْسُوَ عَلَى أَوْلَادِي، لَكِنَّ الْحَزْمَ ضَرُورِيٌّ أَحْيَانًا.","Saya tidak suka bersikap keras kepada anak-anak saya, tetapi ketegasan kadang diperlukan."],["B2","2540","كَانَ جَدِّي يَحْكِي لَنَا قِصَصًا قَبْلَ النَّوْمِ كُلَّ لَيْلَةٍ.","Kakek dulu bercerita kepada kami sebelum tidur setiap malam."],["B2","2541","نَحْرِصُ عَلَى أَنْ نَتَنَاوَلَ الْعَشَاءَ مَعًا كُلَّ يَوْمٍ.","Kami berusaha makan malam bersama setiap hari."],["B2","2542","تَقَعُ عَلَى الْأُمِّ وَالْأَبِ مَسْؤُولِيَّةٌ مُشْتَرَكَةٌ فِي تَرْبِيَةِ الْأَبْنَاءِ.","Ibu dan ayah memikul tanggung jawab bersama dalam mendidik anak."],["B2","2543","أَتَحَدَّثُ مَعَ ابْنِي عَنْ مَشَاكِلِهِ وَأُصْغِي إِلَيْهِ دُونَ حُكْمٍ.","Saya berbicara dengan anak saya tentang masalahnya dan mendengarkannya tanpa menghakimi."],["B2","2544","كَبِرَ أَبْنَاؤُنَا وَصَارُوا يَعْتَمِدُونَ عَلَى أَنْفُسِهِمْ.","Anak-anak kami sudah besar dan mulai mandiri."],["B2","2545","عَلَّمَتْنِي أُمِّي أَنَّ الْكَلِمَةَ الطَّيِّبَةَ صَدَقَةٌ.","Ibu saya mengajari saya bahwa kata-kata yang baik adalah sedekah."],["B2","2546","لَمْ نُفَرِّقْ فِي الْمُعَامَلَةِ بَيْنَ الْأَوْلَادِ وَالْبَنَاتِ.","Kami tidak membedakan perlakuan antara anak laki-laki dan perempuan."],["B2","2547","يَحْتَاجُ الْمُرَاهِقُ إِلَى مَنْ يَفْهَمُهُ لَا إِلَى مَنْ يَأْمُرُهُ.","Remaja membutuhkan orang yang memahaminya, bukan yang memerintahnya."],["B2","2548","يُسَاعِدُنِي إِخْوَتِي فِي رِعَايَةِ وَالِدِي الْمَرِيضِ.","Saudara-saudara saya membantu merawat ayah saya yang sakit."],["B2","2549","الْبَيْتُ الَّذِي يَسُودُهُ الْحُبُّ يُخَرِّجُ أَبْنَاءً أَصِحَّاءَ نَفْسِيًّا.","Rumah yang dipenuhi cinta melahirkan anak-anak yang sehat jiwanya."],["B2","2550","اتَّفَقْنَا عَلَى قَوَاعِدَ وَاضِحَةٍ لِاسْتِخْدَامِ الْهَوَاتِفِ فِي الْبَيْتِ.","Kami menyepakati aturan jelas untuk penggunaan ponsel di rumah."],["B2","2551","أَتَمَنَّى أَنْ أَكُونَ لِأَبْنَائِي الْأَبَ الَّذِي كُنْتُ أَحْتَاجُهُ.","Saya berharap bisa menjadi ayah bagi anak-anak saya seperti yang dulu saya butuhkan."],["B2","2552","يَجِبُ أَلَّا نُقَارِنَ طِفْلًا بِآخَرَ لِأَنَّ لِكُلٍّ مَوَاهِبَهُ.","Kita tidak boleh membandingkan seorang anak dengan yang lain karena masing-masing punya bakat."],["B2","2553","الْجُلُوسُ مَعَ الْأَجْدَادِ يُعَلِّمُ الْأَطْفَالَ تَارِيخَ الْعَائِلَةِ وَقِيَمَهَا.","Duduk bersama kakek-nenek mengajari anak sejarah dan nilai keluarga."],["B2","2554","يُسْعِدُنِي أَنْ أَرَى أَبْنَائِي يَتَعَاوَنُونَ فِي أَعْمَالِ الْبَيْتِ.","Saya senang melihat anak-anak saya saling membantu dalam pekerjaan rumah."],["B2","2555","زُرْنَا الْمَدِينَةَ الْقَدِيمَةَ وَتَجَوَّلْنَا فِي أَزِقَّتِهَا الضَّيِّقَةِ.","Kami mengunjungi kota tua dan berkeliling di gang-gangnya yang sempit."],["B2","2556","تُعَدُّ هَذِهِ الْقَلْعَةُ مِنْ أَهَمِّ الْمَعَالِمِ الْأَثَرِيَّةِ فِي الْمِنْطَقَةِ.","Benteng ini dianggap sebagai salah satu situs bersejarah terpenting di kawasan ini."],["B2","2557","يَجِبُ عَلَيْنَا أَنْ نُحَافِظَ عَلَى الْآثَارِ لِلْأَجْيَالِ الْقَادِمَةِ.","Kita harus menjaga peninggalan sejarah untuk generasi mendatang."],["B2","2558","يَعْرِضُ الْمَتْحَفُ قِطَعًا يَعُودُ تَارِيخُهَا إِلَى أَلْفِ سَنَةٍ.","Museum memamerkan benda-benda yang berasal dari seribu tahun lalu."],["B2","2559","اسْتَأْجَرْنَا مُرْشِدًا سِيَاحِيًّا يَشْرَحُ لَنَا تَارِيخَ الْمَكَانِ.","Kami menyewa pemandu wisata yang menjelaskan sejarah tempat itu."],["B2","2560","يُمَيِّزُ هَذِهِ الْمَنْطِقَةَ طِرَازُهَا الْمِعْمَارِيُّ الْفَرِيدُ.","Kawasan ini dibedakan oleh gaya arsitekturnya yang unik."],["B2","2561","اشْتَرَيْتُ بَعْضَ الْحِرَفِ الْيَدَوِيَّةِ هَدَايَا لِأَصْدِقَائِي.","Saya membeli beberapa kerajinan tangan sebagai oleh-oleh untuk teman-teman."],["B2","2563","التُّرَاثُ جُزْءٌ مِنْ هُوِيَّتِنَا وَلَا يَجُوزُ إِهْمَالُهُ.","Warisan budaya adalah bagian dari identitas kita dan tidak boleh diabaikan."],["B2","2564","يَرْتَفِعُ عَدَدُ السُّيَّاحِ فِي الرَّبِيعِ وَتَزْدَحِمُ الْأَمَاكِنُ.","Jumlah wisatawan meningkat di musim semi dan tempat-tempat menjadi padat."],["B2","2565","أُرِيدُ أَنْ أَرَى الْمَكَانَ كَمَا يَرَاهُ أَهْلُهُ لَا كَمَا يَرَاهُ السَّائِحُ.","Saya ingin melihat tempat itu seperti penduduknya melihatnya, bukan seperti turis."],["B2","2566","أُدْرِجَتِ الْمَدِينَةُ عَلَى قَائِمَةِ التُّرَاثِ الْعَالَمِيِّ.","Kota itu dimasukkan dalam daftar warisan dunia."],["B2","2567","يُقَامُ فِي الصَّيْفِ مِهْرَجَانٌ يَعْرِضُ الْفُنُونَ الشَّعْبِيَّةَ.","Pada musim panas diadakan festival yang menampilkan seni rakyat."],["B2","2568","الرِّحْلَةُ لَيْسَتْ زِيَارَةَ أَمَاكِنَ فَقَطْ، بَلْ تَعَلُّمُ ثَقَافَاتٍ.","Perjalanan bukan sekadar mengunjungi tempat, tetapi mempelajari budaya."],["B2","2569","قَامَ الْفَنَّانُونَ بِتَرْمِيمِ الْجِدَارِيَّاتِ الْقَدِيمَةِ بِعِنَايَةٍ شَدِيدَةٍ.","Para seniman merestorasi lukisan dinding kuno dengan sangat hati-hati."],["B2","2570","حَجَزْنَا نُزُلًا تَقْلِيدِيًّا فِي قَلْبِ الْبَلْدَةِ الْقَدِيمَةِ.","Kami memesan penginapan tradisional di jantung kota tua."],["B2","2571","زِيَارَةُ الْمَتَاحِفِ تُعَلِّمُنَا أَكْثَرَ مِمَّا نَقْرَأُ فِي الْكُتُبِ.","Mengunjungi museum mengajari kita lebih banyak daripada yang kita baca di buku."],["B2","2572","أَكْتُبُ مُذَكِّرَاتِي كُلَّ مَسَاءٍ لِأُرَتِّبَ أَفْكَارِي.","Saya menulis catatan harian setiap malam untuk menata pikiran."],["B2","2573","أَصْعَبُ جُمْلَةٍ فِي أَيِّ مَقَالٍ هِيَ الْجُمْلَةُ الْأُولَى.","Kalimat tersulit dalam artikel apa pun adalah kalimat pertama."],["B2","2574","يَجِبُ أَنْ تَكُونَ لُغَةُ الْمَقَالِ وَاضِحَةً وَمُبَاشِرَةً.","Bahasa artikel harus jelas dan langsung."],["B2","2576","الْقِصَّةُ الْجَيِّدَةُ تَبْدَأُ بِشَخْصِيَّةٍ لَهَا هَدَفٌ وَعَقَبَةٌ.","Cerita yang baik dimulai dari tokoh yang punya tujuan dan rintangan."],["B2","2577","لَا تَكْتُبْ لِتُعْجِبَ النَّاسَ، بَلِ اكْتُبْ لِتَقُولَ مَا تُؤْمِنُ بِهِ.","Jangan menulis untuk menyenangkan orang, tulislah untuk mengatakan apa yang kamu yakini."],["B2","2578","الْكِتَابَةُ مَهَارَةٌ تَتَحَسَّنُ بِالْمُمَارَسَةِ الْيَوْمِيَّةِ.","Menulis adalah keterampilan yang membaik dengan latihan harian."],["B2","2579","اسْتَخْدَمْتُ الِاسْتِعَارَةَ لِأُقَرِّبَ الْفِكْرَةَ مِنَ الْقَارِئِ.","Saya memakai metafora untuk mendekatkan gagasan kepada pembaca."],["B2","2580","تَرَدَّدْتُ كَثِيرًا قَبْلَ أَنْ أَنْش
