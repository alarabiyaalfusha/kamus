<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamus Mufradat Bahasa Arab Tematik · Al-Fusha Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c:#9C7A2B;--cd:#4A3510;--gold:#D6A63C;--champ:#F4D98B;--ivory:#FFF9EB;--ink:#352116;--mut:#6b5a4c;--line:#eadfcb;--ok:#2e9e6a;--no:#d04545;
 --A1:#70452E;--A2:#1C9174;--B1:#2456A6;--B2:#8B2948}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--ivory);color:var(--ink)}
.ar{font-family:Amiri,'Noto Naskh Arabic',serif;direction:rtl}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bgc{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:12px 16px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px var(--gold)}
.brand b{display:block;font-family:Amiri,serif;font-size:1.15rem;line-height:1.1}
.brand small{display:block;font-size:.62rem;letter-spacing:.12em;font-weight:600;color:var(--mut)}
.badge{border-radius:12px 12px 22px 22px;background:var(--c);border:3px solid var(--gold);color:var(--champ);font-weight:800;font-size:.8rem;padding:8px 8px 10px;text-align:center;line-height:1.1;flex:none}
.search{position:sticky;top:0;z-index:5;background:var(--ivory);padding:6px 0 10px}
.search input{width:100%;font:500 1rem Poppins,sans-serif;border:2px solid var(--line);background:#fff;border-radius:16px;padding:13px 16px 13px 44px;outline:none}
.search input:focus{border-color:var(--gold)}
.search span{position:absolute;left:14px;top:18px;font-size:1.1rem}
.hero{text-align:center;margin:6px 0 16px}
.hero .ar{font-size:1.7rem;font-weight:700;color:var(--c);line-height:1.4}
.hero h1{font-size:clamp(1.4rem,5.4vw,2rem);line-height:1.15;font-weight:800}
.hero p{color:var(--mut);font-size:.9rem;margin-top:4px}
.bonus{display:inline-block;background:var(--champ);color:var(--cd);font-weight:700;font-size:.75rem;border-radius:999px;padding:3px 12px;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px 14px;text-align:left;box-shadow:0 8px 20px rgba(53,33,22,.06);transition:transform .15s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px)}
.tile .em{font-size:1.9rem}
.tile b{display:block;font-size:1rem;margin-top:4px}
.tile .an{font-family:Amiri,serif;color:var(--c);font-weight:700}
.tile small{display:block;color:var(--mut);font-size:.76rem}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;border:0}
.tile.wide small,.tile.wide .an{color:var(--champ)}
.prog{height:7px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:8px}
.prog b{display:block;height:100%;background:var(--champ)}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.back{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:1.15rem;flex:none}
.top h2{font-size:1.15rem;line-height:1.2;flex:1}
.top h2 .ar{display:block;color:var(--c);font-size:1.1rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tabs button{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem}
.tabs button.on{background:var(--c);border-color:var(--c);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.th .no{font-size:.7rem;font-weight:800;color:var(--gold)}
.th .ar{font-size:1.15rem;font-weight:700;color:var(--cd);line-height:1.4}
.th b{font-size:.82rem;line-height:1.25}
.th small{font-size:.7rem;color:var(--mut)}
.th .bar{height:5px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.th .bar i{display:block;height:100%;background:var(--ok)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:.9rem;font-weight:600;line-height:1.3}
.row .m small{display:block;font-size:.72rem;color:var(--mut)}
.row .w{font-family:Amiri,serif;direction:rtl;font-weight:700;font-size:1.45rem;line-height:1.35;color:var(--cd);text-align:right}
.row .w small{display:block;font-size:.95rem;color:var(--c);font-weight:400}
.row .st{font-size:.9rem;flex:none}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;width:100%}
.pair .s{text-align:center}.pair .s .ar{font-size:1.35rem;font-weight:700;display:block;line-height:1.35}.pair .s small{font-size:.75rem;color:var(--mut)}
.pair .x{font-weight:800;color:var(--gold)}
.lvl{display:inline-block;color:#fff;font-weight:800;font-size:.66rem;border-radius:6px;padding:1px 7px;vertical-align:middle}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.more{display:block;margin:12px auto 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c);color:#fff;font-weight:700;border-radius:999px;padding:12px 22px;text-decoration:none;font-size:.95rem}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.no{background:var(--no)}
.btn.sm{padding:8px 14px;font-size:.82rem}
/* sheet */
.shade{position:fixed;inset:0;background:rgba(53,33,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--ivory);width:100%;max-width:820px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:14px 18px 28px;animation:up .25s ease}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .kind{font-size:.74rem;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.wbig{text-align:center;margin:6px 0 2px}
.wbig .ar{font-size:3.2rem;font-weight:700;line-height:1.4;color:var(--cd)}
.wbig .mn{font-size:1.15rem;font-weight:700}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0}
.form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.form small{display:block;font-size:.68rem;color:var(--mut);font-weight:600}
.form .ar{font-size:1.45rem;font-weight:700;line-height:1.4}
.play{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;font-size:1.3rem;flex:none}
.play.on{background:var(--gold);color:var(--cd);animation:pulse .8s infinite}
.star{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:1.2rem}
.sec{font-weight:800;font-size:.92rem;margin:14px 0 8px}
.sent{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.sent .tx{flex:1}
.sent .ar{font-size:1.3rem;font-weight:700;line-height:1.5;display:block}
.sent small{font-size:.78rem;color:var(--mut)}
.sent .p2{width:40px;height:40px;border-radius:50%;background:var(--ivory);border:2px solid var(--line);flex:none}
.sent .p2.on{background:var(--gold)}
mark{background:var(--champ);color:inherit;border-radius:4px;padding:0 2px}
/* flash */
.fc{perspective:1000px;height:min(52vh,420px);margin:6px 0 14px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.fc .f{background:#fff;border:3px solid var(--c);box-shadow:0 14px 30px rgba(53,33,22,.12)}
.fc .f .ar{font-size:clamp(2.4rem,10vw,3.6rem);font-weight:700;color:var(--cd);line-height:1.4}
.fc .f small{color:var(--mut);margin-top:10px;font-size:.8rem}
.fc .b{background:linear-gradient(135deg,var(--c),var(--cd));color:#fff;transform:rotateY(180deg)}
.fc .b .mn{font-size:1.5rem;font-weight:800}
.fc .b .ar{font-size:1.5rem;color:var(--champ);margin-top:10px;line-height:1.5}
.cnt{display:flex;justify-content:space-between;font-size:.82rem;font-weight:600;color:var(--mut);margin-bottom:6px}
.bar2{height:7px;border-radius:4px;background:var(--line);overflow:hidden}.bar2 b{display:block;height:100%;background:var(--gold)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes pulse{50%{transform:scale(1.08)}}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

جَدَّتِي تَدْعُو لَنَا دَائِمًا.","Nenek saya selalu mendoakan kami."],["A2","805","أُمِّي تَطْبُخُ أَطْيَبَ طَعَامٍ.","Ibu saya memasak makanan terenak."],["A2","806","أَخِي الصَّغِيرُ يُحِبُّ اللَّعِبَ كَثِيرًا.","Adik laki-laki saya sangat suka bermain."],["A2","807","نَتَنَاوَلُ الْعَشَاءَ مَعًا كُلَّ لَيْلَةٍ.","Kami makan malam bersama setiap malam."],["A2","808","أَيُّهُمَا أَكْبَرُ، أَنْتَ أَمْ أَخُوكَ؟","Siapa yang lebih tua, kamu atau saudaramu?"],["A2","809","تَزَوَّجَتْ أُخْتِي مِنْ رَجُلٍ طَيِّبٍ.","Saudari saya menikah dengan pria yang baik."],["A2","810","سَأُقِيمُ حَفْلَةً لِصَدِيقِي.","Saya akan mengadakan pesta untuk teman saya."],["A2","811","دَعَوْتُ أَصْدِقَائِي إِلَى الْبَيْتِ.","Saya mengundang teman-teman ke rumah."],["A2","812","جَاءَ الْجَمِيعُ فِي الْمَوْعِدِ.","Semua orang datang tepat waktu."],["A2","813","الصَّدِيقُ الْحَقِيقِيُّ يَقِفُ مَعَكَ.","Teman sejati berdiri bersamamu."],["A2","814","هُوَ يُشْبِهُ أَبَاهُ كَثِيرًا.","Dia sangat mirip ayahnya."],["A2","815","أُحِبُّ أَنْ أَسْتَمِعَ إِلَى نَصَائِحِ وَالِدَيَّ.","Saya suka mendengarkan nasihat orang tua saya."],["A2","816","أَحْيَانًا أَذْهَبُ إِلَى الْعَمَلِ مَشْيًا.","Kadang saya berjalan kaki ke tempat kerja."],["A2","817","بَيْتُنَا قَرِيبٌ مِنَ الْمَدْرَسَةِ.","Rumah kami dekat dari sekolah."],["A2","818","نَسْكُنُ فِي شَقَّةٍ صَغِيرَةٍ.","Kami tinggal di apartemen kecil."],["A2","820","أُرَتِّبُ غُرْفَتِي كُلَّ أُسْبُوعٍ.","Saya merapikan kamar saya setiap minggu."],["A2","821","هَلْ تُرِيدُ أَنْ تَرَى بَيْتِي؟","Maukah kamu melihat rumah saya?"],["A2","822","الْمَطْبَخُ هُوَ مَكَانِي الْمُفَضَّلُ.","Dapur adalah tempat favorit saya."],["A2","823","فِي غُرْفَةِ الْجُلُوسِ أَرِيكَةٌ كَبِيرَةٌ.","Di ruang tamu ada sofa besar."],["A2","824","نُشَاهِدُ التِّلْفَازَ مَعًا فِي الْمَسَاءِ.","Kami menonton TV bersama di malam hari."],["A2","825","أُنَظِّفُ الْبَيْتَ كُلَّ سَبْتٍ.","Saya membersihkan rumah setiap hari Sabtu."],["A2","826","يَجِبُ أَنْ نُنَظِّفَ الْمَطْبَخَ الْآنَ."," ya akan datang besok."],["A2","942","سَأُحَضِّرُ الْعَشَاءَ الْيَوْمَ.","Hari ini saya akan menyiapkan makan malam."],["A2","943","هَلْ سَتَأْتِي مَعَنَا؟","Apakah kamu akan ikut bersama kami?"],["A2","944","لَنْ أَتَأَخَّرَ مَرَّةً أُخْرَى.","Saya tidak akan terlambat lagi."],["A2","945","أُرِيدُ أَنْ أَنَامَ مُبَكِّرًا الْيَوْمَ.","Hari ini saya ingin tidur lebih awal."],["A2","947","يَجِبُ أَنْ نَسْتَعِدَّ لِلِامْتِحَانِ.","Kita harus bersiap untuk ujian."],["A2","948","أَسْتَطِيعُ أَنْ أَسْبَحَ.","Saya bisa berenang."],["A2","949","لَا أَسْتَطِيعُ أَنْ أَقُودَ السَّيَّارَةَ.","Saya tidak bisa mengemudi mobil."],["A2","950","هَلْ تَسْتَطِيعُ أَنْ تَأْتِيَ غَدًا؟","Bisakah kamu datang besok?"],["A2","951","مِنَ الْمُمْكِنِ أَنْ أَتَأَخَّرَ قَلِيلًا.","Mungkin saya akan terlambat sedikit."],["A2","952","فِي الْأُسْبُوعِ الْقَادِمِ لَدَيَّ عُطْلَةٌ.","Minggu depan saya libur."],["A2","953","أُخَطِّطُ لِلسَّفَرِ إِلَى تُرْكِيَا.","Saya merencanakan bepergian ke Turki."],["A2","954","سَأَبْدَأُ دَوْرَةً جَدِيدَةً الشَّهْرَ الْقَادِمَ.","Bulan depan saya akan memulai kursus baru."],["A2","955","أَتَمَنَّى أَنْ أَتَكَلَّمَ الْعَرَبِيَّةَ بِطَلَاقَةٍ.","Saya berharap bisa berbicara bahasa Arab dengan lancar."],["A2","956","فِي الْمُسْتَقْبَلِ أُرِيدُ أَنْ أَعْمَلَ فِي الْخَارِجِ.","Di masa depan saya ingin bekerja di luar negeri."],["A2","957","سَأَشْتَرِي بَيْتًا صَغِيرًا يَوْمًا مَا.","Suatu hari saya akan membeli rumah kecil."],["A2","958","غَدًا سَأَسْتَيْقِظُ مُبَكِّرًا لِأَذْهَبَ إِلَى السُّوقِ.","Besok saya akan bangun pagi untuk pergi ke pasar."],["A2","959","مَتَى سَتَنْتَهِي مِنَ الْعَمَلِ؟","Kapan kamu selesai kerja?"],["A2","960","سَنَلْتَقِي أَمَامَ الْمَسْجِدِ بَعْدَ الصَّلَاةِ.","Kita akan bertemu di depan masjid setelah salat."],["A2","961","إِذَا نَجَحْتُ فِي الِامْتِحَانِ سَأُقِيمُ حَفْلَةً.","Jika saya lulus ujian, saya akan mengadakan pesta."],["A2","962","إِذَا أَمْطَرَتْ غَدًا سَنَبْقَى فِي الْبَيْتِ.","Jika besok hujan, kita akan tinggal di rumah."],["A2","963","لَنْ أَنْسَى مَوْعِدَنَا.","Saya tidak akan lupa janji kita."],["A2","964","هَلْ لَدَيْكَ خُطَّةٌ لِلْعُطْلَةِ؟","Apakah kamu punya rencana untuk liburan?"],["A2","965","أُرِيدُ أَنْ أَتَعَلَّمَ الْقِيَادَةَ هَذَا الْعَامَ.","Tahun ini saya ingin belajar mengemudi."],["A2","966","سَأَدَّخِرُ مَالًا لِلْحَجِّ.","Saya akan menabung untuk haji."],["A2","967","سَيَبْدَأُ الْفِيلْمُ بَعْدَ نِصْفِ سَاعَةٍ.","Filmnya akan mulai setengah jam lagi."],["A2","968","رُبَّمَا أَزُورُكَ الْأُسْبُوعَ الْقَادِمَ.","Mungkin saya akan mengunjungimu minggu depan."],["A2","969","لَا أَعْرِفُ مَاذَا سَأَفْعَلُ بَعْدَ التَّخَرُّجِ.","Saya belum tahu apa yang akan saya lakukan setelah lulus."],["A2","970","سَأُخْبِرُكَ بِالنَّتِيجَةِ غَدًا.","Besok saya beri tahu hasilnya."],["A2","971","هَلْ نَسْتَطِيعُ أَنْ نَلْتَقِيَ غَدًا؟","Bisakah kita bertemu besok?"],["A2","972","فِي أَيِّ سَاعَةٍ تُنَاسِبُكَ؟","Jam berapa yang cocok untukmu?"],["A2","973","الثَّالِثَةُ تُنَاسِبُنِي.","Jam tiga cocok bagi saya."],["A2","974","هَلْ يُمْكِنُ تَأْجِيلُ الْمَوْعِدِ؟","Bisakah janjinya ditunda?"],["A2","975","أَرْجُو أَنْ تُغَيِّرَ الْمَوْعِدَ إِلَى الْأُسْبُوعِ الْقَادِمِ.","Tolong ubah janjinya ke minggu depan."],["A2","976","أَلْغَيْتُ حَجْزِي.","Saya membatalkan pesanan saya."],["A2","977","هَلْ أَنْتَ مُتَفَرِّغٌ مَسَاءَ الْخَمِيسِ؟","Apakah kamu luang Kamis malam?"],["A2","978","لَدَيَّ اجْتِمَاعٌ حَتَّى الرَّابِعَةِ.","Saya ada rapat sampai jam empat."],["A2","979","يُمْكِنُنَا أَنْ نَلْتَقِيَ بَعْدَ ذَلِكَ.","Kita bisa bertemu setelah itu."],["A2","981","سَأَكُونُ هُنَاكَ فِي الْوَقْتِ الْمُحَدَّدِ.","Saya akan ada di sana tepat waktu."],["A2","982","إِذَا تَأَخَّرْتُ سَأُخْبِرُكَ.","Jika saya terlambat, saya akan memberitahumu."],["A2","983","اتَّفَقْنَا عَلَى الْمَوْعِدِ.","Kita sudah sepakat soal waktunya."],["A2","984","أُذَكِّرُكَ بِمَوْعِدِنَا غَدًا.","Saya mengingatkanmu soal janji kita besok."],["A2","985","هَلْ تُرِيدُ أَنْ نَجْعَلَهُ فِي الصَّبَاحِ؟","Maukah kita menjad قَبْلَ الِامْتِحَانِ.","Saya takut sebelum ujian."],["A2","1420","أَشْعُرُ بِالْوَحْدَةِ أَحْيَانًا.","Kadang saya merasa kesepian."],["A2","1421","أَنَا فَخُورٌ بِكَ.","Saya bangga padamu."],["A2","1422","لَا تَقْلَقْ، كُلُّ شَيْءٍ سَيَكُونُ بِخَيْرٍ.","Jangan khawatir, semuanya akan baik-baik saja."],["A2","1423","أَنَا مُتَحَمِّسٌ لِلرِّحْلَةِ.","Saya antusias dengan perjalanan itu."],["A2","1424","أَشْعُرُ بِالْغَضَبِ عِنْدَمَا أَنْتَظِرُ كَثِيرًا.","Saya merasa marah ketika menunggu terlalu lama."],["A2","1425","أَنَا أُوَافِقُكَ الرَّأْيَ.","Saya sependapat denganmu."],["A2","1426","لَا أَظُنُّ ذَلِكَ.","Saya kira tidak begitu."],["A2","1427","فِي رَأْيِي هَذَا أَفْضَلُ.","Menurut saya ini lebih baik."],["A2","1428","هَذِهِ فِكْرَةٌ مُمْتَازَةٌ.","Itu ide yang sangat bagus."],["A2","1429","دَعْنَا نُفَكِّرْ فِي الْأَمْرِ.","Mari kita pikirkan hal itu."],["A2","1430","مَاذَا تَقْتَرِحُ؟","Apa usulanmu?"],["A2","1431","أَقْتَرِحُ أَنْ نَذْهَبَ مَعًا.","Saya usul kita pergi bersama."],["A2","1432","هَذَا مُنَاسِبٌ لِي.","Itu cocok bagi saya."],["A2","1433","لَيْسَ عِنْدِي مَانِعٌ.","Saya tidak keberatan."],["A2","1434","أَشْعُرُ بِالرَّاحَةِ هُنَا.","Saya merasa nyaman di sini."],["A2","1435","كَانَ يَوْمًا صَعْبًا لَكِنَّنِي سَعِيدٌ.","Itu hari yang sulit tapi saya bahagia."],["A2","1436","أَشْعُرُ بِالْحَرَجِ مِنْ أَخْطَائِي.","Saya malu dengan kesalahan saya."],["A2","1437","أَنَا أَثِقُ بِكَ.","Saya percaya padamu."],["A2","1438","فَاجَأَنِي الْخَبَرُ كَثِيرًا.","Kabar itu sangat mengejutkan saya."],["A2","1439","كُنْتُ أَتَمَنَّى لَوْ كُنْتَ مَعَنَا.","Saya berharap kamu bersama kami."],["A2","1441","أَظُنُّ أَنَّ هَذِهِ الطَّرِيقَةَ أَسْهَلُ.","Saya kira cara ini lebih mudah."],["A2","1442","لَا أُوَافِقُ عَلَى هَذَا الرَّأْيِ.","Saya tidak setuju dengan pendapat ini."],["A2","1443","مِنْ وِجْهَةِ نَظَرِي هَذَا خَطَأٌ.","Dari sudut pandang saya ini salah."],["A2","1444","دَعْنِي أُفَكِّرُ فِي الْأَمْرِ قَلِيلًا.","Biarkan saya memikirkan hal itu sebentar."],["A2","1445","أَنْتَ عَلَى حَقٍّ.","Kamu benar."],["A2","1446","أَعْتَذِرُ، كُنْتُ مُخْطِئًا.","Maaf, saya yang salah."],["A2","1447","شُكْرًا عَلَى صَبْرِكَ.","Terima kasih atas kesabaranmu."],["A2","1448","أُقَدِّرُ مُسَاعَدَتَكَ كَثِيرًا.","Saya sangat menghargai bantuanmu."],["A2","1449","أَتَمَنَّى لَكَ التَّوْفِيقَ فِي حَيَاتِكَ.","Semoga kamu sukses dalam hidupmu."],["A2","1451","هَلْ يُمْكِنُنِي أَنْ أَسْتَعِيرَ قَلَمَكَ؟","Bolehkah saya meminjam penmu?"],["A2","1452","هَلْ تَسْمَحُ لِي أَنْ أَفْتَحَ النَّافِذَةَ؟","Bolehkah saya membuka jendela?"],["A2","1453","هَلْ يُمْكِنُكَ أَنْ تُخَفِّضَ الصَّوْتَ؟","Bisakah kamu mengecilkan suara?"],["A2","1454","أَرْجُو أَنْ تَنْتَظِرَ قَلِيلًا.","Mohon tunggu sebentar."],["A2","1455","لَوْ تَكَرَّمْتَ، أَعِدْ ذَلِكَ.","Jika berkenan, tolong ulangi itu."],["A2","1456","مِنْ فَضْلِكَ، هَلْ يُمْكِنُنِي أَنْ أَمُرَّ؟","Permisi, bolehkah saya lewat?"],["A2","1457","هَلْ تُمَانِعُ إِنْ جَلَسْتُ هُنَا؟","Apakah kamu keberatan jika saya duduk di sini?"],["A2","1458","أَحْتَاجُ إِلَى مُسَاعَدَتِكَ فِي شَيْءٍ بَسِيطٍ.","Saya butuh bantuanmu untuk hal sederhana."],["A2","1459","هَلْ يُمْكِنُكَ أَنْ تَحْمِلَ هَذِهِ الْحَقِيبَةَ؟","Bisakah kamu membawa tas ini?"],["A2","1460","أَعْطِنِي فُرْصَةً أُخْرَى.","Beri saya kesempatan lagi."],["A2","1461","هَلْ لَدَيْكَ شَاحِنٌ يُمْكِنُنِي اسْتِعَارَتُهُ؟","Apakah kamu punya pengisi daya yang bisa saya pinjam?"],["A2","1462","سَأُعِيدُهُ إِلَيْكَ غَدًا.","Saya akan mengembalikannya kepadamu besok."],["A2","1463","هَلْ يُمْكِنُنِي الدُّخُولُ مَعَكَ؟","Bolehkah saya masuk bersamamu?"],["A2","1464","مِنْ فَضْلِكَ، اكْتُبْ لِي الْعُنْوَانَ.","Tolong tuliskan alamatnya untuk saya."],["A2","1465","أُرِيدُ أَنْ أَسْأَلَ سُؤَالًا سَرِيعًا.","Saya ingin bertanya sebentar."],["A2","1466","هَلْ يُمْكِنُكَ أَنْ تُصَوِّرَنَا؟","Bisakah kamu memotret kami?"],["A2","1468","أَرْجُو أَنْ تُسَامِحَنِي.","Saya harap kamu memaafkan saya."],["A2","1469","هَذَا الْبَيْتُ أَكْبَرُ مِنْ بَيْتِنَا.","Rumah ini lebih besar daripada rumah kami."],["A2","1470","السَّيَّارَةُ أَسْرَعُ مِنَ الدَّرَّاجَةِ.","Mobil lebih cepat daripada sepeda."],["A2","1471","هَذَا الْكِتَابُ أَسْهَلُ مِنْ ذَلِكَ.","Buku ini lebih mudah daripada itu."],["A2","1472","هُوَ أَطْوَلُ مِنِّي بِقَلِيلٍ.","Dia sedikit lebih tinggi dari saya."],["A2","1475","الْمَطْعَمُ الْأَوَّلُ أَرْخَصُ وَالثَّانِي أَنْظَفُ.","Restoran pertama lebih murah dan yang kedua lebih bersih."],["A2","1476","هَذَا الْهَاتِفُ مِثْلُ ذَلِكَ تَمَامًا.","Ponsel ini persis seperti itu."],["A2","1477","لَيْسَ هَذَا بِجَوْدَةِ الْآخَرِ.","Ini tidak sebagus yang lain kualitasnya."],["A2","1479","الطَّرِيقُ الْقَدِيمُ أَقْصَرُ.","Jalan lama lebih pendek."],["A2","1480","الْجَوُّ فِي الْجَبَلِ أَبْرَدُ مِنَ الْمَدِينَةِ.","Cuaca di gunung lebih dingin daripada di kota."],["A2","1481","هِيَ أَذْكَى طَالِبَةٍ فِي الصَّفِّ.","Dia murid perempuan paling pintar di kelas."],["A2","1482","الْغُرْفَةُ مُضِيئَةٌ وَوَاسِعَةٌ.","Kamarnya terang dan luas."],["A2","1483","هَذَا الْقُمَاشُ نَاعِمٌ وَخَفِيفٌ.","Kain ini lembut dan ringan."],["A2","1484","الْحَقِيبَةُ ثَقِيلَةٌ أَكْثَرَ مِمَّا تَوَقَّعْتُ.","Tas ini lebih berat daripada yang saya duga."],["A2","1485","هَذَا الْفِيلْمُ مُمِلٌّ جِدًّا.","Film ini sangat membosankan."],["A2","1486","كَانَ الِامْتِحَانُ أَسْهَلَ مِمَّا ظَنَنْتُ.","Ujiannya lebih mudah daripada yang saya kira."],["A2","1487","أَنْصَحُكَ أَنْ تَدْرُسَ كُلَّ يَوْمٍ.","Saya menyarankanmu belajar setiap hari."],["A2","1489","لَا تُؤَجِّلْ عَمَلَ الْيَوْمِ إِلَى غَدٍ.","Jangan menunda pekerjaan hari ini sampai besok."],["A2","1490","جَرِّبْ هَذَا الْمَطْعَمَ، سَيُعْجِبُكَ.","Cobalah restoran ini, kamu akan menyukainya."],["A2","1491","إِذَا كُنْتَ مُتْعَبًا فَنَمْ.","Jika kamu capek, tidurlah."],["A2","1492","اسْأَلْ مُعَلِّمَكَ إِذَا لَمْ تَفْهَمْ.","Tanyakan gurumu jika kamu tidak paham."],["A2","1493","احْرِصْ عَلَى وَقْتِكَ.","Jagalah waktumu."],["A2","1494","لَا تَقْلَقْ كَثِيرًا مِنَ الْأَخْطَاءِ.","Jangan terlalu khawatir soal kesalahan."],["A2","1495","تَذَكَّرْ أَنْ تَشْرَبَ مَاءً.","Ingatlah untuk minum air."],["A2","1496","أَقْتَرِحُ أَنْ نُسَافِرَ فِي الرَّبِيعِ.","Saya usul kita bepergian di musim semi."],["A2","1497","مَاذَا تَنْصَحُنِي أَنْ أَفْعَلَ؟","Apa yang kamu sarankan untuk saya lakukan?"],["A2","1498","ابْدَأْ بِالْأَسْهَلِ ثُمَّ تَدَرَّجْ.","Mulailah dari yang termudah lalu bertahap."],["A2","1499","اعْتَمِدْ عَلَى نَفْسِكَ.","Andalkan dirimu sendiri."],["A2","1500","اللهُ يُوَفِّقُكَ فِي كُلِّ خُطْوَةٍ.","Semoga Allah memberimu taufik di setiap langkah."],["B1","1501","فِي رَأْيِي، التَّعَلُّمُ مِنَ الْأَخْطَاءِ أَهَمُّ مِنْ تَجَنُّبِهَا.","Menurut saya, belajar dari kesalahan lebih penting daripada menghindarinya."],["B1","1502","أَعْتَقِدُ أَنَّ السَّفَرَ يُوَسِّعُ الْآفَاقَ.","Saya yakin bepergian memperluas wawasan."],["B1","1503","لَا أَرَى مُبَرِّرًا لِلتَّأْخِيرِ فِي مِثْلِ هَذِهِ الْمَوَاعِيدِ.","Saya tidak melihat alasan untuk terlambat pada janji seperti ini."],["B1","1504","مِنْ وِجْهَةِ نَظَرِي، الْحَلُّ الْأَوَّلُ أَكْثَرُ وَاقِعِيَّةً.","Dari sudut pandang saya, solusi pertama lebih realistis."],["B1","1505","يُمْكِنُنِي أَنْ أَتَفَهَّمَ رَأْيَكَ، لَكِنَّنِي لَا أُوَافِقُكَ.","Saya bisa memahami pendapatmu, tapi saya tidak setuju."],["B1","1506","أَرَى أَنَّ الْمُشْكِلَةَ لَيْسَتْ فِي الْمَالِ بَلْ فِي التَّنْظِيمِ.","Saya pikir masalahnya bukan di uang melainkan di pengaturan."],["B1","1507","مِنَ الْوَاضِحِ أَنَّ الْوَقْتَ لَا يَكْفِي.","Jelas bahwa waktunya tidak cukup."],["B1","1508","أَنَا مَعَ هَذِهِ الْفِكْرَةِ بِشَرْطٍ وَاحِدٍ.","Saya mendukung ide ini dengan satu syarat."],["B1","1509","لَيْسَ مِنَ الْعَدْلِ أَنْ نَحْكُمَ عَلَيْهِ قَبْلَ أَنْ نَسْمَعَهُ.","Tidak adil menghakiminya sebelum kita mendengarnya."],["B1","1510","هَذِهِ النُّقْطَةُ تَحْتَاجُ إِلَى مَزِيدٍ مِنَ النِّقَاشِ.","Poin ini perlu dibahas lebih lanjut."],["B1","1511","أُفَضِّلُ أَنْ أَتَّخِذَ قَرَارِي بَعْدَ التَّفْكِيرِ الْجَيِّدِ.","Saya lebih suka mengambil keputusan setelah berpikir baik-baik."],["B1","1513","أَنَا لَسْتُ مُتَأَكِّدًا مِنْ صِحَّةِ هَذِهِ الْمَعْلُومَةِ.","Saya tidak yakin akan kebenaran informasi ini."],["B1","1514","رُبَّمَا كُنْتَ مُحِقًّا فِي ذَلِكَ.","Mungkin kamu benar soal itu."],["B1","1515","هَذَا لَا يَعْنِي أَنَّهُ خَطَأٌ بِالضَّرُورَةِ.","Itu belum tentu berarti salah."],["B1","1516","الْأَمْرُ يَعْتَمِدُ عَلَى الظُّرُوفِ.","Itu tergantung keadaan."],["B1","1517","أَعْتَقِدُ أَنَّ الْجَمِيعَ يَسْتَحِقُّ فُرْصَةً ثَانِيَةً.","Saya yakin semua orang berhak mendapat kesempatan kedua."],["B1","1518","مِنَ الصَّعْبِ أَنْ أَحْكُمَ قَبْلَ أَنْ أُجَرِّبَ بِنَفْسِي.","Sulit bagi saya menilai sebelum mencoba sendiri."],["B1","1519","صَحِيحٌ أَنَّهُ غَالٍ، لَكِنَّهُ يَسْتَحِقُّ ذَلِكَ.","Memang mahal, tapi pantas dengan harganya."],["B1","1520","لَا أَظُنُّ أَنَّ هَذَا هُوَ الْوَقْتُ الْمُنَاسِبُ.","Saya kira ini bukan waktu yang tepat."],["B1","1521","أَتَّفِقُ مَعَكَ فِي الْجُزْءِ الْأَوَّلِ فَقَطْ.","Saya sependapat denganmu hanya pada bagian pertama."],["B1","1522","فِي النِّهَايَةِ، الْقَرَارُ قَرَارُكَ.","Pada akhirnya, keputusan ada di tanganmu."],["B1","1523","تَأَخَّرْتُ لِأَنَّ الطَّرِيقَ كَانَ مُغْلَقًا بِسَبَبِ حَادِثٍ.","Saya terlambat karena jalan ditutup akibat kecelakaan."],["B1","1524","نَتِيجَةً لِذَلِكَ، أُلْغِيَتِ الرِّحْلَةُ.","Akibatnya, perjalanan dibatalkan."],["B1","1525","لِهَذَا السَّبَبِ قَرَّرْتُ أَنْ أَبْقَى.","Karena alasan itu saya memutuskan untuk tinggal."],["B1","1526","كَيْ أَنْجَحَ يَجِبُ أَنْ أَعْمَلَ بِجِدٍّ.","Agar berhasil, saya harus bekerja keras."],["B1","1527","دَرَسْتُ كَثِيرًا حَتَّى أَنْجَحَ فِي الِامْتِحَانِ.","Saya belajar banyak sampai lulus ujian."],["B1","1528","بِسَبَبِ الْمَطَرِ لَمْ نَسْتَطِعِ الْخُرُوجَ.","Karena hujan, kami tidak bisa keluar."],["B1","1529","لَوْلَا مُسَاعَدَتُكَ لَمَا أَنْهَيْتُ الْعَمَلَ.","Kalau bukan karena bantuanmu, saya tidak akan menyelesaikan pekerjaan."],["B1","1533","مَعَ أَنَّ الْجَوَّ سَيِّئٌ، سَنَذْهَبُ.","Meskipun cuacanya buruk, kami akan pergi."],["B1","1534","رَغْمَ التَّعَبِ، وَاصَلْتُ الْعَمَلَ.","Meski capek, saya terus bekerja."],["B1","1536","فَهِمْتُ الْآنَ لِمَاذَا غَضِبَ.","Sekarang saya mengerti kenapa dia marah."],["B1","1537","السَّبَبُ الرَّئِيسِيُّ هُوَ قِلَّةُ الْخِبْرَةِ.","Penyebab utamanya adalah kurangnya pengalaman."],["B1","1538","هَذَا يُفَسِّرُ لِمَاذَا تَأَخَّرَ.","Ini menjelaskan kenapa dia terlambat."],["B1","1539","نَتَجَ عَنْ ذَلِكَ مُشْكِلَةٌ كَبِيرَةٌ.","Akibat itu muncul masalah besar."],["B1","1540","لِذَلِكَ يَجِبُ أَنْ نَكُونَ حَذِرِينَ.","Karena itu kita harus berhati-hati."],["B1","1541","فَقَطْ لِأَنَّهُ صَغِيرٌ لَا يَعْنِي أَنَّهُ لَا يَفْهَمُ.","Hanya karena dia kecil bukan berarti dia tidak paham."],["B1","1542","عَلَى الرَّغْمِ مِنْ كُلِّ شَيْءٍ، أَنَا مُتَفَائِلٌ.","Terlepas dari segalanya, saya optimis."],["B1","1543","مَرَرْتُ بِتَجْرِبَةٍ لَنْ أَنْسَاهَا.","Saya mengalami pengalaman yang tidak akan saya lupakan."],["B1","1544","تَعَلَّمْتُ مِنْ هَذِهِ التَّجْرِبَةِ دَرْسًا مُهِمًّا.","Saya belajar pelajaran penting dari pengalaman ini."],["B1","1545","عِنْدَمَا انْتَقَلْتُ إِلَى بَلَدٍ جَدِيدٍ شَعَرْتُ بِالْغُرْبَةِ.","Ketika pindah ke negara baru, saya merasa asing."],["B1","1546","اسْتَغْرَقَ الْأَمْرُ مِنِّي شَهْرًا حَتَّى اعْتَدْتُ عَلَيْهِ.","Saya butuh sebulan sampai terbiasa."],["B1","1547","لَقَدْ مَرَّتْ عَلَيَّ لَحَظَاتٌ صَعْبَةٌ لَكِنَّهَا عَلَّمَتْنِي الصَّبْرَ.","Saya melewati saat-saat sulit, tapi itu mengajarkan saya kesabaran."],["B1","1548","كُنْتُ أَظُنُّ أَنَّ الْأَمْرَ سَهْلٌ، لَكِنَّنِي كُنْتُ مُخْطِئًا.","Saya kira mudah, tapi ternyata saya keliru."],["B1","1549","لَمْ أَتَوَقَّعْ أَنْ تَكُونَ الرِّحْلَةُ بِهَذَا الْجَمَالِ.","Saya tidak menyangka perjalanannya seindah ini."],["B1","1550","أَوَّلُ مَرَّةٍ سَافَرْتُ فِيهَا وَحْدِي كَانَتْ مُخِيفَةً.","Pertama kali saya bepergian sendirian itu menakutkan."],["B1","1551","تَعَرَّفْتُ هُنَاكَ عَلَى أَشْخَاصٍ مِنْ ثَقَافَاتٍ مُخْتَلِفَةٍ.","Di sana saya berkenalan dengan orang dari budaya berbeda."],["B1","1552","فَاتَتْنِي فُرْصَةٌ جَيِّدَةٌ لِأَنِّي تَرَدَّدْتُ.","Saya kehilangan kesempatan bagus karena ragu."],["B1","1553","نَدِمْتُ عَلَى مَا قُلْتُهُ.","Saya menyesali apa yang saya katakan."],["B1","1554","أَنَا فَخُورٌ بِمَا حَقَّقْتُهُ حَتَّى الْآنَ.","Saya bangga dengan apa yang telah saya capai sejauh ini."],["B1","1555","لَوْ عَادَ بِيَ الزَّمَنُ لَفَعَلْتُ الشَّيْءَ نَفْسَهُ.","Andai waktu bisa diputar, saya akan melakukan hal yang sama."],["B1","1556","سَبَقَ أَنْ عَمِلْتُ فِي مَجَالٍ مُشَابِهٍ.","Saya pernah bekerja di bidang yang serupa."],["B1","1557","لَمْ يَسْبِقْ لِي أَنْ جَرَّبْتُ هَذَا الطَّعَامَ.","Saya belum pernah mencoba makanan ini."],["B1","1558","مُنْذُ أَنْ بَدَأْتُ الدِّرَاسَةَ وَأَنَا أَتَحَسَّنُ.","Sejak mulai belajar, saya terus membaik."],["B1","1559","كُنْتُ قَدْ نَسِيتُ الْمَوْضُوعَ تَمَامًا.","Saya sudah benar-benar lupa soal itu."],["B1","1560","بَعْدَ سَنَوَاتٍ مِنَ الْعَمَلِ قَرَّرْتُ أَنْ أُغَيِّرَ مَسَارِي.","Setelah bertahun-tahun bekerja, saya memutuskan mengubah jalur karier."],["B1","1561","كَانَتْ تِلْكَ أَفْضَلَ قَرَارَاتِي.","Itu keputusan terbaik saya."],["B1","1562","شَاهَدْتُ شُرُوقَ الشَّمْسِ مِنْ قِمَّةِ الْجَبَلِ.","Saya menyaksikan matahari terbit dari puncak gunung."],["B1","1563","تَعَلَّمْتُ أَنْ أَعْتَمِدَ عَلَى نَفْسِي.","Saya belajar mengandalkan diri sendiri."],["B1","1564","مَا زَالَتْ تِلْكَ الذِّكْرَى حَيَّةً فِي ذَاكِرَتِي.","Kenangan itu masih hidup dalam ingatan saya."],["B1","1565","هَدَفِي أَنْ أُتْقِنَ الْعَرَبِيَّةَ خِلَالَ سَنَتَيْنِ.","Tujuan saya menguasai bahasa Arab dalam dua tahun."],["B1","1566","أُخَطِّطُ لِأَنْ أَدْرُسَ فِي الْخَارِجِ بَعْدَ التَّخَرُّجِ.","Saya berencana kuliah di luar negeri setelah lulus."],["B1","1567","سَأَبْذُلُ قُصَارَى جُهْدِي لِتَحْقِيقِ حُلْمِي.","Saya akan mengerahkan upaya terbaik untuk mewujudkan mimpi saya."],["B1","1568","أَحْلُمُ بِأَنْ أَفْتَحَ مَشْرُوعِي الْخَاصَّ.","Saya bermimpi membuka usaha sendiri."],["B1","1569","أُرِيدُ أَنْ أَدَّخِرَ مَبْلَغًا يَكْفِي لِلسَّفَرِ.","Saya ingin menabung cukup uang untuk bepergian."],["B1","1570","إِنْ شَاءَ اللهُ سَأَحُجُّ هَذَا الْعَامَ.","Insyaallah saya akan berhaji tahun ini."],["B1","1571","قَرَّرْتُ أَنْ أُمَارِسَ الرِّيَاضَةَ بِانْتِظَامٍ.","Saya memutuskan berolahraga secara teratur."],["B1","1572","سَأَبْدَأُ مِنَ الْغَدِ لَا مِنَ الْأُسْبُوعِ الْقَادِمِ.","Saya akan mulai dari besok, bukan minggu depan."],["B1","1573","عَلَيَّ أَنْ أُحَدِّدَ أَوْلَوِيَّاتِي.","Saya harus menentukan prioritas."],["B1","1574","أَضَعُ خُطَّةً لِلْأَشْهُرِ الْقَادِمَةِ.","Saya menyusun rencana untuk bulan-bulan mendatang."],["B1","1575","لَا بُدَّ أَنْ أَتَعَلَّمَ مَهَارَاتٍ جَدِيدَةً.","Saya harus mempelajari keterampilan baru."],["B1","1576","أَطْمَحُ إِلَى مَنْصِبٍ أَعْلَى فِي شَرِكَتِي.","Saya mengincar posisi yang lebih tinggi di perusahaan saya."],["B1","1577","بَعْدَ خَمْسِ سَنَوَاتٍ أَرَى نَفْسِي مُدِيرًا.","Lima tahun lagi saya melihat diri saya sebagai manajer."],["B1","1578","إِذَا سَارَتِ الْأُمُورُ كَمَا خَطَّطْنَا فَسَنَفْتَتِحُ الْفَرْعَ قَرِيبًا.","Jika semuanya berjalan sesuai rencana, kami akan segera membuka cabang."],["B1","1579","مِنَ الْمُهِمِّ أَنْ أُحَافِظَ عَلَى حَمَاسِي.","Penting bagi saya menjaga semangat."],["B1","1580","لَنْ أَسْتَسْلِمَ مَهْمَا كَانَتِ الصُّعُوبَاتُ.","Saya tidak akan menyerah, apa pun kesulitannya."],["B1","1581","أَنَا أَسْعَى إِلَى حَيَاةٍ أَكْثَرَ تَوَازُنًا.","Saya berusaha mencapai hidup yang lebih seimbang."],["B1","1582","سَأُخَصِّصُ سَاعَةً يَوْمِيًّا لِلْقِرَاءَةِ.","Saya akan menyediakan satu jam setiap hari untuk membaca."],["B1","1583","عِنْدَمَا أَتَقَاعَدُ سَأَسْتَقِرُّ فِي قَرْيَةٍ هَادِئَةٍ.","Ketika pensiun saya akan menetap di desa yang tenang."],["B1","1584","أَتَمَنَّى أَنْ أَرَى الْعَالَمَ كُلَّهُ.","Saya berharap bisa melihat seluruh dunia."],["B1","1585","تَقَدَّمْتُ لِوَظِيفَةٍ مُنَاسِبَةٍ لِمُؤَهِّلَاتِي.","Saya melamar pekerjaan yang sesuai kualifikasi saya."],["B1","1586","أُرْفِقُ مَعَ هَذَا الْبَرِيدِ سِيرَتِي الذَّاتِيَّةَ.","Saya lampirkan CV saya bersama email ini."],["B1","1587","دُعِيتُ إِلَى مُقَابَلَةٍ شَخْصِيَّةٍ يَوْمَ الثُّلَاثَاءِ.","Saya dipanggil wawancara hari Selasa."],["B1","1588","سَأَلُونِي عَنْ خِبْرَتِي وَعَنْ أَهْدَافِي.","Mereka menanyakan pengalaman dan tujuan saya."],["B1","1589","أُجِيدُ الْعَمَلَ تَحْتَ الضَّغْطِ.","Saya mahir bekerja di bawah tekanan."],["B1","1590","أَتَعَامَلُ مَعَ الْعُمَلَاءِ بِاحْتِرَافٍ.","Saya melayani pelanggan secara profesional."],["B1","1591","قَدْ نَحْتَاجُ إِلَى مَزِيدٍ مِنَ الْمَوَارِدِ لِلْمَشْرُوعِ.","Kita mungkin butuh lebih banyak sumber daya untuk proyek."],["B1","1592","لَدَيَّ خِبْرَةٌ فِي إِدَارَةِ الْفَرِيقِ.","Saya punya pengalaman mengelola tim."],["B1","1593","تَمَّتْ تَرْقِيَتِي إِلَى رَئِيسِ قِسْمٍ.","Saya dipromosikan menjadi kepala bagian."],["B1","1594","اتَّفَقْنَا عَلَى شُرُوطِ الْعَقْدِ.","Kami sepakat soal ketentuan kontrak."],["B1","1595","أَعْمَلُ بِدَوَامٍ كَامِلٍ وَأَدْرُسُ مَسَاءً.","Saya bekerja penuh waktu dan kuliah di malam hari."],["B1","1596","أَبْحَثُ عَنْ تَوَازُنٍ بَيْنَ الْعَمَلِ وَالْحَيَاةِ.","Saya mencari keseimbangan antara kerja dan kehidupan."],["B1","1597","تَأَخَّرَ تَسْلِيمُ الْمَشْرُوعِ بِسَبَبِ نَقْصِ الْمَعْلُومَاتِ.","Penyerahan proyek tertunda karena kurang informasi."],["B1","1598","أَرْجُو أَنْ تَتَفَضَّلُوا بِمُرَاجَعَةِ الْمُلْحَقِ.","Mohon berkenan memeriksa lampiran."],["B1","1599","نَحْنُ بِحَاجَةٍ إِلَى اجْتِمَاعٍ عَاجِلٍ.","Kami perlu rapat mendesak."],["B1","1600","قَدَّمْتُ اسْتِقَالَتِي لِأَسْبَابٍ شَخْصِيَّةٍ.","Saya mengajukan pengunduran diri karena alasan pribadi."],["B1","1601","هَذِهِ الشَّرِكَةُ تُقَدِّرُ مُوَظَّفِيهَا.","Perusahaan ini menghargai karyawannya."],["B1","1602","تَعَلَّمْتُ كَيْفَ أُدِيرُ وَقْتِي بِفَاعِلِيَّةٍ.","Saya belajar mengelola waktu secara efektif."],["B1","1603","أَحْتَاجُ إِلَى تَدْرِيبٍ إِضَافِيٍّ عَلَى هَذَا الْبَرْنَامَجِ.","Saya butuh pelatihan tambahan untuk program ini."],["B1","1604","نَاقَشَ الْفَرِيقُ الْمَشَاكِلَ وَاقْتَرَحَ حُلُولًا.","Tim membahas masalah dan mengusulkan solusi."],["B1","1605","أَسْتَخْدِمُ تَطْبِيقَاتٍ لِحِفْظِ الْمُفْرَدَاتِ.","Saya memakai aplikasi untuk menghafal kosakata."],["B1","1606","أَجِدُ صُعُوبَةً فِي نُطْقِ بَعْضِ الْحُرُوفِ.","Saya kesulitan melafalkan beberapa huruf."],["B1","1607","يُسَاعِدُنِي الِاسْتِمَاعُ إِلَى الْأَخْبَارِ عَلَى تَحْسِينِ فَهْمِي.","Mendengarkan berita membantu meningkatkan pemahaman saya."],["B1","1608","الْمُمَارَسَةُ الْمُسْتَمِرَّةُ هِيَ سِرُّ التَّقَدُّمِ.","Latihan terus-menerus adalah rahasia kemajuan."],["B1","1609","أُفَضِّلُ الدِّرَاسَةَ فِي مَجْمُوعَاتٍ صَغِيرَةٍ.","Saya lebih suka belajar dalam kelompok kecil."],["B1","1610","تَحَدَّثْنَا عَنْ أَفْضَلِ طَرِيقَةٍ لِلْمُذَاكَرَةِ.","Kami berdiskusi tentang cara belajar terbaik."],["B1","1611","قَدَّمْتُ عَرْضًا أَمَامَ الصَّفِّ بِالْعَرَبِيَّةِ.","Saya presentasi di depan kelas dalam bahasa Arab."],["B1","1612","كُنْتُ مُتَوَتِّرًا فِي الْبِدَايَةِ ثُمَّ هَدَأْتُ.","Awalnya saya gugup lalu menjadi tenang."],["B1","1613","يَجِبُ أَنْ نَقْرَأَ أَكْثَرَ لِنُوَسِّعَ مُفْرَدَاتِنَا.","Kita harus lebih banyak membaca untuk memperluas kosakata."],["B1","1614","لَا يُمْكِنُ إِتْقَانُ لُغَةٍ دُونَ مُمَارَسَتِهَا.","Tidak mungkin menguasai bahasa tanpa mempraktikkannya."],["B1","1615","تَعَلَّمْتُ قَوَاعِدَ كَثِيرَةً لَكِنَّنِي مَا زِلْتُ أُخْطِئُ.","Saya belajar banyak kaidah tapi masih sering salah."],["B1","1616","الْأَخْطَاءُ جُزْءٌ طَبِيعِيٌّ مِنَ التَّعَلُّمِ.","Kesalahan adalah bagian alami dari belajar."],["B1","1617","أُرَاجِعُ مَا تَعَلَّمْتُهُ قَبْلَ أَنْ أَنَامَ.","Saya mengulang apa yang saya pelajari sebelum tidur."],["B1","1618","دَوَّنْتُ الْمُلَاحَظَاتِ بِعِنَايَةٍ.","Saya mencatat dengan cermat."],["B1","1619","سَجَّلْتُ فِي دَوْرَةٍ لِلْكِتَابَةِ الْعَرَبِيَّةِ.","Saya mendaftar kursus menulis bahasa Arab."],["B1","1620","أَطْمَحُ إِلَى اجْتِيَازِ اخْتِبَارِ الْكَفَاءَةِ.","Saya bertekad lulus tes kemahiran."],["B1","1621","حَجَزْنَا الرِّحْلَةَ قَبْلَ شَهْرَيْنِ بِسِعْرٍ مُخَفَّضٍ.","Kami memesan penerbangan dua bulan sebelumnya dengan harga diskon."],["B1","1622","أُلْغِيَتْ رِحْلَتُنَا بِسَبَبِ الْعَاصِفَةِ.","Penerbangan kami dibatalkan karena badai."],["B1","1623","أَيْنَ أَسْتَطِيعُ اسْتِرْجَاعَ ثَمَنِ التَّذْكِرَةِ؟","Di mana saya bisa mengurus pengembalian harga tiket?"],["B1","1624","وَصَلْنَا مُتَأَخِّرِينَ فَفَاتَتْنَا الرِّحْلَةُ.","Kami tiba terlambat sehingga ketinggalan penerbangan."],["B1","1625","يُمْكِنُكُمْ تَغْيِيرُ الْحَجْزِ مُقَابِلَ رُسُومٍ إِضَافِيَّةٍ.","Anda bisa mengubah pemesanan dengan biaya tambahan."],["B1","1626","زُرْنَا الْمَعَالِمَ الْأَثَرِيَّةَ فِي الْمَدِينَةِ الْقَدِيمَةِ.","Kami mengunjungi situs bersejarah di kota tua."],["B1","1627","اسْتَأْجَرْنَا سَيَّارَةً لِلتَّنَقُّلِ بَيْنَ الْمُدُنِ.","Kami menyewa mobil untuk berpindah antar kota."],["B1","1628","كَانَ الْمُرْشِدُ السِّيَاحِيُّ يَتَحَدَّثُ بِالْعَرَبِيَّةِ وَالْإِنْجْلِيزِيَّةِ.","Pemandu wisata berbicara bahasa Arab dan Inggris."],["B1","1629","تَذَوَّقْنَا أَطْعِمَةً مَحَلِّيَّةً لَمْ نَعْرِفْهَا مِنْ قَبْلُ.","Kami mencicipi makanan lokal yang belum pernah kami kenal."],["B1","1630","احْتَجْنَا إِلَى خَرِيطَةٍ لِأَنَّنَا ضِعْنَا.","Kami butuh peta karena tersesat."],["B1","1631","تَعَطَّلَتْ سَيَّارَتُنَا فِي مُنْتَصَفِ الطَّرِيقِ.","Mobil kami mogok di tengah jalan."],["B1","1632","أُفَضِّلُ أَنْ أَسْكُنَ فِي بَيْتٍ مَحَلِّيٍّ لَا فِي فُنْدُقٍ.","Saya lebih suka menginap di rumah warga daripada hotel."],["B1","1633","يَجِبُ احْتِرَامُ عَادَاتِ الْبَلَدِ الَّذِي نَزُورُهُ.","Kita harus menghormati adat negara yang kita kunjungi."],["B1","1634","لَا تَنْسَ أَنْ تُحَدِّثَ بَيَانَاتِ الْحَجْزِ.","Jangan lupa memperbarui data pemesanan."],["B1","1635","تَفَقَّدْنَا أَمْتِعَتَنَا قَبْلَ الْمُغَادَرَةِ.","Kami memeriksa bagasi sebelum berangkat."],["B1","1636","كَانَتِ الرِّحْلَةُ أَطْوَلَ مِمَّا تَوَقَّعْنَا.","Perjalanannya lebih panjang daripada yang kami duga."],["B1","1637","اسْتَمْتَعْنَا بِالْمَنْظَرِ مِنْ نَافِذَةِ الْقِطَارِ.","Kami menikmati pemandangan dari jendela kereta."],["B1","1638","أَوْصَيْتُ أَصْدِقَائِي بِزِيَارَةِ هَذَا الْمَكَانِ.","Saya menyarankan teman-teman mengunjungi tempat ini."],["B1","1639","لِلْأَسَفِ، لَمْ يَكُنْ لَدَيْنَا وَقْتٌ كَافٍ.","Sayangnya, kami tidak punya cukup waktu."],["B1","1640","سَنَعُودُ إِلَى هُنَا يَوْمًا مَا.","Suatu hari kami akan kembali ke sini."],["B1","1641","أُحَاوِلُ أَنْ أَتَجَنَّبَ السُّكَّرِيَّاتِ.","Saya berusaha menghindari makanan manis."],["B1","1642","الْعِنَايَةُ بِالنَّوْمِ جُزْءٌ مِنَ الصِّحَّةِ.","Menjaga tidur adalah bagian dari kesehatan."],["B1","1643","يَنْصَحُ الْأَطِبَّاءُ بِالْمَشْيِ ثَلَاثِينَ دَقِيقَةً يَوْمِيًّا.","Dokter menyarankan berjalan tiga puluh menit setiap hari."],["B1","1644","أَشْعُرُ بِالتَّوَتُّرِ عِنْدَمَا أَقْتَرِبُ مِنَ الْمَوَاعِيدِ النِّهَائِيَّةِ.","Saya merasa tegang ketika mendekati tenggat."],["B1","1645","تَعَلَّمْتُ طُرُقًا لِلتَّخَلُّصِ مِنَ الْقَلَقِ.","Saya belajar cara mengatasi kecemasan."],["B1","1646","يُسَاعِدُنِي التَّأَمُّلُ عَلَى الِاسْتِرْخَاءِ.","Meditasi membantu saya rileks."],["B1","1647","يَجِبُ أَلَّا نُهْمِلَ الْفُحُوصَاتِ الدَّوْرِيَّةَ.","Kita tidak boleh mengabaikan pemeriksaan rutin."],["B1","1648","أُعَانِي مِنْ آلَامِ الظَّهْرِ بِسَبَبِ الْجُلُوسِ الطَّوِيلِ.","Saya menderita sakit punggung karena duduk lama."],["B1","1649","نَصَحَنِي الطَّبِيبُ بِتَقْلِيلِ الْمِلْحِ.","Dokter menyarankan saya mengurangi garam."],["B1","1650","الْغِذَاءُ الصِّحِّيُّ لَا يَعْنِي الْحِرْمَانَ.","Makanan sehat bukan berarti menahan diri."],["B1","1652","أَشْعُرُ بِفَرْقٍ كَبِيرٍ بَعْدَ أَنْ بَدَأْتُ بِالرَّكْضِ.","Saya merasakan perbedaan besar setelah mulai berlari."],["B1","1653","مِنَ الضَّرُورِيِّ أَنْ نَسْتَرِيحَ بَيْنَ التَّمَارِينِ.","Penting untuk istirahat di antara latihan."],["B1","1654","لَا يَنْبَغِي تَنَاوُلُ الدَّوَاءِ دُونَ وَصْفَةٍ.","Tidak seharusnya minum obat tanpa resep."],["B1","1655","أَتَنَاوَلُ الْفِيتَامِينَاتِ بِانْتِظَامٍ.","Saya mengonsumsi vitamin secara teratur."],["B1","1656","يَتَحَسَّنُ مِزَاجِي عِنْدَمَا أَقْضِي وَقْتًا فِي الطَّبِيعَةِ.","Suasana hati saya membaik ketika saya menghabiskan waktu di alam."],["B1","1657","أَصْبَحَتِ التِّكْنُولُوجْيَا جُزْءًا مِنْ حَيَاتِنَا الْيَوْمِيَّةِ.","Teknologi telah menjadi bagian dari kehidupan sehari-hari kita."],["B1","1658","أَقْضِي سَاعَاتٍ طَوِيلَةً أَمَامَ الشَّاشَةِ.","Saya menghabiskan berjam-jam di depan layar."],["B1","1659","يَجِبُ أَنْ نَحْمِيَ بَيَانَاتِنَا الشَّخْصِيَّةَ.","Kita harus melindungi data pribadi kita."],["B1","1660","لَا تُشَارِكْ كَلِمَةَ الْمُرُورِ مَعَ أَحَدٍ.","Jangan bagikan kata sandi kepada siapa pun."],["B1","1661","وَصَلَتْنِي رِسَالَةٌ مَشْبُوهَةٌ مِنْ رَقْمٍ غَيْرِ مَعْرُوفٍ.","Saya menerima pesan mencurigakan dari nomor tak dikenal."],["B1","1662","قُمْتُ بِتَحْدِيثِ الْبَرْنَامَجِ إِلَى الْإِصْدَارِ الْأَخِيرِ.","Saya memperbarui program ke versi terbaru."],["B1","1663","الْإِنْتَرْنِتُ سَهَّلَ التَّوَاصُلَ لَكِنَّهُ قَلَّلَ اللِّقَاءَاتِ الْحَقِيقِيَّةَ.","Internet mempermudah komunikasi tapi mengurangi pertemuan nyata."],["B1","1664","أُفَضِّلُ الِاتِّصَالَ الْهَاتِفِيَّ عَلَى الرَّسَائِلِ الْمَكْتُوبَةِ.","Saya lebih suka telepon daripada pesan tertulis."],["B1","1665","احْتَفَظْتُ بِنُسْخَةٍ احْتِيَاطِيَّةٍ مِنْ مِلَفَّاتِي.","Saya menyimpan salinan cadangan berkas saya."],["B1","1666","كَثْرَةُ الْإِشْعَارَاتِ تُشَتِّتُ انْتِبَاهِي.","Banyaknya notifikasi mengganggu konsentrasi saya."],["B1","1667","قَرَّرْتُ أَنْ أُطْفِئَ الْهَاتِفَ سَاعَةً قَبْلَ النَّوْمِ.","Saya memutuskan mematikan ponsel satu jam sebelum tidur."],["B1","1668","هَذَا الْخَبَرُ انْتَشَرَ بِسُرْعَةٍ عَلَى وَسَائِلِ التَّوَاصُلِ.","Berita ini menyebar cepat di media sosial."],["B1","1669","يَنْبَغِي أَنْ نَتَحَقَّقَ مِنَ الْأَخْبَارِ قَبْلَ نَشْرِهَا.","Kita seharusnya memverifikasi berita sebelum menyebarkannya."],["B1","1670","تَعَلَّمْتُ اسْتِخْدَامَ بَرْنَامَجٍ جَدِيدٍ لِلتَّصْمِيمِ.","Saya belajar memakai program desain baru."],["B1","1671","تَوَقَّفَ الْجِهَازُ عَنِ الْعَمَلِ فَجْأَةً.","Perangkat tiba-tiba berhenti bekerja."],["B1","1672","جَرَّبْتُ إِعَادَةَ التَّشْغِيلِ لَكِنْ دُونَ جَدْوَى.","Saya coba menyalakan ulang tapi tidak berhasil."],["B1","1673","يَخْتَلِفُ مَفْهُومُ الْوَقْتِ مِنْ ثَقَافَةٍ إِلَى أُخْرَى.","Konsep waktu berbeda dari satu budaya ke budaya lain."],["B1","1674","تَعَلَّمْتُ كَثِيرًا عَنِ التَّقَالِيدِ الْعَرَبِيَّةِ.","Saya belajar banyak tentang tradisi Arab."],["B1","1675","الْكَرَمُ مِنْ أَبْرَزِ صِفَاتِ الْعَرَبِ.","Kemurahan hati adalah salah satu sifat menonjol orang Arab."],["B1","1676","تُولِي الْمُجْتَمَعَاتُ الْعَرَبِيَّةُ اهْتِمَامًا كَبِيرًا بِالْأُسْرَةِ.","Masyarakat Arab sangat memperhatikan keluarga."],["B1","1677","مِنَ الْمُهِمِّ احْتِرَامُ كِبَارِ السِّنِّ.","Penting menghormati orang yang lebih tua."],["B1","1679","أَدْهَشَنِي التَّنَوُّعُ الثَّقَافِيُّ فِي هَذِهِ الْمَدِينَةِ.","Keragaman budaya di kota ini membuat saya takjub."],["B1","1680","تَحْتَفِلُ كُلُّ مِنْطَقَةٍ بِالْأَعْيَادِ بِطَرِيقَتِهَا.","Setiap daerah merayakan hari raya dengan caranya sendiri."],["B1","1681","اللُّغَةُ تَعْكِسُ ثَقَافَةَ أَهْلِهَا.","Bahasa mencerminkan budaya penuturnya."],["B1","1682","هَذَا الْمَثَلُ يُسْتَخْدَمُ كَثِيرًا فِي حَيَاتِنَا.","Peribahasa ini sering dipakai dalam kehidupan kita."],["B1","1683","لَا يَجُوزُ أَنْ نَحْكُمَ عَلَى النَّاسِ مِنْ مَظْهَرِهِمْ.","Tidak boleh menilai orang dari penampilannya."],["B1","1684","الْعَمَلُ التَّطَوُّعِيُّ يُقَوِّي الرَّوَابِطَ بَيْنَ النَّاسِ.","Kegiatan sukarela memperkuat ikatan antarmanusia."],["B1","1685","شَارَكْتُ فِي حَمْلَةٍ لِتَنْظِيفِ الشَّاطِئِ.","Saya ikut kampanye membersihkan pantai."],["B1","1686","يَحْتَاجُ الْمُجْتَمَعُ إِلَى التَّعَاوُنِ بَيْنَ أَفْرَادِهِ.","Masyarakat butuh kerja sama antaranggotanya."],["B1","1687","لِكُلِّ بَلَدٍ آدَابٌ خَاصَّةٌ فِي الضِّيَافَةِ.","Setiap negara punya tata krama tersendiri dalam menerima tamu."],["B1","1688","الشَّبَابُ الْيَوْمَ يَتَأَثَّرُونَ بِوَسَائِلِ الْإِعْلَامِ.","Anak muda sekarang dipengaruhi media."],["B1","1689","الْمُحَافَظَةُ عَلَى التُّرَاثِ مَسْؤُولِيَّةُ الْجَمِيعِ.","Menjaga warisan budaya adalah tanggung jawab semua orang."],["B1","1690","زُرْتُ مَتْحَفًا يَعْرِضُ تَارِيخَ الْمِنْطَقَةِ.","Saya mengunjungi museum yang memamerkan sejarah daerah itu."],["B1","1691","الصَّدَاقَةُ تَحْتَاجُ إِلَى وَقْتٍ وَاهْتِمَامٍ.","Persahabatan butuh waktu dan perhatian."],["B1","1693","كُنْتُ حَزِينًا لِأَنَّ صَدِيقِي سَافَرَ بَعِيدًا.","Saya sedih karena teman saya pergi jauh."],["B1","1694","تَشَاجَرْنَا ثُمَّ تَصَالَحْنَا بَعْدَ يَوْمَيْنِ.","Kami bertengkar lalu berdamai dua hari kemudian."],["B1","1695","لَا أُحِبُّ أَنْ أَرَى أَحَدًا يَتَأَلَّمُ.","Saya tidak suka melihat orang kesakitan."],["B1","1696","أَشْعُرُ بِالِامْتِنَانِ لِكُلِّ مَنْ سَاعَدَنِي.","Saya bersyukur kepada semua yang membantu saya."],["B1","1697","يُؤْلِمُنِي أَنْ أَرَاكَ بِهَذِهِ الْحَالِ.","Menyakitkan melihatmu dalam keadaan begini."],["B1","1698","أَنَا مُتَفَهِّمٌ لِظُرُوفِكَ تَمَامًا.","Saya benar-benar memahami keadaanmu."],["B1","1699","كَانَ مِنَ الصَّعْبِ أَنْ أُخْفِيَ فَرْحَتِي.","Sulit bagi saya menyembunyikan kegembiraan."],["B1","1700","لَا تَتَرَدَّدْ فِي طَلَبِ الْمُسَاعَدَةِ.","Jangan ragu meminta bantuan."],["B1","1701","أَثِقُ بِهِ لِأَنَّهُ لَمْ يَخُنِّي يَوْمًا.","Saya percaya padanya karena dia tidak pernah mengkhianati saya."],["B1","1702","الْحَيَاةُ أَجْمَلُ مَعَ الْأَصْدِقَاءِ الصَّادِقِينَ.","Hidup lebih indah dengan teman-teman yang tulus."],["B1","1703","شَعَرْتُ بِالْإِحْرَاجِ عِنْدَمَا ذَكَرُوا اسْمِي.","Saya merasa malu ketika mereka menyebut nama saya."],["B1","1704","أَرَدْتُ أَنْ أَعْتَذِرَ لَكِنَّنِي لَمْ أَجِدِ الْكَلِمَاتِ.","Saya ingin minta maaf tapi tidak menemukan kata-kata."],["B1","1705","يَسْعَدُنِي أَنْ أَسْمَعَ أَخْبَارَكَ السَّارَّةَ.","Saya senang mendengar kabar baikmu."],["B1","1706","تَحَدَّثْنَا طَوِيلًا عَنْ ذِكْرَيَاتِنَا الْقَدِيمَةِ.","Kami mengobrol lama tentang kenangan lama kami."],["B1","1707","أُقَدِّرُ صَرَاحَتَكَ مَعِي.","Saya menghargai kejujuranmu padaku."],["B1","1708","لَيْسَ كُلُّ مَا يُقَالُ يُصَدَّقُ.","Tidak semua yang dikatakan harus dipercaya."],["B1","1709","قَارَنْتُ بَيْنَ الْأَسْعَارِ قَبْلَ أَنْ أَشْتَرِيَ.","Saya membandingkan harga sebelum membeli."],["B1","1710","يُمْكِنُكَ الدَّفْعُ عَلَى أَقْسَاطٍ.","Anda bisa membayar dengan cicilan."],["B1","1711","لَدَيْنَا عَرْضٌ خَاصٌّ لِفَتْرَةٍ مَحْدُودَةٍ.","Kami punya penawaran khusus untuk waktu terbatas."],["B1","1712","أَنَا أُخَطِّطُ لِمِيزَانِيَّتِي كُلَّ شَهْرٍ.","Saya merencanakan anggaran setiap bulan."],["B1","1713","صَرَفْتُ أَكْثَرَ مِمَّا كُنْتُ أَنْوِي.","Saya mengeluarkan lebih dari yang saya niatkan."],["B1","1714","مِنَ الذَّكَاءِ أَنْ نَدَّخِرَ جُزْءًا مِنَ الدَّخْلِ.","Cerdas jika kita menabung sebagian pendapatan."],["B1","1715","الْأَسْعَارُ فِي هَذَا الْمَحَلِّ مُبَالَغٌ فِيهَا.","Harga di toko ini berlebihan."],["B1","1716","هَلْ هُنَاكَ إِمْكَانِيَّةٌ لِلتَّفَاوُضِ عَلَى السِّعْرِ؟","Apakah ada kemungkinan menawar harga?"],["B1","1717","اشْتَرَيْتُهُ لِأَنَّهُ يَدُومُ أَطْوَلَ.","Saya membelinya karena lebih awet."],["B1","1718","احْتَفِظْ بِالْإِيصَالِ فِي حَالِ أَرَدْتَ الْإِرْجَاعَ.","Simpan kwitansi kalau-kalau kamu ingin mengembalikan."],["B1","1719","الضَّرِيبَةُ مَشْمُولَةٌ فِي السِّعْرِ.","Pajak sudah termasuk dalam harga."],["B1","1720","يُفَضِّلُ كَثِيرُونَ الشِّرَاءَ مِنَ الْمَتَاجِرِ الْإِلِكْتْرُونِيَّةِ.","Banyak orang lebih suka berbelanja di toko online."],["B1","1721","قَبْلَ أَنْ تَشْتَرِيَ اقْرَأِ التَّقْيِيمَاتِ.","Sebelum membeli, bacalah ulasannya."],["B1","1722","أَشْعُرُ بِالنَّدَمِ بَعْدَ كُلِّ عَمَلِيَّةِ شِرَاءٍ مُتَسَرِّعَةٍ.","Saya menyesal setelah setiap pembelian yang terburu-buru."],["B1","1723","تَرْتَفِعُ الْأَسْعَارُ بِاسْتِمْرَارٍ وَالرَّوَاتِبُ ثَابِتَةٌ.","Harga naik terus sementara gaji tetap."],["B1","1724","نَحْتَاجُ إِلَى مُرَاجَعَةِ مَصَارِيفِنَا.","Kita perlu meninjau pengeluaran kita."],["B1","1725","الزِّحَامُ فِي الْمُدُنِ الْكَبِيرَةِ مُرْهِقٌ.","Kemacetan di kota besar melelahkan."],["B1","1726","أُفَضِّلُ اسْتِخْدَامَ وَسَائِلِ النَّقْلِ الْعَامِّ.","Saya lebih suka memakai transportasi umum."],["B1","1727","تَلَوُّثُ الْهَوَاءِ يُؤَثِّرُ عَلَى صِحَّتِنَا.","Polusi udara memengaruhi kesehatan kita."],["B1","1728","يَجِبُ أَنْ نُقَلِّلَ مِنِ اسْتِخْدَامِ الْبَلَاسْتِيكِ.","Kita harus mengurangi penggunaan plastik."],["B1","1729","زَرَعْنَا أَشْجَارًا فِي الْحَيِّ.","Kami menanam pohon di lingkungan kami."],["B1","1730","الْحَيَاةُ فِي الْقَرْيَةِ أَهْدَأُ لَكِنَّ الْخِدْمَاتِ أَقَلُّ.","Hidup di desa lebih tenang tapi layanannya lebih sedikit."],["B1","1731","بُنِيَ مَرْكَزٌ تِجَارِيٌّ جَدِيدٌ بِجَانِبِ الْجَامِعَةِ.","Sebuah pusat perbelanjaan baru dibangun di samping universitas."],["B1","1732","تُعَانِي الْمَدِينَةُ مِنْ نَقْصٍ فِي مَوَاقِفِ السَّيَّارَاتِ.","Kota ini kekurangan tempat parkir."],["B1","1733","أَصْبَحَ الْعَمَلُ عَنْ بُعْدٍ شَائِعًا.","Kerja jarak jauh menjadi hal umum."],["B1","1734","نُحَاوِلُ إِعَادَةَ تَدْوِيرِ النُّفَايَاتِ فِي الْبَيْتِ.","Kami berusaha mendaur ulang sampah di rumah."],["B1","1735","الْمَسَاحَاتُ الْخَضْرَاءُ ضَرُورِيَّةٌ لِلْمَدِينَةِ.","Ruang hijau penting bagi kota."],["B1","1736","ارْتَفَعَتْ تَكَالِيفُ السَّكَنِ بِشَكْلٍ كَبِيرٍ.","Biaya tempat tinggal naik drastis."],["B1","1737","يَسْتَهْلِكُ هَذَا الْجِهَازُ طَاقَةً أَقَلَّ.","Alat ini mengonsumsi energi lebih sedikit."],["B1","1738","نَحْنُ بِحَاجَةٍ إِلَى حُلُولٍ مُسْتَدَامَةٍ.","Kita butuh solusi berkelanjutan."],["B1","1739","يُشَرِّفُنِي أَنْ أَدْعُوَكُمْ إِلَى حَفْلِ الِافْتِتَاحِ.","Saya merasa terhormat mengundang Anda ke acara pembukaan."],["B1","1740","نَشْكُرُكُمْ عَلَى حُضُورِكُمْ وَمُشَارَكَتِكُمْ.","Kami berterima kasih atas kehadiran dan partisipasi Anda."],["B1","1741","أَعْتَذِرُ عَنْ عَدَمِ تَمَكُّنِي مِنَ الْحُضُورِ.","Mohon maaf saya tidak dapat hadir."],["B1","1742","يَسْعَدُنَا أَنْ نَسْتَقْبِلَكُمْ فِي أَيِّ وَقْتٍ.","Kami senang menyambut Anda kapan saja."],["B1","1743","مَعَ أَطْيَبِ التَّمَنِّيَاتِ لَكُمْ بِالتَّوْفِيقِ.","Dengan harapan terbaik agar Anda sukses."],["B1","1744","نَأْمُلُ أَنْ تَكُونُوا بِخَيْرٍ وَصِحَّةٍ جَيِّدَةٍ.","Kami berharap Anda dalam keadaan baik dan sehat."],["B1","1745","أَشْكُرُ لَكُمْ حُسْنَ ضِيَافَتِكُمْ.","Saya berterima kasih atas keramahan Anda."],["B1","1746","هَلْ تَسْمَحُونَ لِي بِأَنْ أَقُولَ كَلِمَةً؟","Bolehkah saya menyampaikan sepatah kata?"],["B1","1747","اسْمَحُوا لِي أَنْ أُقَدِّمَ نَفْسِي.","Izinkan saya memperkenalkan diri."],["B1","1748","كَانَ مِنْ دَوَاعِي سُرُورِي أَنْ أَلْتَقِيَ بِكُمْ.","Merupakan kebahagiaan saya bisa bertemu Anda."],["B1","1749","نَتَطَلَّعُ إِلَى التَّعَاوُنِ مَعَكُمْ مُسْتَقْبَلًا.","Kami menantikan kerja sama dengan Anda ke depan."],["B1","1750","مَعَ خَالِصِ الشُّكْرِ وَالتَّقْدِيرِ.","Dengan ucapan terima kasih dan penghargaan yang tulus."],["B1","1751","أَعْلَنَتِ الْحُكُومَةُ عَنْ خُطَّةٍ جَدِيدَةٍ لِلنَّقْلِ الْعَامِّ.","Pemerintah mengumumkan rencana baru untuk transportasi umum."],["B1","1752","بِحَسَبِ التَّقَارِيرِ، ارْتَفَعَتِ الْأَسْعَارُ هَذَا الشَّهْرَ.","Menurut laporan, harga naik bulan ini."],["B1","1753","وَقَعَ حَادِثٌ عَلَى الطَّرِيقِ السَّرِيعِ صَبَاحَ الْيَوْمِ.","Terjadi kecelakaan di jalan tol pagi ini."],["B1","1754","تَمَّ إِغْلَاقُ الطَّرِيقِ مُؤَقَّتًا لِأَسْبَابٍ أَمْنِيَّةٍ.","Jalan ditutup sementara karena alasan keamanan."],["B1","1755","أَفَادَتِ الْأَرْصَادُ الْجَوِّيَّةُ بِأَنَّ الْأَمْطَارَ سَتَسْتَمِرُّ.","Badan cuaca menyatakan bahwa hujan akan terus berlanjut."],["B1","1756","افْتُتِحَ مَعْرِضُ الْكِتَابِ السَّنَوِيُّ أَمْسِ.","Pameran buku tahunan dibuka kemarin."],["B1","1757","شَارَكَ فِيهِ أَكْثَرُ مِنْ مِائَةِ نَاشِرٍ.","Lebih dari seratus penerbit ikut serta di dalamnya."],["B1","1758","أُجْرِيَتِ الِانْتِخَابَاتُ الْمَحَلِّيَّةُ فِي أَجْوَاءٍ هَادِئَةٍ.","Pemilu lokal diadakan dalam suasana tenang."],["B1","1759","يُتَوَقَّعُ أَنْ تَنْخَفِضَ دَرَجَاتُ الْحَرَارَةِ خِلَالَ الْأَيَّامِ الْقَادِمَةِ.","Diperkirakan suhu akan turun dalam beberapa hari mendatang."],["B1","1760","أَكَّدَ الْمُتَحَدِّثُ أَنَّ الْوَضْعَ تَحْتَ السَّيْطَرَةِ.","Juru bicara menegaskan bahwa keadaan terkendali."],["B1","1761","لَمْ يَصْدُرْ أَيُّ تَعْلِيقٍ رَسْمِيٍّ حَتَّى الْآنَ.","Belum ada komentar resmi sampai sekarang."],["B1","1762","انْتَشَرَتِ الشَّائِعَاتُ قَبْلَ أَنْ يَصْدُرَ الْبَيَانُ.","Rumor menyebar sebelum pernyataan dikeluarkan."],["B1","1763","شَهِدَتِ الْمَدِينَةُ حَدَثًا رِيَاضِيًّا كَبِيرًا.","Kota ini menyaksikan acara olahraga besar."],["B1","1764","كَانَ الْحُضُورُ أَكْبَرَ مِمَّا تَوَقَّعَ الْمُنَظِّمُونَ.","Kehadiran lebih besar daripada yang diperkirakan panitia."],["B1","1765","دَعَا الْخُبَرَاءُ إِلَى تَرْشِيدِ اسْتِهْلَاكِ الْمَاءِ.","Para ahli menyerukan penghematan penggunaan air."],["B1","1766","صَدَرَ قَرَارٌ جَدِيدٌ يَخُصُّ الْمَدَارِسَ.","Terbit keputusan baru terkait sekolah."],["B1","1767","تَابَعْتُ الْخَبَرَ مُنْذُ الصَّبَاحِ.","Saya mengikuti beritanya sejak pagi."],["B1","1768","لَيْسَ كُلُّ مَا يُنْشَرُ عَلَى الْإِنْتَرْنِتِ دَقِيقًا.","Tidak semua yang diterbitkan di internet itu akurat."],["B1","1769","فِي أَحَدِ الْأَيَّامِ، خَرَجْتُ لِأَشْتَرِيَ بَعْضَ الْأَغْرَاضِ.","Suatu hari saya keluar untuk membeli beberapa barang."],["B1","1770","وَبَيْنَمَا كُنْتُ أَسِيرُ فِي الشَّارِعِ، سَمِعْتُ أَحَدَهُمْ يُنَادِينِي.","Ketika saya berjalan di jalan, saya mendengar seseorang memanggil saya."],["B1","1771","الْتَفَتُّ فَرَأَيْتُ صَدِيقًا قَدِيمًا.","Saya menoleh dan melihat seorang teman lama."],["B1","1772","لَمْ أُصَدِّقْ عَيْنَيَّ فِي الْبِدَايَةِ.","Awalnya saya tidak percaya pada mata saya."],["B1","1773","تَعَانَقْنَا وَسَأَلْتُهُ عَنْ أَحْوَالِهِ.","Kami berpelukan dan saya menanyakan kabarnya."],["B1","1774","قَالَ إِنَّهُ عَادَ مِنَ الْخَارِجِ مُنْذُ أُسْبُوعٍ.","Katanya dia pulang dari luar negeri seminggu lalu."],["B1","1775","جَلَسْنَا فِي مَقْهًى قَرِيبٍ وَتَحَدَّثْنَا لِسَاعَاتٍ.","Kami duduk di kafe terdekat dan mengobrol berjam-jam."],["B1","1777","رَكَضْتُ إِلَى الْمَحَطَّةِ وَأَنَا أَلْهَثُ.","Saya berlari ke stasiun sambil terengah-engah."],["B1","1778","وَصَلْتُ فِي اللَّحْظَةِ الْأَخِيرَةِ تَقْرِيبًا.","Saya tiba hampir di detik terakhir."],["B1","1779","وَمَا إِنْ جَلَسْتُ حَتَّى تَحَرَّكَ الْقِطَارُ.","Begitu saya duduk, kereta pun berjalan."],["B1","1780","كَانَ الْيَوْمُ طَوِيلًا وَمُمْتِعًا فِي آنٍ وَاحِدٍ.","Hari itu panjang dan menyenangkan sekaligus."],["B1","1781","حِينَمَا كُنْتُ طِفْلًا، كَانَتْ جَدَّتِي تَحْكِي لِي قِصَصًا قَبْلَ النَّوْمِ.","Ketika saya kecil, nenek saya biasa menceritakan kisah sebelum tidur."],["B1","1782","كُنَّا نَجْتَمِعُ حَوْلَهَا وَنَسْتَمِعُ بِشَوْقٍ.","Kami berkumpul di sekelilingnya dan mendengarkan dengan antusias."],["B1","1783","وَفِي نِهَايَةِ كُلِّ قِصَّةٍ كَانَتْ تَقُولُ لَنَا حِكْمَةً.","Dan di akhir setiap kisah, dia menyampaikan sebuah hikmah kepada kami."],["B1","1784","مَا زِلْتُ أَتَذَكَّرُ صَوْتَهَا الدَّافِئَ.","Saya masih mengingat suaranya yang hangat."],["B1","1785","ذَاتَ مَرَّةٍ، ضَاعَ مِنِّي كَلْبِي فِي الْغَابَةِ.","Suatu kali, anjing saya hilang di hutan."],["B1","1786","بَحَثْنَا عَنْهُ حَتَّى الْمَسَاءِ دُونَ فَائِدَةٍ.","Kami mencarinya sampai sore tanpa hasil."],["B1","1787","وَفِي الصَّبَاحِ التَّالِي، وَجَدْنَاهُ أَمَامَ الْبَابِ.","Keesokan paginya, kami menemukannya di depan pintu."],["B1","1788","كَانَتْ فَرْحَتُنَا لَا تُوصَفُ.","Kegembiraan kami tak terlukiskan."],["B1","1789","وَهَكَذَا انْتَهَتِ الْقِصَّةُ بِسَلَامٍ.","Demikianlah kisahnya berakhir dengan selamat."],["B1","1790","لَقَدْ تَعَلَّمْتُ مِنْ تِلْكَ الْحَادِثَةِ أَلَّا أَتْرُكَ شَيْئًا ثَمِينًا بِلَا مُرَاقَبَةٍ.","Saya belajar dari kejadian itu untuk tidak meninggalkan barang berharga tanpa pengawasan."],["B1","1791","تَقَعُ الْقَرْيَةُ عَلَى سَفْحِ جَبَلٍ تُحِيطُ بِهِ الْغَابَاتُ.","Desa itu terletak di lereng gunung yang dikelilingi hutan."],["B1","1792","بُيُوتُهَا صَغِيرَةٌ وَمَبْنِيَّةٌ مِنَ الْحَجَرِ.","Rumah-rumahnya kecil dan terbuat dari batu."],["B1","1793","يَتَمَيَّزُ سُكَّانُهَا بِالْكَرَمِ وَالْبَسَاطَةِ.","Penduduknya dikenal ramah dan sederhana."],["B1","1794","الْهَوَاءُ هُنَاكَ نَقِيٌّ وَالْجَوُّ مُنْعِشٌ.","Udara di sana bersih dan cuacanya menyegarkan."],["B1","1795","هِيَ امْرَأَةٌ هَادِئَةُ الطَّبْعِ، قَوِيَّةُ الشَّخْصِيَّةِ.","Dia perempuan yang berperangai tenang dan berkepribadian kuat."],["B1","1796","تَتَحَدَّثُ بِبُطْءٍ وَتَخْتَارُ كَلِمَاتِهَا بِعِنَايَةٍ.","Dia berbicara pelan dan memilih kata-katanya dengan hati-hati."],["B1","1797","يُعْرَفُ عَنْهَا حُبُّهَا لِلنِّظَامِ وَالدِّقَّةِ.","Dia dikenal menyukai keteraturan dan ketelitian."],["B1","1798","كَانَ جَدِّي رَجُلًا طَوِيلَ الْقَامَةِ، عَرِيضَ الْكَتِفَيْنِ.","Kakek saya seorang pria tinggi dan berbahu lebar."],["B1","1799","ابْتِسَامَتُهُ لَا تُفَارِقُ وَجْهَهُ.","Senyumnya tak pernah lepas dari wajahnya."],["B1","1800","الْغُرْفَةُ مُضَاءَةٌ بِنُورٍ خَافِتٍ يُضْفِي عَلَيْهَا دِفْئًا.","Ruangan itu diterangi cahaya redup yang memberinya kehangatan."],["B1","1801","تَتَوَسَّطُ الْمَكَانَ طَاوِلَةٌ خَشَبِيَّةٌ قَدِيمَةٌ.","Di tengah tempat itu ada sebuah meja kayu tua."],["B1","1802","عَلَى الْجُدْرَانِ لَوْحَاتٌ تَحْكِي تَارِيخَ الْعَائِلَةِ.","Di dinding ada lukisan yang menceritakan sejarah keluarga."],["B1","1803","رَائِحَةُ الْقَهْوَةِ تَمْلَأُ الْمَكَانَ.","Aroma kopi memenuhi tempat itu."],["B1","1804","الْمَقْهَى يَعُجُّ بِالزَّبَائِنِ فِي الْمَسَاءِ.","Kafe itu ramai pengunjung di malam hari."],["B1","1805","تَبْدُو الْمَدِينَةُ مِنْ بَعِيدٍ كَلَوْحَةٍ مُضِيئَةٍ.","Dari kejauhan kota tampak seperti lukisan bercahaya."],["B1","1806","هُوَ شَخْصٌ يُحِبُّ الْمُغَامَرَةَ وَلَا يَخَافُ الْمَجْهُولَ.","Dia orang yang suka petualangan dan tak takut pada hal yang tak diketahui."],["B1","1807","كُلُّ مَنْ يَعْرِفُهُ يَصِفُهُ بِالصِّدْقِ وَالْأَمَانَةِ.","Semua yang mengenalnya menyebutnya jujur dan amanah."],["B1","1808","الْمَنْظَرُ مِنْ هُنَا يَسْلُبُ الْأَنْفَاسَ.","Pemandangan dari sini memukau."],["B1","1809","أَوَدُّ أَنْ أُقَدِّمَ شَكْوَى بِخُصُوصِ الْخِدْمَةِ الَّتِي تَلَقَّيْتُهَا.","Saya ingin mengajukan keluhan tentang layanan yang saya terima."],["B1","1810","لَمْ يَكُنِ الْمُنْتَجُ مُطَابِقًا لِلْوَصْفِ.","Barangnya tidak sesuai dengan deskripsi."],["B1","1811","أَطْلُبُ اسْتِرْدَادَ الْمَبْلَغِ أَوْ اسْتِبْدَالَ الْقِطْعَةِ.","Saya minta uang dikembalikan atau barang diganti."],["B1","1812","نَعْتَذِرُ عَنِ الْإِزْعَاجِ وَسَنَعْمَلُ عَلَى حَلِّ الْمُشْكِلَةِ فَوْرًا.","Kami mohon maaf atas ketidaknyamanan dan akan segera menyelesaikan masalah."],["B1","1813","هَلْ يُمْكِنُ أَنْ نَصِلَ إِلَى حَلٍّ وَسَطٍ؟","Bisakah kita mencapai jalan tengah?"],["B1","1814","أَنَا مُسْتَعِدٌّ لِلتَّنَازُلِ عَنْ بَعْضِ الشُّرُوطِ.","Saya bersedia mengalah pada sebagian syarat."],["B1","1815","لَنْ أُوَافِقَ إِلَّا إِذَا تَمَّ تَعْدِيلُ الْعَقْدِ.","Saya tidak akan setuju kecuali kontrak diubah."],["B1","1816","السِّعْرُ الَّذِي عَرَضْتُمُوهُ أَعْلَى مِنْ مِيزَانِيَّتِنَا.","Harga yang Anda tawarkan di atas anggaran kami."],["B1","1817","نَحْنُ نُقَدِّرُ عَرْضَكُمْ لَكِنَّنَا نَحْتَاجُ إِلَى تَخْفِيضٍ.","Kami menghargai tawaran Anda tapi kami butuh potongan harga."],["B1","1818","إِذَا قَبِلْتُمْ بِهَذَا الشَّرْطِ فَسَنُوَقِّعُ الْيَوْمَ.","Jika Anda menerima syarat ini, kami tanda tangan hari ini."],["B1","1819","حَدَثَ سُوءُ فَهْمٍ بَيْنَنَا وَيَجِبُ أَنْ نُوَضِّحَهُ.","Terjadi salah paham di antara kita dan kita harus meluruskannya."],["B1","1820","لَمْ أَقْصِدْ أَنْ أَجْرَحَ مَشَاعِرَكَ.","Saya tidak bermaksud melukai perasaanmu."],["B1","1821","أَتَفَهَّمُ مَوْقِفَكَ لَكِنَّ لِي وِجْهَةَ نَظَرٍ أُخْرَى.","Saya memahami posisimu tapi saya punya sudut pandang lain."],["B1","1822","دَعْنَا نَتَحَدَّثْ بِهُدُوءٍ وَنَبْحَثْ عَنْ حَلٍّ.","Mari bicara dengan tenang dan mencari solusi."],["B1","1823","لَا فَائِدَةَ مِنَ الْجِدَالِ إِذَا لَمْ نَسْتَمِعْ لِبَعْضِنَا.","Tak ada gunanya berdebat jika kita tak saling mendengarkan."],["B1","1824","يَبْدُو أَنَّ هُنَاكَ خَطَأً فِي الْحِسَابِ.","Sepertinya ada kesalahan hitung."],["B1","1825","طَلَبْتُ مِنْهُمْ أَنْ يُعِيدُوا النَّظَرَ فِي الْقَرَارِ.","Saya meminta mereka meninjau kembali keputusan itu."],["B1","1826","رَفَضُوا طَلَبِي بِحُجَّةِ أَنَّ الْمُدَّةَ انْتَهَتْ.","Mereka menolak permintaan saya dengan alasan waktunya habis."],["B1","1827","سَأَرْفَعُ الْأَمْرَ إِلَى الْإِدَارَةِ إِذَا لَزِمَ.","Saya akan mengajukan hal ini ke manajemen bila perlu."],["B1","1828","أَرْجُو أَنْ نُنْهِيَ هَذَا الْأَمْرَ وُدِّيًّا.","Saya harap kita menyelesaikan ini secara baik-baik."],["B1","1829","نُنَظِّمُ رِحْلَةً جَمَاعِيَّةً إِلَى الْجَبَلِ نِهَايَةَ الشَّهْرِ.","Kami mengadakan perjalanan bersama ke gunung akhir bulan."],["B1","1830","مَنْ يَرْغَبُ فِي الْمُشَارَكَةِ فَلْيُسَجِّلْ اسْمَهُ.","Siapa yang ingin ikut, silakan mendaftarkan namanya."],["B1","1831","عَدَدُ الْمَقَاعِدِ مَحْدُودٌ فَالْأَفْضَلُ أَنْ تُسْرِعُوا.","Jumlah kursi terbatas, jadi sebaiknya Anda cepat."],["B1","1832","سَنَتَقَاسَمُ تَكَالِيفَ الْمُوَاصَلَاتِ بَيْنَنَا.","Kita akan membagi biaya transportasi di antara kita."],["B1","1833","كُلُّ وَاحِدٍ مِنَّا سَيُحْضِرُ طَبَقًا مِنَ الطَّعَامِ.","Setiap dari kita akan membawa satu hidangan."],["B1","1834","يَجِبُ أَنْ نَتَّفِقَ عَلَى جَدْوَلٍ زَمَنِيٍّ وَاضِحٍ.","Kita harus sepakat pada jadwal yang jelas."],["B1","1835","سَنَنْطَلِقُ فِي السَّادِسَةِ صَبَاحًا وَلَنْ نَنْتَظِرَ أَحَدًا.","Kita berangkat jam enam pagi dan tidak akan menunggu siapa pun."],["B1","1836","مَنْ سَيَتَوَلَّى الْإِشْرَافَ عَلَى الْحَجْزِ؟","Siapa yang akan menangani pemesanan?"],["B1","1837","تَطَوَّعْتُ لِلتَّنْسِيقِ مَعَ الْفُنْدُقِ.","Saya menawarkan diri berkoordinasi dengan hotel."],["B1","1838","أَرْسِلُوا لِي أَسْمَاءَكُمْ قَبْلَ يَوْمِ الْخَمِيسِ.","Kirimkan nama-nama Anda kepada saya sebelum hari Kamis."],["B1","1839","قَدْ نُضْطَرُّ إِلَى تَغْيِيرِ الْمَوْعِدِ إِنْ سَاءَ الطَّقْسُ.","Kita mungkin terpaksa mengubah jadwal jika cuaca memburuk."],["B1","1840","سَنُوَزِّعُ الْمُهِمَّاتِ بِالْعَدْلِ بَيْنَ الْجَمِيعِ.","Kita akan membagi tugas secara adil kepada semua."],["B1","1841","تَمَّتِ الْمُوَافَقَةُ عَلَى خُطَّةِ الرِّحْلَةِ بِالْإِجْمَاعِ.","Rencana perjalanan disetujui secara bulat."],["B1","1842","لَا تَنْسَوْا إِحْضَارَ الْأَوْرَاقِ الثُّبُوتِيَّةِ.","Jangan lupa membawa dokumen identitas."],["B1","1843","بَعْدَ انْتِهَاءِ الرِّحْلَةِ سَنَجْتَمِعُ لِمُرَاجَعَةِ مَا حَدَثَ.","Setelah perjalanan selesai kita akan berkumpul meninjau apa yang terjadi."],["B1","1844","كَانَتْ تَجْرِبَةً تَنْظِيمِيَّةً تَعَلَّمْنَا مِنْهَا الْكَثِيرَ.","Itu pengalaman mengorganisir yang banyak mengajarkan kami."],["B1","1845","أَعْمَلُ عَلَى بَحْثٍ يَتَنَاوَلُ تَعَلُّمَ اللُّغَاتِ الْأَجْنَبِيَّةِ.","Saya mengerjakan penelitian tentang pembelajaran bahasa asing."],["B1","1846","جَمَعْتُ الْبَيَانَاتِ مِنْ خِلَالِ اسْتِبْيَانٍ.","Saya mengumpulkan data lewat kuesioner."],["B1","1847","تُشِيرُ النَّتَائِجُ إِلَى أَنَّ الْمُمَارَسَةَ الْيَوْمِيَّةَ تُحَسِّنُ الطَّلَاقَةَ.","Hasilnya menunjukkan bahwa latihan harian meningkatkan kelancaran."],["B1","1848","يَجِبُ أَنْ أَسْتَشْهِدَ بِمَصَادِرَ مَوْثُوقَةٍ.","Saya harus mengutip sumber yang terpercaya."],["B1","1849","أَضَفْتُ قَائِمَةَ الْمَرَاجِعِ فِي نِهَايَةِ الْبَحْثِ.","Saya menambahkan daftar pustaka di akhir makalah."],["B1","1850","طَلَبَ الْمُشْرِفُ إِعَادَةَ صِيَاغَةِ الْمُقَدِّمَةِ.","Pembimbing meminta penulisan ulang bagian pendahuluan."],["B1","1851","حَدَّدْنَا مَوْعِدَ الْمُنَاقَشَةِ يَوْمَ الْأَحَدِ.","Kami menetapkan jadwal sidang hari Minggu."],["B1","1852","تَدَرَّبْتُ عَلَى الْعَرْضِ أَمَامَ الْمِرْآةِ.","Saya berlatih presentasi di depan cermin."],["B1","1853","كَانَ لَدَيَّ شُعُورٌ مُخْتَلِطٌ بَيْنَ الْخَوْفِ وَالْحَمَاسِ.","Saya punya perasaan campur aduk antara takut dan bersemangat."],["B1","1854","الْأَسْئِلَةُ كَانَتْ صَعْبَةً لَكِنَّنِي اسْتَطَعْتُ الرَّدَّ.","Pertanyaannya sulit tapi saya mampu menjawab."],["B1","1855","حَصَلْتُ عَلَى تَقْدِيرٍ جَيِّدٍ جِدًّا.","Saya mendapat predikat sangat baik."],["B1","1856","يَتَطَلَّبُ التَّخَرُّجُ إِتْمَامَ مِائَةٍ وَعِشْرِينَ سَاعَةً مُعْتَمَدَةً.","Kelulusan membutuhkan penyelesaian 120 SKS."],["B1","1857","سَجَّلْتُ فِي مَادَّتَيْنِ إِضَافِيَّتَيْنِ هَذَا الْفَصْلَ.","Saya mendaftar dua mata kuliah tambahan semester ini."],["B1","1858","الْمُحَاضَرَاتُ مُسَجَّلَةٌ وَيُمْكِنُ مُشَاهَدَتُهَا لَاحِقًا.","Kuliahnya direkam dan bisa ditonton nanti."],["B1","1859","يُعْتَبَرُ هَذَا الْمَوْضُوعُ مِنْ أَهَمِّ قَضَايَا الْعَصْرِ.","Topik ini dianggap salah satu isu terpenting zaman ini."],["B1","1860","لَا بُدَّ مِنْ مُرَاجَعَةِ الْأَدَبِيَّاتِ السَّابِقَةِ قَبْلَ الْبَدْءِ.","Perlu meninjau literatur sebelumnya sebelum memulai."],["B1","1861","سَأَنْشُرُ الْمَقَالَ فِي مَجَلَّةٍ عِلْمِيَّةٍ مُحَكَّمَةٍ.","Saya akan menerbitkan artikel di jurnal ilmiah terakreditasi."],["B1","1862","تَحْتَاجُ الْكِتَابَةُ الْأَكَادِيمِيَّةُ إِلَى أُسْلُوبٍ مُنَظَّمٍ.","Penulisan akademik butuh gaya yang teratur."],["B1","1863","أُحَاوِلُ أَنْ أُوَازِنَ بَيْنَ عَمَلِي وَأُسْرَتِي.","Saya berusaha menyeimbangkan pekerjaan dan keluarga."],["B1","1865","تَرْبِيَةُ الْأَبْنَاءِ مَسْؤُولِيَّةٌ كَبِيرَةٌ.","Mendidik anak adalah tanggung jawab besar."],["B1","1866","مِنَ الْمُهِمِّ أَنْ نَسْتَمِعَ إِلَى أَبْنَائِنَا دُونَ مُقَاطَعَةٍ.","Penting mendengarkan anak-anak tanpa memotong."],["B1","1867","أَشْعُرُ بِالضَّغْطِ عِنْدَمَا تَتَرَاكَمُ الْمَسْؤُولِيَّاتُ.","Saya merasa tertekan ketika tanggung jawab menumpuk."],["B1","1868","أَحْتَاجُ إِلَى وَقْتٍ لِنَفْسِي مِنْ حِينٍ لِآخَرَ.","Saya butuh waktu untuk diri sendiri sesekali."],["B1","1869","الْحَدِيثُ مَعَ شَخْصٍ مَوْثُوقٍ يُخَفِّفُ الْعِبْءَ.","Berbicara dengan orang terpercaya meringankan beban."],["B1","1870","لَا تَحْمِلْ هَمَّكَ وَحْدَكَ.","Jangan menanggung bebanmu sendirian."],["B1","1871","نَصَحَنِي صَدِيقِي بِزِيَارَةِ مُخْتَصٍّ.","Teman saya menyarankan saya menemui seorang ahli."],["B1","1872","الْحُزْنُ شُعُورٌ طَبِيعِيٌّ لَا يَدُومُ إِلَى الْأَبَدِ.","Sedih adalah perasaan wajar yang tidak berlangsung selamanya."],["B1","1873","تَقَبُّلُ الذَّاتِ أَوَّلُ خُطْوَةٍ نَحْوَ الرَّاحَةِ النَّفْسِيَّةِ.","Menerima diri adalah langkah pertama menuju ketenangan jiwa."],["B1","1874","قَضَيْنَا الْعُطْلَةَ مَعَ الْأُسْرَةِ فَشَعَرْتُ بِتَحَسُّنٍ.","Kami berlibur bersama keluarga dan saya merasa lebih baik."],["B1","1875","يَخْتَلِفُ الزَّوْجَانِ أَحْيَانًا وَهَذَا طَبِيعِيٌّ.","Suami istri kadang berbeda pendapat dan itu wajar."],["B1","1876","الْحِوَارُ الْهَادِئُ يَحُلُّ أَكْثَرَ الْمُشْكِلَاتِ.","Dialog yang tenang menyelesaikan kebanyakan masalah."],["B1","1877","تَعَلَّمْتُ أَنْ أَسْمَحَ لِنَفْسِي بِالرَّاحَةِ.","Saya belajar mengizinkan diri untuk beristirahat."],["B1","1878","كَبِرَ وَالِدَايَ وَصِرْتُ أَعْتَنِي بِهِمَا.","Orang tua saya sudah menua dan saya merawat mereka."],["B1","1879","بِرُّ الْوَالِدَيْنِ مِنْ أَعْظَمِ الْوَاجِبَاتِ.","Berbakti kepada orang tua termasuk kewajiban terbesar."],["B1","1880","أَدْعُو لَهُمَا بِالصِّحَّةِ وَطُولِ الْعُمْرِ.","Saya mendoakan mereka sehat dan panjang umur."],["B1","1881","بَدَأْتُ الْعَمَلَ الْحُرَّ مُنْذُ سَنَةٍ.","Saya mulai bekerja lepas sejak setahun lalu."],["B1","1882","أَتَقَاضَى أُجْرَتِي بِحَسَبِ الْمَشْرُوعِ.","Saya menerima bayaran sesuai proyek."],["B1","1883","يَصْعُبُ التَّنَبُّؤُ بِالدَّخْلِ الشَّهْرِيِّ.","Sulit memperkirakan pendapatan bulanan."],["B1","1884","أُحَاوِلُ أَنْ أَدَّخِرَ جُزْءًا مِنْ كُلِّ دَفْعَةٍ.","Saya berusaha menabung sebagian dari setiap pembayaran."],["B1","1885","يَجِبُ أَنْ أَتَعَلَّمَ كَيْفَ أُسَوِّقُ لِنَفْسِي.","Saya harus belajar memasarkan diri sendiri."],["B1","1886","أَنْشَأْتُ مَوْقِعًا إِلِكْتْرُونِيًّا لِعَرْضِ أَعْمَالِي.","Saya membuat situs web untuk menampilkan karya saya."],["B1","1887","اكْتَسَبْتُ عُمَلَاءَ جُدُدًا عَنْ طَرِيقِ التَّوْصِيَاتِ.","Saya mendapat klien baru lewat rekomendasi."],["B1","1888","الْتَزَمْتُ بِالْمَوْعِدِ النِّهَائِيِّ رَغْمَ الصُّعُوبَاتِ.","Saya memenuhi tenggat meski ada kesulitan."],["B1","1889","أُفَضِّلُ الِاسْتِقْلَالِيَّةَ عَلَى الْوَظِيفَةِ الثَّابِتَةِ.","Saya lebih suka kemandirian daripada pekerjaan tetap."],["B1","1890","افْتَتَحَ صَدِيقِي مَتْجَرًا صَغِيرًا لِلْمَلَابِسِ.","Teman saya membuka toko pakaian kecil."],["B1","1891","يُوَاجِهُ أَصْحَابُ الْمَشَارِيعِ الصَّغِيرَةِ مُنَافَسَةً شَدِيدَةً.","Pemilik usaha kecil menghadapi persaingan ketat."],["B1","1892","مِنَ الضَّرُورِيِّ دِرَاسَةُ السُّوقِ قَبْلَ الِاسْتِثْمَارِ.","Penting mempelajari pasar sebelum berinvestasi."],["B1","1893","ارْتَفَعَتْ مَبِيعَاتُنَا بِنِسْبَةِ عِشْرِينَ بِالْمِائَةِ.","Penjualan kami naik dua puluh persen."],["B1","1894","نَحْتَاجُ إِلَى مُوَظَّفٍ إِضَافِيٍّ لِمُوَاكَبَةِ الطَّلَبِ.","Kami butuh karyawan tambahan untuk mengimbangi permintaan."],["B1","1895","يَنْبَغِي أَنْ نُرَاجِعَ مَصَارِيفَنَا كُلَّ رُبْعِ سَنَةٍ.","Sebaiknya kita meninjau pengeluaran setiap kuartal."],["B1","1896","تَقَدَّمْتُ بِطَلَبِ قَرْضٍ لِتَوْسِيعِ الْمَشْرُوعِ.","Saya mengajukan pinjaman untuk memperluas usaha."],["B1","1897","نَسْعَى إِلَى بِنَاءِ عَلَامَةٍ تِجَارِيَّةٍ مَوْثُوقَةٍ.","Kami berupaya membangun merek yang tepercaya."],["B1","1898","يَجِبُ أَنْ أُحَدِّدَ أَسْعَارِي بِدِقَّةٍ.","Saya harus menentukan tarif saya dengan tepat."],["B1","1899","أُحِبُّ الرِّوَايَاتِ الَّتِي تَجْمَعُ بَيْنَ التَّشْوِيقِ وَالْعُمْقِ.","Saya suka novel yang memadukan ketegangan dan kedalaman."],["B1","1900","انْتَهَيْتُ مِنْ قِرَاءَةِ الْكِتَابِ فِي ثَلَاثَةِ أَيَّامٍ.","Saya selesai membaca buku itu dalam tiga hari."],["B1","1901","أَسَرَنِي أُسْلُوبُ الْكَاتِبِ مُنْذُ الصَّفْحَةِ الْأُولَى.","Gaya penulis memikat saya sejak halaman pertama."],["B1","1902","الْفِيلْمُ مُقْتَبَسٌ مِنْ رِوَايَةٍ شَهِيرَةٍ.","Film itu diadaptasi dari novel terkenal."],["B1","1903","كَانَ الْأَدَاءُ التَّمْثِيلِيُّ مُقْنِعًا وَالْإِخْرَاجُ مُتْقَنًا.","Aktingnya meyakinkan dan penyutradaraannya rapi."],["B1","1904","لَمْ يُعْجِبْنِي الْمُنْتَهَى لِأَنَّهُ كَانَ مُتَوَقَّعًا.","Saya tidak suka akhir ceritanya karena mudah ditebak."],["B1","1905","تُعْجِبُنِي الْأَغَانِي الَّتِي تَحْمِلُ مَعْنًى.","Saya suka lagu yang bermakna."],["B1","1906","أَسْتَمِعُ إِلَى الْمُوسِيقَى أَثْنَاءَ الْعَمَلِ لِأُرَكِّزَ.","Saya mendengarkan musik saat bekerja agar fokus."],["B1","1907","زُرْتُ مَعْرِضًا لِلْفَنِّ التَّشْكِيلِيِّ الْأُسْبُوعَ الْمَاضِيَ.","Minggu lalu saya mengunjungi pameran seni rupa."],["B1","1908","اسْتَوْقَفَتْنِي لَوْحَةٌ تُصَوِّرُ غُرُوبَ الشَّمْسِ فِي الصَّحْرَاءِ.","Sebuah lukisan yang menggambarkan senja di padang pasir membuat saya terpaku."],["B1","1909","الْخَطُّ الْعَرَبِيُّ فَنٌّ يَجْمَعُ الْجَمَالَ وَالدِّقَّةَ.","Kaligrafi Arab adalah seni yang memadukan keindahan dan ketelitian."],["B1","1910","أَتَمَنَّى أَنْ أَتَعَلَّمَ الْخَطَّ بِنَفْسِي.","Saya ingin belajar kaligrafi sendiri."],["B1","1911","الشِّعْرُ يُعَبِّرُ عَمَّا تَعْجِزُ عَنْهُ الْكَلِمَاتُ الْعَادِيَّةُ.","Puisi mengungkapkan apa yang tak mampu diungkap kata-kata biasa."],["B1","1912","حَضَرْنَا أُمْسِيَةً أَدَبِيَّةً فِي الْمَكْتَبَةِ الْعَامَّةِ.","Kami menghadiri malam sastra di perpustakaan umum."],["B1","1913","يُقَالُ إِنَّ الْقِرَاءَةَ تُنَمِّي الْخَيَالَ.","Dikatakan bahwa membaca mengembangkan imajinasi."],["B1","1914","اخْتَرْتُ كِتَابًا يَتَنَاوَلُ سِيرَةَ شَخْصِيَّةٍ مُلْهِمَةٍ.","Saya memilih buku tentang biografi tokoh yang menginspirasi."],["B1","1915","تَرْجَمَةُ الشِّعْرِ تَحَدٍّ حَقِيقِيٌّ.","Menerjemahkan puisi adalah tantangan nyata."],["B1","1916","كُلَّمَا قَرَأْتُ أَكْثَرَ تَوَسَّعَتْ مُفْرَدَاتِي.","Semakin banyak saya membaca, semakin luas kosakata saya."],["B1","1917","فَازَ الْفَرِيقُ فِي الدَّقَائِقِ الْأَخِيرَةِ مِنَ الْمُبَارَاةِ.","Tim menang di menit-menit akhir pertandingan."],["B1","1918","تَدَرَّبَ اللَّاعِبُونَ بِجِدٍّ طِيلَةَ الْمَوْسِمِ.","Para pemain berlatih keras sepanjang musim."],["B1","1919","كَانَ الْحَكَمُ عَادِلًا وَقَرَارَاتُهُ وَاضِحَةً.","Wasitnya adil dan keputusannya jelas."],["B1","1920","تَعَرَّضَ اللَّاعِبُ لِإِصَابَةٍ فِي رُكْبَتِهِ.","Pemain itu mengalami cedera lutut."],["B1","1921","سَيَغِيبُ عَنِ الْمَلْعَبِ لِمُدَّةِ شَهْرَيْنِ.","Dia akan absen dari lapangan selama dua bulan."],["B1","1922","أَحْرَزَتْ بِلَادُنَا الْمِيدَالِيَّةَ الذَّهَبِيَّةَ.","Negara kami meraih medali emas."],["B1","1923","الرِّيَاضَةُ تُعَلِّمُنَا رُوحَ الْفَرِيقِ وَالْمُثَابَرَةَ.","Olahraga mengajarkan kita semangat tim dan ketekunan."],["B1","1924","لَا يَهُمُّ الْفَوْزُ بِقَدْرِ مَا تَهُمُّ الْمُشَارَكَةُ.","Menang tidak sepenting berpartisipasi."],["B1","1925","أَشْتَرِكُ فِي مَارَاثُونٍ سَنَوِيٍّ مُنْذُ ثَلَاثِ سَنَوَاتٍ.","Saya ikut maraton tahunan sejak tiga tahun lalu."],["B1","1926","يَحْتَاجُ الْعَدَّاءُ إِلَى تَغْذِيَةٍ سَلِيمَةٍ وَنَوْمٍ كَافٍ.","Pelari butuh gizi yang baik dan tidur cukup."],["B1","1927","أُتَابِعُ الْبُطُولَةَ عَبْرَ الْبَثِّ الْمُبَاشِرِ.","Saya mengikuti turnamen lewat siaran langsung."],["B1","1928","تَنْتَهِي الْبُطُولَةُ بِمُبَارَاةٍ نِهَائِيَّةٍ مُثِيرَةٍ.","Turnamen berakhir dengan pertandingan final yang seru."],["B1","1929","يَتَمَيَّزُ الْمَطْبَخُ الْعَرَبِيُّ بِتَنَوُّعِ نَكْهَاتِهِ.","Masakan Arab dikenal dengan ragam cita rasanya."],["B1","1930","تُسْتَخْدَمُ الْبَهَارَاتُ بِكَثْرَةٍ فِي أَطْبَاقِنَا.","Rempah banyak dipakai dalam hidangan kita."],["B1","1931","الْأُرْزُ هُوَ الْعُنْصُرُ الْأَسَاسِيُّ فِي مَائِدَتِنَا.","Nasi adalah unsur utama di meja makan kita."],["B1","1932","يَجْتَمِعُ أَفْرَادُ الْأُسْرَةِ حَوْلَ الْمَائِدَةِ فِي الْإِفْطَارِ.","Anggota keluarga berkumpul di meja saat berbuka."],["B1","1933","أُحِبُّ تَجْرِبَةَ الْأَطْعِمَةِ الشَّعْبِيَّةِ فِي الْأَسْوَاقِ.","Saya suka mencoba makanan tradisional di pasar."],["B1","1934","تَعَلَّمْتُ هَذِهِ الْوَصْفَةَ مِنْ جَدَّتِي.","Saya belajar resep ini dari nenek saya."],["B1","1935","الْمُكَوِّنَاتُ بَسِيطَةٌ لَكِنَّ السِّرَّ فِي التَّحْضِيرِ.","Bahannya sederhana tapi rahasianya ada pada cara membuatnya."],["B1","1936","يَجِبُ أَنْ يُطْهَى اللَّحْمُ عَلَى نَارٍ هَادِئَةٍ.","Daging harus dimasak dengan api kecil."],["B1","1937","لَا أَتَنَاوَلُ الْوَجَبَاتِ السَّرِيعَةَ إِلَّا نَادِرًا.","Saya jarang makan makanan cepat saji."],["B1","1938","أَحْرِصُ عَلَى تَنْوِيعِ طَعَامِي لِأَحْصُلَ عَلَى فَوَائِدَ مُخْتَلِفَةٍ.","Saya berusaha menganekaragamkan makanan agar mendapat manfaat yang berbeda."],["B1","1939","الضِّيَافَةُ جُزْءٌ مِنْ ثَقَافَةِ الطَّعَامِ عِنْدَنَا.","Menjamu tamu adalah bagian dari budaya makan kita."],["B1","1940","دَعَوْتُ جِيرَانِي إِلَى مَأْدُبَةٍ بِمُنَاسَبَةِ الْعِيدِ.","Saya mengundang tetangga ke jamuan menyambut hari raya."],["B1","1941","كَانَتِ الْمَائِدَةُ عَامِرَةً بِمَا لَذَّ وَطَابَ.","Meja itu penuh dengan hidangan lezat."],["B1","1943","تَنَاوَلْنَا الْحَلْوَى مَعَ الشَّايِ بَعْدَ الْعَشَاءِ.","Kami menyantap makanan manis dengan teh setelah makan malam."],["B1","1944","أَنَا أُقَلِّلُ مِنَ السُّكَّرِ لَكِنَّنِي لَا أَحْرِمُ نَفْسِي كُلِّيًّا.","Saya mengurangi gula tapi tidak melarang diri sepenuhnya."],["B1","1945","يَجِبُ تَقْدِيمُ الطَّلَبِ قَبْلَ انْتِهَاءِ الْمُهْلَةِ الْمُحَدَّدَةِ.","Permohonan harus diajukan sebelum batas waktu yang ditentukan."],["B1","1946","تُشْتَرَطُ إِحْضَارُ نُسْخَةٍ مِنَ الْهُوِيَّةِ.","Disyaratkan membawa salinan kartu identitas."],["B1","1947","تَمَّ رَفْضُ الطَّلَبِ لِنَقْصٍ فِي الْمُسْتَنَدَاتِ.","Permohonan ditolak karena dokumen kurang."],["B1","1948","يُمْكِنُكَ تَقْدِيمُ اسْتِئْنَافٍ خِلَالَ ثَلَاثِينَ يَوْمًا.","Anda dapat mengajukan banding dalam tiga puluh hari."],["B1","1949","تَخْتَلِفُ الْقَوَانِينُ مِنْ بَلَدٍ إِلَى آخَرَ.","Hukum berbeda dari satu negara ke negara lain."],["B1","1950","مِنَ الْمَمْنُوعِ التَّدْخِينُ فِي الْأَمَاكِنِ الْعَامَّةِ الْمُغْلَقَةِ.","Dilarang merokok di tempat umum tertutup."],["B1","1951","يُعَاقَبُ كُلُّ مَنْ يُخَالِفُ هَذِهِ التَّعْلِيمَاتِ.","Siapa pun yang melanggar aturan ini akan dikenai sanksi."],["B1","1952","يَلْزَمُكَ تَجْدِيدُ الْإِقَامَةِ قَبْلَ شَهْرٍ مِنِ انْتِهَائِهَا.","Anda wajib memperpanjang izin tinggal sebulan sebelum habis."],["B1","1953","اسْتَلَمْتُ إِشْعَارًا بِمَوْعِدِ الْجَلْسَةِ.","Saya menerima pemberitahuan jadwal sidang."],["B1","1954","تُدْفَعُ الرُّسُومُ عَبْرَ الْمَوْقِعِ الرَّسْمِيِّ.","Biaya dibayar melalui situs resmi."],["B1","1955","رَاجِعِ الشُّرُوطَ بِعِنَايَةٍ قَبْلَ التَّوْقِيعِ.","Periksa ketentuan dengan cermat sebelum menandatangani."],["B1","1956","هَلْ يَشْمَلُ التَّأْمِينُ الْعِلَاجَ فِي الْخَارِجِ؟","Apakah asuransi mencakup pengobatan di luar negeri?"],["B1","1957","لَا بُدَّ مِنْ حَجْزِ مَوْعِدٍ مُسْبَقٍ لِلْفَحْصِ.","Perlu membuat janji lebih dulu untuk pemeriksaan."],["B1","1958","تَوَجَّبَ عَلَيْنَا دَفْعُ غَرَامَةٍ بِسَبَبِ التَّأْخِيرِ.","Kami wajib membayar denda karena keterlambatan."],["B1","1959","أَنْتَظِرُ الرَّدَّ عَلَى طَلَبِي مُنْذُ أُسْبُوعَيْنِ.","Saya menunggu jawaban atas permohonan saya sejak dua minggu."],["B1","1960","يُقَالُ إِنَّ الْإِجْرَاءَاتِ سَتَصِيرُ أَسْهَلَ قَرِيبًا.","Katanya prosedur akan segera lebih mudah."],["B1","1961","تَقَعُ مِصْرُ فِي شَمَالِ إِفْرِيقِيَا وَتُطِلُّ عَلَى الْبَحْرِ الْمُتَوَسِّطِ.","Mesir terletak di Afrika Utara dan menghadap Laut Tengah."],["B1","1962","يَمُرُّ نَهْرُ النِّيلِ بِعِدَّةِ دُوَلٍ قَبْلَ أَنْ يَصُبَّ فِي الْبَحْرِ.","Sungai Nil melewati beberapa negara sebelum bermuara ke laut."],["B1","1963","اشْتُهِرَتِ الْمَنْطِقَةُ بِحَضَارَاتِهَا الْقَدِيمَةِ.","Daerah itu terkenal dengan peradaban kunonya."],["B1","1964","بُنِيَتِ الْأَهْرَامَاتُ مُنْذُ آلَافِ السِّنِينَ.","Piramida dibangun ribuan tahun lalu."],["B1","1965","تَرَكَتِ الْحَضَارَةُ الْإِسْلَامِيَّةُ أَثَرًا كَبِيرًا فِي الْعُلُومِ وَالْفُنُونِ.","Peradaban Islam meninggalkan pengaruh besar dalam sains dan seni."],["B1","1966","كَانَتِ الْمَدِينَةُ مَرْكَزًا تِجَارِيًّا مُهِمًّا عَلَى طَرِيقِ الْحَرِيرِ.","Kota itu dulu pusat perdagangan penting di Jalur Sutra."],["B1","1967","تَحْتَوِي الْمَنْطِقَةُ عَلَى صَحَارَى وَجِبَالٍ وَسَوَاحِلَ.","Wilayah itu memiliki gurun, gunung, dan pantai."],["B1","1968","يُعَدُّ هَذَا الْمَسْجِدُ مِنْ أَقْدَمِ الْمَسَاجِدِ فِي الْعَالَمِ.","Masjid ini dianggap salah satu masjid tertua di dunia."],["B1","1969","يَزُورُهُ آلَافُ السُّيَّاحِ كُلَّ عَامٍ.","Ribuan wisatawan mengunjunginya setiap tahun."],["B1","1970","تُحَافِظُ الدَّوْلَةُ عَلَى الْآثَارِ مِنَ التَّلَفِ.","Negara melindungi peninggalan dari kerusakan."],["B1","1971","تَغَيَّرَتْ مَعَالِمُ الْمَدِينَةِ كَثِيرًا خِلَالَ الْقَرْنِ الْمَاضِي.","Wajah kota banyak berubah selama abad lalu."],["B1","1972","دَرَسْتُ فِي الْمَدْرَسَةِ تَارِيخَ الْمِنْطَقَةِ.","Saya mempelajari sejarah daerah itu di sekolah."],["B1","1973","التَّارِيخُ يُعِيدُ نَفْسَهُ إِنْ لَمْ نَتَعَلَّمْ مِنْهُ.","Sejarah berulang jika kita tidak belajar darinya."],["B1","1974","مَنْ لَا يَعْرِفُ مَاضِيَهُ يَصْعُبُ عَلَيْهِ فَهْمُ حَاضِرِهِ.","Siapa yang tak mengenal masa lalunya sulit memahami masa kininya."],["B1","1975","احْذَرْ مِنَ الرَّسَائِلِ الَّتِي تَطْلُبُ مِنْكَ مَعْلُومَاتٍ شَخْصِيَّةً.","Waspadalah terhadap pesan yang meminta informasi pribadimu."],["B1","1976","مِنَ الْأَفْضَلِ أَلَّا تَعِدَ بِمَا لَا تَسْتَطِيعُ فِعْلَهُ.","Lebih baik jangan berjanji sesuatu yang tak mampu kamu lakukan."],["B1","1977","أَعِدُكَ أَنْ أُسَاعِدَكَ مَهْمَا حَدَثَ.","Aku berjanji membantumu apa pun yang terjadi."],["B1","1978","سَأَفِي بِوَعْدِي حَتَّى لَوْ تَأَخَّرْتُ.","Saya akan menepati janji saya meski terlambat."],["B1","1979","لَا تَتَسَرَّعْ فِي الْحُكْمِ عَلَى الْآخَرِينَ.","Jangan terburu-buru menghakimi orang lain."],["B1","1980","فَكِّرْ مَرَّتَيْنِ قَبْلَ أَنْ تَتَّخِذَ قَرَارًا مُهِمًّا.","Pikirkan dua kali sebelum mengambil keputusan penting."],["B1","1981","خُذْ بِنَصِيحَتِي: ابْدَأْ مُبَكِّرًا وَلَا تُؤَجِّلْ.","Ikuti saranku: mulailah lebih awal dan jangan menunda."],["B1","1982","حَافِظْ عَلَى هُدُوئِكَ حَتَّى فِي أَصْعَبِ الظُّرُوفِ.","Jagalah ketenanganmu bahkan di keadaan tersulit."],["B1","1983","لَا تَثِقْ بِكُلِّ مَا تَسْمَعُ.","Jangan percaya semua yang kamu dengar."],["B1","1984","اسْتَشِرْ أَهْلَ الْخِبْرَةِ قَبْلَ أَنْ تَبْدَأَ.","Konsul
